[workspace]
resolver = "3"
members = ["src-tauri", "crates/core", "crates/devbridge"]

[workspace.package]
version = "0.6.0"
edition = "2024"

[workspace.dependencies]
learnai-core = { path = "crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
tokio = "1.54.1"
thiserror = "2.0.21"
axum = "0.8.9"
tower-http = "0.7.1"
uuid = { version = "1.29.2", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
