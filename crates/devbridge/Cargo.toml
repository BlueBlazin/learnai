[package]
name = "learnai-devbridge"
description = "Dev-only HTTP bridge exposing learnai-core to a plain browser"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
learnai-core.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tower-http = { workspace = true, features = ["cors"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync"] }
futures-util = "0.3"
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
