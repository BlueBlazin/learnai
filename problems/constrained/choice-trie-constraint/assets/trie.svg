<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150">
  <title>The trie of the four choices of the example</title>
  <desc>A trie over token ids: 7 then 12, and 9 then 4 then 3. Under each node is the list allowed_next returns there.</desc>
  <!-- Geometry: a node is a box 112 wide and 22 high at x = 80, 216, 352 by depth and y = 10, 70 by row. -->
  <!-- A node where a choice ends has a second outline inside; the list under a node is allowed_next there. -->

  <!-- Edges, parent to child: one token each -->
  <g fill="none" stroke="currentColor" stroke-width="1">
    <path d="M58 21 L75 21"/>
    <path d="M192 21 L211 21"/>
    <path d="M192 81 L211 81"/>
    <path d="M328 81 L347 81"/>
    <path d="M68 21 V75 Q68 81 74 81 L75 81"/>
  </g>
  <g>
    <polygon points="80,21 73.5,24.3 73.5,17.7"/>
    <polygon points="216,21 209.5,24.3 209.5,17.7"/>
    <polygon points="216,81 209.5,84.3 209.5,77.7"/>
    <polygon points="352,81 345.5,84.3 345.5,77.7"/>
    <polygon points="80,81 73.5,84.3 73.5,77.7"/>
    <circle cx="68" cy="21" r="2.5"/>
  </g>

  <!-- The start: nothing generated yet -->
  <rect x="8" y="10" width="50" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="33" y="25.5" font-size="13" text-anchor="middle">start</text>

  <!-- Nodes: the token id and its text -->
  <rect x="80" y="10" width="112" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="83" y="13" width="106" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="136" y="25.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">7 &quot;yes&quot;</text>
  <rect x="216" y="10" width="112" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="219" y="13" width="106" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="272" y="25.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">12 &quot; please&quot;</text>
  <rect x="80" y="70" width="112" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="83" y="73" width="106" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="136" y="85.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">9 &quot;no&quot;</text>
  <rect x="216" y="70" width="112" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="272" y="85.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">4 &quot;t&quot;</text>
  <rect x="352" y="70" width="112" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="355" y="73" width="106" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="408" y="85.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">3 &quot; sure&quot;</text>

  <!-- What allowed_next returns at each node; 10 is EOS -->
  <g style="font-family: var(--figure-mono)">
    <text x="33" y="52.5" font-size="13" text-anchor="middle">[7, 9]</text>
    <text x="136" y="52.5" font-size="13" text-anchor="middle">[<tspan style="fill: var(--figure-accent)">10</tspan>, 12]</text>
    <text x="272" y="52.5" font-size="13" text-anchor="middle">[<tspan style="fill: var(--figure-accent)">10</tspan>]</text>
    <text x="136" y="112.5" font-size="13" text-anchor="middle">[4, <tspan style="fill: var(--figure-accent)">10</tspan>]</text>
    <text x="272" y="112.5" font-size="13" text-anchor="middle">[3]</text>
    <text x="408" y="112.5" font-size="13" text-anchor="middle">[<tspan style="fill: var(--figure-accent)">10</tspan>]</text>
  </g>

  <!-- The key -->
  <rect x="80" y="124" width="34" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="83" y="127" width="28" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="122" y="137.5" font-size="13">a choice ends</text>
  <text x="254" y="137.5" font-size="13"><tspan style="font-family: var(--figure-mono); fill: var(--figure-accent)">10</tspan> EOS</text>
</svg>
