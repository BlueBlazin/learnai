<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320">
  <title>The automaton of (true|null) with the jumps that multi-byte tokens make</title>
  <desc>An automaton of eight states for (true|null). Solid arrows are byte transitions from state 0 to accepting state 7, and dashed arcs are whole tokens walked from state 0.</desc>
  <!-- Byte transitions: one solid arrow per DFA edge, labeled with its byte. -->
  <g stroke="currentColor" stroke-width="1" fill="none">
    <line x1="46.8" y1="154.2" x2="120.9" y2="120.7"/>
    <line x1="154" y1="112" x2="219" y2="112"/>
    <line x1="254" y1="112" x2="319" y2="112"/>
    <line x1="352.8" y1="117.8" x2="424.1" y2="150.1"/>
    <line x1="46.8" y1="165.8" x2="120.9" y2="199.3"/>
    <line x1="154" y1="208" x2="219" y2="208"/>
    <line x1="254" y1="208" x2="319" y2="208"/>
    <line x1="352.8" y1="202.2" x2="424.1" y2="169.9"/>
  </g>
  <g>
    <polygon points="127.2,117.8 121.3,124 118.6,118.2"/>
    <polygon points="226,112 218,115.2 218,108.8"/>
    <polygon points="326,112 318,115.2 318,108.8"/>
    <polygon points="430.5,153 421.9,152.6 424.5,146.8"/>
    <polygon points="127.2,202.2 118.6,201.8 121.3,196"/>
    <polygon points="226,208 218,211.2 218,204.8"/>
    <polygon points="326,208 318,211.2 318,204.8"/>
    <polygon points="430.5,167 424.5,173.2 421.9,167.4"/>
  </g>
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
    <text x="82.5" y="130.5">t</text>
    <text x="190" y="106">r</text>
    <text x="290" y="106">u</text>
    <text x="396.2" y="129.9">e</text>
    <text x="82.5" y="198.5">n</text>
    <text x="190" y="225">u</text>
    <text x="290" y="225">l</text>
    <text x="396.2" y="199.1">l</text>
  </g>
  <!-- States: 0 is the start, 7 (double circle) is accepting. -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <circle cx="34" cy="160" r="14"/>
    <circle cx="140" cy="112" r="14"/>
    <circle cx="240" cy="112" r="14"/>
    <circle cx="340" cy="112" r="14"/>
    <circle cx="446" cy="160" r="14"/>
    <circle cx="140" cy="208" r="14"/>
    <circle cx="240" cy="208" r="14"/>
    <circle cx="340" cy="208" r="14"/>
    <circle cx="446" cy="160" r="17" stroke-width="1"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="34" y="164.5">0</text>
    <text x="140" y="116.5">2</text>
    <text x="240" y="116.5">4</text>
    <text x="340" y="116.5">6</text>
    <text x="446" y="164.5">7</text>
    <text x="140" y="212.5">1</text>
    <text x="240" y="212.5">3</text>
    <text x="340" y="212.5">5</text>
  </g>
  <!-- Token jumps from state 0: one dashed arc per multi-byte token, landing where its bytes lead. -->
  <g fill="none" stroke-width="1.5" stroke-dasharray="5 3" style="stroke: var(--figure-accent)">
    <path d="M41 147.9 Q136.5 27.8 226.4 96.3"/>
    <path d="M35.9 146.1 Q185.2 -26.6 329.2 94.6"/>
    <path d="M30.6 146.4 Q236.8 -104.8 438.6 137.9"/>
    <path d="M41 172.1 Q136.5 292.2 226.4 223.7"/>
    <path d="M35.9 173.9 Q185.2 346.6 329.2 225.4"/>
    <path d="M30.6 173.6 Q236.8 424.8 438.6 182.1"/>
  </g>
  <g style="fill: var(--figure-accent)">
    <polygon points="232,100.5 223.7,98.2 227.5,93.1"/>
    <polygon points="334.5,99.1 326.3,96.4 330.5,91.5"/>
    <polygon points="443,143.3 435.5,139.2 440.4,135.1"/>
    <polygon points="232,219.5 227.5,226.9 223.7,221.8"/>
    <polygon points="334.5,220.9 330.5,228.5 326.3,223.6"/>
    <polygon points="443,176.7 440.4,184.9 435.5,180.8"/>
  </g>
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-accent)">
    <text x="165.4" y="66.1">tr</text>
    <text x="227.1" y="39.7">tru</text>
    <text x="292.3" y="19.8">true</text>
    <text x="165.4" y="263.9">nu</text>
    <text x="227.1" y="290.3">nul</text>
    <text x="292.3" y="310.2">null</text>
  </g>
  <!-- Legend -->
  <g font-size="13" style="fill: var(--figure-muted)">
    <text x="240" y="156" text-anchor="middle">solid: one byte</text>
    <text x="240" y="174" text-anchor="middle">dashed: one token, from state 0</text>
  </g>
</svg>
