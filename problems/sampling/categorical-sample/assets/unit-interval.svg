<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180">
  <title>Rows 0 and 1 of the example as unit intervals cut at the cumulative sums</title>
  <desc>Each row is a strip from 0 to 1 with one segment per token, as wide as its probability. An arrow marks u in the segment it selects.</desc>
  <!-- Geometry: a cumulative sum c is at x = 60 + 380 c. Row 0 is the strip y = 36..62, row 1 the strip y = 130..156. -->

  <!-- row 0: u = 0.55 lands in token 2 -->
  <text x="50" y="53.5" font-size="13" text-anchor="end" style="fill: var(--figure-muted)">row 0</text>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="60" y="36" width="38" height="26"/>
    <rect x="98" y="36" width="152" height="26"/>
    <rect x="326" y="36" width="114" height="26"/>
  </g>
  <rect x="250" y="36" width="76" height="26" stroke-width="1.5" style="fill: var(--figure-accent); fill-opacity: 0.22; stroke: var(--figure-accent)"/>
  <g font-size="13" text-anchor="middle">
    <text x="79" y="53.5">0</text>
    <text x="174" y="53.5">1</text>
    <text x="288" y="53.5">2</text>
    <text x="383" y="53.5">3</text>
  </g>
  <!-- the cumulative sums at the cuts -->
  <g fill="none" stroke="currentColor" stroke-width="1">
    <path d="M60 62 v5"/>
    <path d="M98 62 v5"/>
    <path d="M250 62 v5"/>
    <path d="M326 62 v5"/>
    <path d="M440 62 v5"/>
  </g>
  <g font-size="13" style="font-family: var(--figure-serif)">
    <text x="98" y="81.5" text-anchor="middle"><tspan font-style="italic" style="font-family: var(--figure-serif)">c</tspan>₀ = 0.1</text>
    <text x="250" y="81.5" text-anchor="middle"><tspan font-style="italic" style="font-family: var(--figure-serif)">c</tspan>₁ = 0.5</text>
    <text x="326" y="81.5" text-anchor="middle"><tspan font-style="italic" style="font-family: var(--figure-serif)">c</tspan>₂ = 0.7</text>
    <text x="440" y="81.5" text-anchor="end"><tspan font-style="italic" style="font-family: var(--figure-serif)">c</tspan>₃ = 1</text>
  </g>
  <!-- the uniform number -->
  <line x1="269" y1="20" x2="269" y2="29" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="269,35 265.7,28.5 272.3,28.5"/>
  <text x="277" y="27.5" font-size="13" style="font-family: var(--figure-serif)"><tspan font-style="italic">u</tspan> = 0.55</text>

  <!-- row 1: u = 0 lands in token 1 -->
  <text x="50" y="147.5" font-size="13" text-anchor="end" style="fill: var(--figure-muted)">row 1</text>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="250" y="130" width="190" height="26"/>
  </g>
  <rect x="60" y="130" width="190" height="26" stroke-width="1.5" style="fill: var(--figure-accent); fill-opacity: 0.22; stroke: var(--figure-accent)"/>
  <g font-size="13" text-anchor="middle">
    <text x="155" y="147.5">1</text>
    <text x="345" y="147.5">3</text>
  </g>
  <!-- the cumulative sums at the cuts -->
  <g fill="none" stroke="currentColor" stroke-width="1">
    <path d="M60 156 v5"/>
    <path d="M250 156 v5"/>
    <path d="M440 156 v5"/>
  </g>
  <g font-size="13" style="font-family: var(--figure-serif)">
    <text x="72" y="175.5" text-anchor="start"><tspan font-style="italic" style="font-family: var(--figure-serif)">c</tspan>₀ = 0</text>
    <text x="250" y="175.5" text-anchor="middle"><tspan font-style="italic" style="font-family: var(--figure-serif)">c</tspan>₁ = <tspan font-style="italic" style="font-family: var(--figure-serif)">c</tspan>₂ = 0.5</text>
    <text x="440" y="175.5" text-anchor="end"><tspan font-style="italic" style="font-family: var(--figure-serif)">c</tspan>₃ = 1</text>
  </g>
  <!-- the uniform number -->
  <line x1="60" y1="114" x2="60" y2="123" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="60,129 56.7,122.5 63.3,122.5"/>
  <text x="68" y="121.5" font-size="13" style="font-family: var(--figure-serif)"><tspan font-style="italic">u</tspan> = 0</text>
</svg>
