<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 224">
  <title>Top-p on row 0 of the example, tokens in rank order</title>
  <desc>Bars are the probabilities 0.4, 0.3, 0.2, 0.1 of tokens 1, 3, 2, 0, and a line joins their cumulative masses. It passes p = 0.6 at token 3.</desc>
  <!-- Geometry: probability v is at y = 176 - 140 v; rank k is the bar centered at x = 50 + 60 k, 36 wide. -->

  <!-- Axes -->
  <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
    <path d="M52 36 V176 H330"/>
    <path d="M48 36 H52"/>
  </g>
  <g font-size="13" text-anchor="end" style="fill: var(--figure-muted)">
    <text x="44" y="40.5">1</text>
    <text x="44" y="180.5">0</text>
  </g>

  <!-- Removed tokens: ranks 3 and 4 -->
  <g fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3">
    <rect x="212" y="148" width="36" height="28"/>
    <rect x="272" y="162" width="36" height="14"/>
  </g>
  <!-- The nucleus: ranks 1 and 2 -->
  <g stroke-width="1.5" style="fill: var(--figure-accent); fill-opacity: 0.22; stroke: var(--figure-accent)">
    <rect x="92" y="120" width="36" height="56"/>
    <rect x="152" y="134" width="36" height="42"/>
  </g>

  <!-- The line at p -->
  <line x1="52" y1="92" x2="330" y2="92" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="336" y="96.5" font-size="13" style="font-family: var(--figure-serif)"><tspan font-style="italic">p</tspan> = 0.6</text>

  <!-- Cumulative mass c_k at every rank -->
  <path d="M110 120 L170 78 L230 50 L290 36" fill="none" stroke-width="1.5" style="stroke: var(--figure-straw)"/>
  <g style="fill: var(--figure-straw)">
    <circle cx="110" cy="120" r="3"/>
    <circle cx="170" cy="78" r="3"/>
    <circle cx="230" cy="50" r="3"/>
    <circle cx="290" cy="36" r="3"/>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="103" y="116">0.4</text>
    <text x="163" y="74">0.7</text>
    <text x="223" y="46">0.9</text>
    <text x="283" y="32">1.0</text>
  </g>

  <!-- Tokens in rank order -->
  <g font-size="13" text-anchor="middle">
    <text x="110" y="192.5">token 1</text>
    <text x="170" y="192.5">token 3</text>
    <text x="230" y="192.5">token 2</text>
    <text x="290" y="192.5">token 0</text>
  </g>
  <path d="M92 199 v5 H188 v-5" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="140" y="219.5" font-size="13" text-anchor="middle">nucleus</text>

  <!-- The key -->
  <line x1="362" y1="40" x2="382" y2="40" fill="none" stroke-width="1.5" style="stroke: var(--figure-straw)"/>
  <circle cx="372" cy="40" r="3" style="fill: var(--figure-straw)"/>
  <text x="388" y="44.5" font-size="13">mass <tspan font-style="italic" style="font-family: var(--figure-serif)">c</tspan>ₖ</text>
  <rect x="362" y="138" width="20" height="12" stroke-width="1.5" style="fill: var(--figure-accent); fill-opacity: 0.22; stroke: var(--figure-accent)"/>
  <text x="388" y="148.5" font-size="13">kept</text>
  <rect x="362" y="160" width="20" height="12" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="388" y="170.5" font-size="13">removed</text>
</svg>
