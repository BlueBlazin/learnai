<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 168">
  <title>Beam search with two beams on the first example</title>
  <desc>Four frames. Three show the live beams of a step with arrows to its four best candidates, and the last shows the finished set beside the live beams.</desc>
  <!-- Geometry: live beams are the boxes x = 58..138, candidates the boxes x = 222..330 at y = 30 + 30 rank; log-probabilities start at x = 338. -->
  <!-- Frames are the groups step-1 to step-4; the app shows one at a time. Their desc is the note of the step. -->

  <!-- Step 1 of the search -->
  <g id="step-1">
    <desc>Step 1 ranks four candidates from the single cache row of the prompt: EOS finishes, and the next two stay live.</desc>
    <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
      <text x="98" y="16.5">live beams</text>
      <text x="276" y="16.5">candidates</text>
      <text x="359" y="16.5" font-style="italic" style="font-family: var(--figure-serif); fill: var(--figure-muted)">S</text>
    </g>
    <!-- parent to candidate: thin for a candidate that is dropped -->
    <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
      <path d="M138 86 L217.6 128.6"/>
    </g>
    <g style="fill: var(--figure-faint)">
      <polygon points="222,131 214.7,130.8 217.8,125"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M138 86 L217.6 43.4"/>
      <path d="M138 86 L217.1 71.9"/>
      <path d="M138 86 L217.1 100.1"/>
    </g>
    <g>
      <polygon points="222,41 217.8,47 214.7,41.2"/>
      <polygon points="222,71 216.2,75.4 215,68.9"/>
      <polygon points="222,101 215,103.1 216.2,96.6"/>
    </g>
    <!-- live beams, one cache row each -->
    <rect x="58" y="75" width="80" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="98" y="90.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[ ]</text>
    <text x="50" y="90.5" font-size="13" text-anchor="end" style="fill: var(--figure-muted)">row 0</text>
    <!-- the 2 n_beams best candidates, rank 0 on top -->
    <rect x="222" y="30" width="108" height="22" rx="5" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
    <text x="276" y="45.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[52]</text>
    <text x="338" y="45.5" font-size="13">−1.350</text>
    <text x="392" y="45.5" font-size="13" style="fill: var(--figure-accent)">finished</text>
    <rect x="222" y="60" width="108" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="276" y="75.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[38]</text>
    <text x="338" y="75.5" font-size="13">−2.216</text>
    <text x="392" y="75.5" font-size="13">live</text>
    <rect x="222" y="90" width="108" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="276" y="105.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[30]</text>
    <text x="338" y="105.5" font-size="13">−2.323</text>
    <text x="392" y="105.5" font-size="13">live</text>
    <rect x="222" y="120" width="108" height="22" rx="5" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <text x="276" y="135.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">[34]</text>
    <text x="338" y="135.5" font-size="13" style="fill: var(--figure-muted)">−3.234</text>
    <!-- the cache rows of the next call -->
    <text x="20" y="162.5" font-size="13">next call: <tspan style="font-family: var(--figure-mono)">cache.select([0, 0])</tspan></text>
  </g>

  <!-- Step 2 of the search -->
  <g id="step-2">
    <desc>Step 2 keeps the best extension of each beam, so the two cache rows stay in place.</desc>
    <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
      <text x="98" y="16.5">live beams</text>
      <text x="276" y="16.5">candidates</text>
      <text x="359" y="16.5" font-style="italic" style="font-family: var(--figure-serif); fill: var(--figure-muted)">S</text>
    </g>
    <!-- parent to candidate: thin for a candidate that is dropped -->
    <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
      <path d="M138 116 L217.1 101.9"/>
      <path d="M138 56 L218.3 127.7"/>
    </g>
    <g style="fill: var(--figure-faint)">
      <polygon points="222,101 216.2,105.4 215,98.9"/>
      <polygon points="222,131 215,129.1 219.3,124.2"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M138 56 L217.1 41.9"/>
      <path d="M138 116 L217.6 73.4"/>
    </g>
    <g>
      <polygon points="222,41 216.2,45.4 215,38.9"/>
      <polygon points="222,71 217.8,77 214.7,71.2"/>
    </g>
    <!-- live beams, one cache row each -->
    <rect x="58" y="45" width="80" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="98" y="60.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[38]</text>
    <text x="50" y="60.5" font-size="13" text-anchor="end" style="fill: var(--figure-muted)">row 0</text>
    <rect x="58" y="105" width="80" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="98" y="120.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[30]</text>
    <text x="50" y="120.5" font-size="13" text-anchor="end" style="fill: var(--figure-muted)">row 1</text>
    <!-- the 2 n_beams best candidates, rank 0 on top -->
    <rect x="222" y="30" width="108" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="276" y="45.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[38, 4]</text>
    <text x="338" y="45.5" font-size="13">−3.412</text>
    <text x="392" y="45.5" font-size="13">live</text>
    <rect x="222" y="60" width="108" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="276" y="75.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[30, 38]</text>
    <text x="338" y="75.5" font-size="13">−3.499</text>
    <text x="392" y="75.5" font-size="13">live</text>
    <rect x="222" y="90" width="108" height="22" rx="5" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <text x="276" y="105.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">[30, 61]</text>
    <text x="338" y="105.5" font-size="13" style="fill: var(--figure-muted)">−3.943</text>
    <rect x="222" y="120" width="108" height="22" rx="5" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <text x="276" y="135.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">[38, 43]</text>
    <text x="338" y="135.5" font-size="13" style="fill: var(--figure-muted)">−4.303</text>
    <!-- the cache rows of the next call -->
    <text x="20" y="162.5" font-size="13">next call: <tspan style="font-family: var(--figure-mono)">cache.select([0, 1])</tspan></text>
  </g>

  <!-- Step 3 of the search -->
  <g id="step-3">
    <desc>In step 3 a hypothesis finishes at rank 0, and both new live beams extend row 1.</desc>
    <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
      <text x="98" y="16.5">live beams</text>
      <text x="276" y="16.5">candidates</text>
      <text x="359" y="16.5" font-style="italic" style="font-family: var(--figure-serif); fill: var(--figure-muted)">S</text>
    </g>
    <!-- parent to candidate: thin for a candidate that is dropped -->
    <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
      <path d="M138 116 L217.1 130.1"/>
    </g>
    <g style="fill: var(--figure-faint)">
      <polygon points="222,131 215,133.1 216.2,126.6"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M138 56 L217.1 41.9"/>
      <path d="M138 116 L217.6 73.4"/>
      <path d="M138 116 L217.1 101.9"/>
    </g>
    <g>
      <polygon points="222,41 216.2,45.4 215,38.9"/>
      <polygon points="222,71 217.8,77 214.7,71.2"/>
      <polygon points="222,101 216.2,105.4 215,98.9"/>
    </g>
    <!-- live beams, one cache row each -->
    <rect x="58" y="45" width="80" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="98" y="60.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[38, 4]</text>
    <text x="50" y="60.5" font-size="13" text-anchor="end" style="fill: var(--figure-muted)">row 0</text>
    <rect x="58" y="105" width="80" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="98" y="120.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[30, 38]</text>
    <text x="50" y="120.5" font-size="13" text-anchor="end" style="fill: var(--figure-muted)">row 1</text>
    <!-- the 2 n_beams best candidates, rank 0 on top -->
    <rect x="222" y="30" width="108" height="22" rx="5" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
    <text x="276" y="45.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[38, 4, 52]</text>
    <text x="338" y="45.5" font-size="13">−3.605</text>
    <text x="392" y="45.5" font-size="13" style="fill: var(--figure-accent)">finished</text>
    <rect x="222" y="60" width="108" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="276" y="75.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[30, 38, 4]</text>
    <text x="338" y="75.5" font-size="13">−4.790</text>
    <text x="392" y="75.5" font-size="13">live</text>
    <rect x="222" y="90" width="108" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="276" y="105.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[30, 38, 55]</text>
    <text x="338" y="105.5" font-size="13">−4.980</text>
    <text x="392" y="105.5" font-size="13">live</text>
    <rect x="222" y="120" width="108" height="22" rx="5" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <text x="276" y="135.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">[30, 38, 34]</text>
    <text x="338" y="135.5" font-size="13" style="fill: var(--figure-muted)">−6.205</text>
    <!-- the cache rows of the next call -->
    <text x="20" y="162.5" font-size="13">next call: <tspan style="font-family: var(--figure-mono)">cache.select([1, 1])</tspan></text>
  </g>

  <!-- The stop after step 3 -->
  <g id="step-4">
    <desc>The finished set is full and the best live beam, −4.790, is below its worst score, so that call is never made.</desc>
    <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
      <text x="112" y="16.5">finished set</text>
      <text x="276" y="16.5">live beams</text>
    </g>
    <rect x="58" y="30" width="108" height="22" rx="5" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
    <text x="112" y="45.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[52]</text>
    <text x="174" y="45.5" font-size="13">−1.350</text>
    <rect x="58" y="60" width="108" height="22" rx="5" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
    <text x="112" y="75.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[38, 4, 52]</text>
    <text x="174" y="75.5" font-size="13">−3.605</text>
    <rect x="222" y="30" width="108" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="276" y="45.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[30, 38, 4]</text>
    <text x="338" y="45.5" font-size="13">−4.790</text>
    <rect x="222" y="60" width="108" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="276" y="75.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">[30, 38, 55]</text>
    <text x="338" y="75.5" font-size="13">−4.980</text>
    <!-- the stopping rule: best live log-probability against the worst finished score -->
    <text x="58" y="115.5" font-size="13">−4.790 ≤ −3.605</text>
    <!-- the call that is not made -->
    <text x="20" y="162.5" font-size="13" style="fill: var(--figure-muted)">not called: <tspan style="font-family: var(--figure-mono)">cache.select([1, 1])</tspan></text>
  </g>
</svg>
