<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 90">
  <title>The stream of the example after four of its pieces</title>
  <desc>Four frames. Each shows the text so far as one cell per character, with the emitted part, the held-back suffix, and the newest piece marked.</desc>
  <!-- Geometry: character j is the cell at x = 20 + 22 j, 20 wide, y = 36..60. The newest piece is bracketed above, the parts are named below. -->
  <!-- Frames are the groups step-1 to step-4; the app shows one at a time. Their desc is the note of the step. -->

  <!-- Piece 2, ".\n" -->
  <g id="step-1">
    <desc>The second piece ends in a newline that could begin the stop "\nUser:", so the newline is held back.</desc>
    <!-- the newest piece -->
    <path d="M108 31 v-5 H150 v5" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="129" y="16.5" font-size="13" text-anchor="middle">new piece</text>
    <!-- emitted -->
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="20" y="36" width="20" height="24" rx="3"/>
      <rect x="42" y="36" width="20" height="24" rx="3"/>
      <rect x="64" y="36" width="20" height="24" rx="3"/>
      <rect x="86" y="36" width="20" height="24" rx="3"/>
      <rect x="108" y="36" width="20" height="24" rx="3"/>
      <path d="M20 65 v5 H128 v-5"/>
    </g>
    <text x="74" y="86.5" font-size="13" text-anchor="middle">emitted</text>
    <!-- held back: the state kept for the next call -->
    <g stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)">
      <rect x="130" y="36" width="20" height="24" rx="3"/>
    </g>
    <path d="M130 65 v5 H150 v-5" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="140" y="86.5" font-size="13" text-anchor="middle">held back</text>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
      <text x="30" y="52.5">S</text>
      <text x="52" y="52.5">u</text>
      <text x="74" y="52.5">r</text>
      <text x="96" y="52.5">e</text>
      <text x="118" y="52.5">.</text>
      <text x="140" y="52.5">\n</text>
    </g>
  </g>

  <!-- Piece 3, "Us" -->
  <g id="step-2">
    <desc>The piece "Us" extends the partial match, so nothing is emitted and three characters are held.</desc>
    <!-- the newest piece -->
    <path d="M152 31 v-5 H194 v5" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="173" y="16.5" font-size="13" text-anchor="middle">new piece</text>
    <!-- emitted -->
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="20" y="36" width="20" height="24" rx="3"/>
      <rect x="42" y="36" width="20" height="24" rx="3"/>
      <rect x="64" y="36" width="20" height="24" rx="3"/>
      <rect x="86" y="36" width="20" height="24" rx="3"/>
      <rect x="108" y="36" width="20" height="24" rx="3"/>
      <path d="M20 65 v5 H128 v-5"/>
    </g>
    <text x="74" y="86.5" font-size="13" text-anchor="middle">emitted</text>
    <!-- held back: the state kept for the next call -->
    <g stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)">
      <rect x="130" y="36" width="20" height="24" rx="3"/>
      <rect x="152" y="36" width="20" height="24" rx="3"/>
      <rect x="174" y="36" width="20" height="24" rx="3"/>
    </g>
    <path d="M130 65 v5 H194 v-5" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="162" y="86.5" font-size="13" text-anchor="middle">held back</text>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
      <text x="30" y="52.5">S</text>
      <text x="52" y="52.5">u</text>
      <text x="74" y="52.5">r</text>
      <text x="96" y="52.5">e</text>
      <text x="118" y="52.5">.</text>
      <text x="140" y="52.5">\n</text>
      <text x="162" y="52.5">U</text>
      <text x="184" y="52.5">s</text>
    </g>
  </g>

  <!-- Piece 4, "e #" -->
  <g id="step-3">
    <desc>The piece "e #" breaks the match: the held text is released, and the new "#" is held for "###".</desc>
    <!-- the newest piece -->
    <path d="M196 31 v-5 H260 v5" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="228" y="16.5" font-size="13" text-anchor="middle">new piece</text>
    <!-- emitted -->
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="20" y="36" width="20" height="24" rx="3"/>
      <rect x="42" y="36" width="20" height="24" rx="3"/>
      <rect x="64" y="36" width="20" height="24" rx="3"/>
      <rect x="86" y="36" width="20" height="24" rx="3"/>
      <rect x="108" y="36" width="20" height="24" rx="3"/>
      <rect x="130" y="36" width="20" height="24" rx="3"/>
      <rect x="152" y="36" width="20" height="24" rx="3"/>
      <rect x="174" y="36" width="20" height="24" rx="3"/>
      <rect x="196" y="36" width="20" height="24" rx="3"/>
      <rect x="218" y="36" width="20" height="24" rx="3"/>
      <path d="M20 65 v5 H238 v-5"/>
    </g>
    <text x="129" y="86.5" font-size="13" text-anchor="middle">emitted</text>
    <!-- held back: the state kept for the next call -->
    <g stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)">
      <rect x="240" y="36" width="20" height="24" rx="3"/>
    </g>
    <path d="M240 65 v5 H260 v-5" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="250" y="86.5" font-size="13" text-anchor="middle">held back</text>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
      <text x="30" y="52.5">S</text>
      <text x="52" y="52.5">u</text>
      <text x="74" y="52.5">r</text>
      <text x="96" y="52.5">e</text>
      <text x="118" y="52.5">.</text>
      <text x="140" y="52.5">\n</text>
      <text x="162" y="52.5">U</text>
      <text x="184" y="52.5">s</text>
      <text x="206" y="52.5">e</text>
      <text x="228" y="52.5">␣</text>
      <text x="250" y="52.5">#</text>
    </g>
  </g>

  <!-- Piece 7, ":" -->
  <g id="step-4">
    <desc>Three pieces later the colon completes "\nUser:", so the stream stops and none of the stop string is emitted.</desc>
    <!-- the newest piece -->
    <path d="M438 31 v-5 H458 v5" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="476" y="16.5" font-size="13" text-anchor="end">new piece</text>
    <!-- emitted -->
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="20" y="36" width="20" height="24" rx="3"/>
      <rect x="42" y="36" width="20" height="24" rx="3"/>
      <rect x="64" y="36" width="20" height="24" rx="3"/>
      <rect x="86" y="36" width="20" height="24" rx="3"/>
      <rect x="108" y="36" width="20" height="24" rx="3"/>
      <rect x="130" y="36" width="20" height="24" rx="3"/>
      <rect x="152" y="36" width="20" height="24" rx="3"/>
      <rect x="174" y="36" width="20" height="24" rx="3"/>
      <rect x="196" y="36" width="20" height="24" rx="3"/>
      <rect x="218" y="36" width="20" height="24" rx="3"/>
      <rect x="240" y="36" width="20" height="24" rx="3"/>
      <rect x="262" y="36" width="20" height="24" rx="3"/>
      <rect x="284" y="36" width="20" height="24" rx="3"/>
      <rect x="306" y="36" width="20" height="24" rx="3"/>
      <path d="M20 65 v5 H326 v-5"/>
    </g>
    <text x="173" y="86.5" font-size="13" text-anchor="middle">emitted</text>
    <!-- the completed stop string, never emitted -->
    <g fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)">
      <rect x="328" y="36" width="20" height="24" rx="3"/>
      <rect x="350" y="36" width="20" height="24" rx="3"/>
      <rect x="372" y="36" width="20" height="24" rx="3"/>
      <rect x="394" y="36" width="20" height="24" rx="3"/>
      <rect x="416" y="36" width="20" height="24" rx="3"/>
      <rect x="438" y="36" width="20" height="24" rx="3"/>
    </g>
    <path d="M328 65 v5 H458 v-5" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="393" y="86.5" font-size="13" text-anchor="middle">stop string</text>
    <!-- the cut -->
    <line x1="327" y1="22" x2="327" y2="64" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
    <text x="327" y="16.5" font-size="13" text-anchor="middle" style="fill: var(--figure-accent)">cut</text>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
      <text x="30" y="52.5">S</text>
      <text x="52" y="52.5">u</text>
      <text x="74" y="52.5">r</text>
      <text x="96" y="52.5">e</text>
      <text x="118" y="52.5">.</text>
      <text x="140" y="52.5">\n</text>
      <text x="162" y="52.5">U</text>
      <text x="184" y="52.5">s</text>
      <text x="206" y="52.5">e</text>
      <text x="228" y="52.5">␣</text>
      <text x="250" y="52.5">#</text>
      <text x="272" y="52.5">#</text>
      <text x="294" y="52.5">1</text>
      <text x="316" y="52.5">.</text>
      <text x="338" y="52.5" style="fill: var(--figure-muted)">\n</text>
      <text x="360" y="52.5" style="fill: var(--figure-muted)">U</text>
      <text x="382" y="52.5" style="fill: var(--figure-muted)">s</text>
      <text x="404" y="52.5" style="fill: var(--figure-muted)">e</text>
      <text x="426" y="52.5" style="fill: var(--figure-muted)">r</text>
      <text x="448" y="52.5" style="fill: var(--figure-muted)">:</text>
    </g>
  </g>
</svg>
