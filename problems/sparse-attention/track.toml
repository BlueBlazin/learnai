title = "Indexed and Compressed Attention"
description = "Even in a massive prompt, a token rarely needs to attend to every single word that came before it. Sparse attention scores the past with a lightweight indexer first, then runs full attention over only the top-k positions. Build the indexer selection, gathered sparse attention, compressed KV streams, and decoding caches that keep long-context inference fast."
