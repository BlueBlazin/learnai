<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190">
  <title>The stream, the buffer, and the entries over the two calls of the example</title>
  <desc>Four frames. Each shows four stream rows in two windows of two, the row waiting in the buffer, and the entries emitted so far.</desc>
  <!-- Geometry: row i of the stream is the column at x = 120 + 64 i, 62 wide. The stream is the row y = 24..50, the buffer y = 92..118, the entries y = 126..152, the visible counts at y = 177.5. -->
  <!-- Frames are the groups step-1 to step-4; the app shows one at a time. Their desc is the note of the step. -->

  <!-- In every frame: the row numbers, the windows, and the row names -->
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="151" y="16.5">0</text>
    <text x="215" y="16.5">1</text>
    <text x="279" y="16.5">2</text>
    <text x="343" y="16.5">3</text>
  </g>
  <text x="110" y="16.5" font-size="13" text-anchor="end" font-style="italic" style="font-family: var(--figure-serif); fill: var(--figure-muted)">i</text>
  <text x="110" y="41.5" font-size="13" text-anchor="end" style="font-family: var(--figure-mono)">kv, gate</text>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <path d="M120 55 v5 H246 v-5"/>
    <path d="M248 55 v5 H374 v-5"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="183" y="76.5">window 0</text>
    <text x="311" y="76.5">window 1</text>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="110" y="109.5">buffer</text>
    <text x="110" y="143.5">entries</text>
  </g>

  <!-- After call 1: rows 0, 1, 2 -->
  <g id="step-1">
    <desc>Call 1 brings three rows: window 0 becomes an entry and row 2 waits in the buffer.</desc>
    <!-- brought by this call -->
    <g fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="120" y="24" width="62" height="26" rx="3"/>
      <rect x="184" y="24" width="62" height="26" rx="3"/>
      <rect x="248" y="24" width="62" height="26" rx="3"/>
    </g>
    <!-- not yet arrived -->
    <rect x="312" y="24" width="62" height="26" rx="3" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <!-- the buffer holds row 2 -->
    <rect x="248" y="92" width="62" height="26" rx="3" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <!-- the entries; a heavier outline is one this call emits -->
    <rect x="120" y="126" width="126" height="26" rx="3" stroke="currentColor" stroke-width="1.5" fill-opacity="0.4" style="fill: var(--figure-cache)"/>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-serif)">
      <text x="183" y="143.5"><tspan font-style="italic">e</tspan>₀</text>
    </g>
    <text x="384" y="143.5" font-size="13" style="font-family: var(--figure-mono)">count = 1</text>
  </g>

  <!-- Call 2 arrives: row 3 -->
  <g id="step-2">
    <desc>Call 2 brings row 3, which follows the waiting row 2 in window 1.</desc>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="120" y="24" width="62" height="26" rx="3"/>
      <rect x="184" y="24" width="62" height="26" rx="3"/>
      <rect x="248" y="24" width="62" height="26" rx="3"/>
    </g>
    <!-- brought by this call -->
    <g fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="312" y="24" width="62" height="26" rx="3"/>
    </g>
    <!-- the buffer holds row 2 -->
    <rect x="248" y="92" width="62" height="26" rx="3" stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)"/>
    <!-- the entries; a heavier outline is one this call emits -->
    <rect x="120" y="126" width="126" height="26" rx="3" stroke="currentColor" stroke-width="1" fill-opacity="0.4" style="fill: var(--figure-cache)"/>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-serif)">
      <text x="183" y="143.5"><tspan font-style="italic">e</tspan>₀</text>
    </g>
    <text x="384" y="143.5" font-size="13" style="font-family: var(--figure-mono)">count = 1</text>
  </g>

  <!-- After call 2: window 1 emitted, the buffer empty -->
  <g id="step-3">
    <desc>Window 1 is complete, so call 2 returns its entry and an empty buffer.</desc>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="120" y="24" width="62" height="26" rx="3"/>
      <rect x="184" y="24" width="62" height="26" rx="3"/>
      <rect x="248" y="24" width="62" height="26" rx="3"/>
    </g>
    <!-- brought by this call -->
    <g fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="312" y="24" width="62" height="26" rx="3"/>
    </g>
    <!-- the entries; a heavier outline is one this call emits -->
    <rect x="120" y="126" width="126" height="26" rx="3" stroke="currentColor" stroke-width="1" fill-opacity="0.4" style="fill: var(--figure-cache)"/>
    <rect x="248" y="126" width="126" height="26" rx="3" stroke="currentColor" stroke-width="1.5" fill-opacity="0.4" style="fill: var(--figure-cache)"/>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-serif)">
      <text x="183" y="143.5"><tspan font-style="italic">e</tspan>₀</text>
      <text x="311" y="143.5"><tspan font-style="italic">e</tspan>₁</text>
    </g>
    <text x="384" y="143.5" font-size="13" style="font-family: var(--figure-mono)">count = 2</text>
  </g>

  <!-- visible_entries(t, 2) for the query at each position -->
  <g id="step-4">
    <desc>The query at position t sees the entries of the windows that end at or before t.</desc>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="120" y="24" width="62" height="26" rx="3"/>
      <rect x="184" y="24" width="62" height="26" rx="3"/>
      <rect x="248" y="24" width="62" height="26" rx="3"/>
      <rect x="312" y="24" width="62" height="26" rx="3"/>
    </g>
    <!-- the entries; a heavier outline is one this call emits -->
    <rect x="120" y="126" width="126" height="26" rx="3" stroke="currentColor" stroke-width="1" fill-opacity="0.4" style="fill: var(--figure-cache)"/>
    <rect x="248" y="126" width="126" height="26" rx="3" stroke="currentColor" stroke-width="1" fill-opacity="0.4" style="fill: var(--figure-cache)"/>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-serif)">
      <text x="183" y="143.5"><tspan font-style="italic">e</tspan>₀</text>
      <text x="311" y="143.5"><tspan font-style="italic">e</tspan>₁</text>
    </g>
    <text x="384" y="143.5" font-size="13" style="font-family: var(--figure-mono)">count = 2</text>
    <text x="110" y="177.5" font-size="13" text-anchor="end">visible</text>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-serif)">
      <text x="151" y="177.5">0</text>
      <text x="215" y="177.5">1</text>
      <text x="279" y="177.5">1</text>
      <text x="343" y="177.5">2</text>
    </g>
  </g>
</svg>
