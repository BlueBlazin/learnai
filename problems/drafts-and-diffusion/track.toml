id = "drafts-and-diffusion"
title = "Built-in Drafts and Text Diffusion"
description = "Generating strictly one token per forward pass is no longer the only way a language model can produce text. New checkpoints ship with chained multi-token prediction heads built right into the model, while text diffusion decodes whole blocks in parallel over a cached prefix. Implement both paradigms and see how decoding moves beyond single-token steps."
