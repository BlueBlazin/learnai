<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 252">
  <title>What the program for output row 0 and batch row 0 of the worked example reads, column by column</title>
  <desc>Five aligned rows over eight columns, the activations, the 4-bit codes, the two groups' scales and biases, the dashed weights that are never stored, and the single stored sum.</desc>

  <!-- Column numbers -->
  <text x="10" y="18" font-size="13" style="fill: var(--figure-muted)">column</text>
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="140" y="18">0</text>
    <text x="184" y="18">1</text>
    <text x="228" y="18">2</text>
    <text x="272" y="18">3</text>
    <text x="316" y="18">4</text>
    <text x="360" y="18">5</text>
    <text x="404" y="18">6</text>
    <text x="448" y="18">7</text>
  </g>

  <!-- The activations of batch row 0 -->
  <text x="10" y="44" font-size="13">x, batch row 0</text>
  <g fill="none" stroke-width="1.5" stroke="currentColor">
    <rect x="118" y="26" width="44" height="26"/>
    <rect x="162" y="26" width="44" height="26"/>
    <rect x="206" y="26" width="44" height="26"/>
    <rect x="250" y="26" width="44" height="26"/>
    <rect x="294" y="26" width="44" height="26"/>
    <rect x="338" y="26" width="44" height="26"/>
    <rect x="382" y="26" width="44" height="26"/>
    <rect x="426" y="26" width="44" height="26"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="140" y="44">1</text>
    <text x="184" y="44">2</text>
    <text x="228" y="44">−1</text>
    <text x="272" y="44">0.5</text>
    <text x="316" y="44">0</text>
    <text x="360" y="44">1</text>
    <text x="404" y="44">1</text>
    <text x="448" y="44">−1</text>
  </g>

  <!-- The codes of output row 0: the hexadecimal digits of 0xAF30F085, from the right -->
  <text x="10" y="80" font-size="13">codes, row 0</text>
  <g fill="none" stroke-width="1.5" stroke="currentColor">
    <rect x="118" y="62" width="44" height="26"/>
    <rect x="162" y="62" width="44" height="26"/>
    <rect x="206" y="62" width="44" height="26"/>
    <rect x="250" y="62" width="44" height="26"/>
    <rect x="294" y="62" width="44" height="26"/>
    <rect x="338" y="62" width="44" height="26"/>
    <rect x="382" y="62" width="44" height="26"/>
    <rect x="426" y="62" width="44" height="26"/>
  </g>
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
    <text x="140" y="80">5</text>
    <text x="184" y="80">8</text>
    <text x="228" y="80">0</text>
    <text x="272" y="80">15</text>
    <text x="316" y="80">0</text>
    <text x="360" y="80">3</text>
    <text x="404" y="80">15</text>
    <text x="448" y="80">10</text>
  </g>
  <text x="118" y="106" font-size="13" style="fill: var(--figure-muted)">word <tspan style="font-family: var(--figure-mono)">0xAF30F085</tspan>, lowest four bits first</text>

  <!-- Two groups of four columns, each with one scale and one bias -->
  <text x="10" y="134" font-size="13">groups, row 0</text>
  <rect x="118" y="116" width="176" height="26" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
  <rect x="294" y="116" width="176" height="26" fill="none" stroke-width="1.5" stroke-dasharray="6 3" style="stroke: var(--figure-straw)"/>
  <text x="206" y="134" font-size="13" text-anchor="middle" style="fill: var(--figure-accent)">scale 0.1, bias −0.5</text>
  <text x="382" y="134" font-size="13" text-anchor="middle" style="fill: var(--figure-straw)">scale 0.06, bias 2.0</text>

  <!-- The weights: computed per column, kept in registers, never stored -->
  <text x="10" y="178" font-size="13">weight</text>
  <g fill="none" stroke-width="1" stroke-dasharray="4 3" style="stroke: var(--figure-faint)">
    <rect x="118" y="160" width="44" height="26"/>
    <rect x="162" y="160" width="44" height="26"/>
    <rect x="206" y="160" width="44" height="26"/>
    <rect x="250" y="160" width="44" height="26"/>
    <rect x="294" y="160" width="44" height="26"/>
    <rect x="338" y="160" width="44" height="26"/>
    <rect x="382" y="160" width="44" height="26"/>
    <rect x="426" y="160" width="44" height="26"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="140" y="178">0.0</text>
    <text x="184" y="178">0.3</text>
    <text x="228" y="178">−0.5</text>
    <text x="272" y="178">1.0</text>
    <text x="316" y="178">2.0</text>
    <text x="360" y="178">2.18</text>
    <text x="404" y="178">2.9</text>
    <text x="448" y="178">2.6</text>
  </g>
  <text x="118" y="204" font-size="13" style="fill: var(--figure-muted)">code · scale + bias: in registers, never stored</text>

  <!-- The one value the program stores -->
  <text x="10" y="238" font-size="13">y[0, 0] = Σ x · weight = 4.08, the only element this program stores</text>
</svg>
