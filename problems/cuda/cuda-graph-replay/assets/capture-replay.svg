<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 212">
  <title>What a call of a graphed step does: copy in, replay, clone out</title>
  <desc>Three boxes in a row, the static input, the captured graph, and the static output. The caller's input enters through copy_ and the result leaves through clone.</desc>

  <!-- The caller's new input -->
  <rect x="24" y="14" width="124" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="86" y="34" font-size="13" text-anchor="middle">new input</text>

  <!-- copy_ arrow -->
  <line x1="86" y1="44" x2="86" y2="78" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
  <polygon points="86,86 81,76 91,76" style="fill: var(--figure-accent)"/>
  <text x="96" y="66" font-size="13" style="fill: var(--figure-accent); font-family: var(--figure-mono)">copy_</text>

  <!-- The three static things -->
  <rect x="24" y="88" width="124" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="86" y="111" font-size="13" text-anchor="middle">static input</text>

  <rect x="186" y="80" width="108" height="52" rx="3" fill="none" stroke-width="1.5" stroke-dasharray="5 3" style="stroke: var(--figure-straw)"/>
  <text x="240" y="102" font-size="13" text-anchor="middle" style="fill: var(--figure-straw)">captured graph</text>
  <text x="240" y="120" font-size="13" text-anchor="middle" style="fill: var(--figure-straw); font-family: var(--figure-mono)">replay()</text>

  <rect x="332" y="88" width="124" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="394" y="111" font-size="13" text-anchor="middle">static output</text>

  <!-- reads / writes -->
  <line x1="148" y1="106" x2="178" y2="106" fill="none" stroke="currentColor" stroke-width="1"/>
  <polygon points="186,106 177,102 177,110"/>
  <line x1="294" y1="106" x2="324" y2="106" fill="none" stroke="currentColor" stroke-width="1"/>
  <polygon points="332,106 323,102 323,110"/>
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="167" y="124">reads</text>
    <text x="313" y="124">writes</text>
    <text x="240" y="152">the same addresses at every replay</text>
  </g>

  <!-- clone arrow -->
  <line x1="394" y1="124" x2="394" y2="160" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
  <polygon points="394,168 389,158 399,158" style="fill: var(--figure-accent)"/>
  <text x="404" y="150" font-size="13" style="fill: var(--figure-accent); font-family: var(--figure-mono)">clone</text>

  <!-- The result handed out -->
  <rect x="332" y="170" width="124" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="394" y="190" font-size="13" text-anchor="middle">result</text>

  <text x="24" y="190" font-size="13" style="fill: var(--figure-muted)">the caller's tensors are other memory</text>
</svg>
