<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 268">
  <title>Architecture of the gateway: admission, queue, dispatcher, replicas, and the autoscaling evaluation</title>
  <desc>A block diagram of the gateway. A request passes admission, waits in the queue, and is dispatched to one of three replicas, with an evaluate step that scales them.</desc>

  <!-- admission -->
  <g font-size="13">
    <text x="8" y="18">submit(request)</text>
    <line x1="52" y1="24" x2="52" y2="40" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="52,46 48,38 56,38"/>
    <rect x="8" y="48" width="112" height="84" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="64" y="68" text-anchor="middle">admission</text>
    <text x="64" y="92" text-anchor="middle" style="fill: var(--figure-muted)">1 tenant bucket</text>
    <text x="64" y="110" text-anchor="middle" style="fill: var(--figure-muted)">2 queue bounds</text>
    <!-- rejected -->
    <line x1="64" y1="132" x2="64" y2="152" fill="none" stroke-width="1.5" stroke-dasharray="4 3" style="stroke: var(--figure-straw)"/>
    <polygon points="64,158 60,150 68,150" style="fill: var(--figure-straw)"/>
    <text x="64" y="174" text-anchor="middle" style="fill: var(--figure-straw)">Rejected</text>
  </g>

  <!-- queue -->
  <line x1="120" y1="78" x2="140" y2="78" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="146,78 138,74 138,82"/>
  <g font-size="13">
    <rect x="148" y="48" width="84" height="84" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="190" y="68" text-anchor="middle">gateway</text>
    <text x="190" y="84" text-anchor="middle">queue</text>
    <rect x="160" y="96" width="14" height="22" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="178" y="96" width="14" height="22" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="196" y="96" width="14" height="22" fill="none" stroke="currentColor" stroke-width="1"/>
  </g>

  <!-- dispatcher -->
  <line x1="232" y1="78" x2="252" y2="78" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="258,78 250,74 250,82"/>
  <g font-size="13">
    <rect x="260" y="48" width="118" height="84" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
    <text x="319" y="68" text-anchor="middle" style="fill: var(--figure-accent)">dispatch</text>
    <text x="319" y="92" text-anchor="middle">which request</text>
    <text x="319" y="110" text-anchor="middle">which replica</text>
  </g>

  <!-- replicas -->
  <g font-size="13">
    <rect x="410" y="34" width="62" height="28" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="441" y="53" text-anchor="middle">replica 0</text>
    <rect x="410" y="76" width="62" height="28" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="441" y="95" text-anchor="middle">replica 1</text>
    <rect x="410" y="118" width="62" height="28" fill="none" stroke-width="1.5" stroke-dasharray="4 3" style="stroke: var(--figure-muted)"/>
    <text x="441" y="137" text-anchor="middle" style="fill: var(--figure-muted)">starting</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <line x1="378" y1="70" x2="402" y2="52"/>
    <line x1="378" y1="90" x2="402" y2="90"/>
  </g>
  <polygon points="408,48 399,49 404,56"/>
  <polygon points="408,90 400,86 400,94"/>

  <!-- completions back -->
  <path d="M 441 146 L 441 200 L 319 200 L 319 140" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="319,134 315,142 323,142"/>
  <text x="380" y="218" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">completions</text>

  <!-- evaluate -->
  <g font-size="13">
    <rect x="148" y="214" width="150" height="46" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="223" y="234" text-anchor="middle">evaluate(): how many</text>
    <text x="223" y="250" text-anchor="middle">replicas, every second</text>
    <line x1="190" y1="132" x2="190" y2="206" fill="none" stroke-width="1" style="stroke: var(--figure-faint)"/>
    <polygon points="190,212 186,204 194,204" style="fill: var(--figure-muted)"/>
    <text x="182" y="176" text-anchor="end" style="fill: var(--figure-muted)">backlog</text>
  </g>
</svg>
