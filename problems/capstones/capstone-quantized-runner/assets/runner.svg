<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 318">
  <title>The quantized runner: checkpoint layout and the cached forward step</title>
  <desc>Left: float parameters are quantized into a checkpoint of packed codes, one scale and one bias per group, and float norm gains; the float matrices are not stored. Right: a step reads only that checkpoint, from the embedding rows through blocks that multiply by codes and append to the KV cache to a head that reuses the embedding codes and yields logits.</desc>

  <!-- float parameters -->
  <g font-size="13">
    <rect x="8" y="26" width="120" height="44" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="68" y="44" text-anchor="middle">float params</text>
    <text x="68" y="61" text-anchor="middle" style="fill: var(--figure-muted)">32 bits per weight</text>
    <line x1="68" y1="70" x2="68" y2="96" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="68,102 64,94 72,94"/>
    <text x="76" y="90" style="fill: var(--figure-muted)">stage 1, 4</text>
  </g>

  <!-- checkpoint -->
  <g font-size="13">
    <rect x="8" y="104" width="200" height="206" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
    <text x="18" y="124" style="fill: var(--figure-accent)">checkpoint (all that is stored)</text>
    <text x="18" y="148" style="font-family: var(--figure-mono)">P.weight</text>
    <text x="18" y="165" style="fill: var(--figure-muted)">bytes, (out, in · bits / 8)</text>
    <!-- a byte with two nibbles -->
    <rect x="18" y="174" width="44" height="22" fill="none" stroke="currentColor"/>
    <line x1="40" y1="174" x2="40" y2="196" fill="none" stroke="currentColor"/>
    <text x="29" y="190" text-anchor="middle">c₁</text>
    <text x="51" y="190" text-anchor="middle">c₀</text>
    <text x="70" y="190" style="fill: var(--figure-muted)">4 bits: two per byte</text>
    <text x="18" y="222" style="font-family: var(--figure-mono)">P.scales, P.biases</text>
    <text x="18" y="239" style="fill: var(--figure-muted)">float32, one per group</text>
    <text x="18" y="265" style="font-family: var(--figure-mono)">*norm.weight</text>
    <text x="18" y="282" style="fill: var(--figure-muted)">float32 gains, unchanged</text>
    <text x="18" y="302" style="fill: var(--figure-straw)">no float matrix</text>
  </g>

  <!-- the step -->
  <g font-size="13">
    <text x="252" y="18">token ids</text>
    <line x1="350" y1="22" x2="350" y2="34" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="350,40 346,32 354,32"/>
    <rect x="252" y="42" width="196" height="38" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-embed)"/>
    <text x="350" y="58" text-anchor="middle">embed: dequantize the</text>
    <text x="350" y="74" text-anchor="middle">rows that are looked up</text>
    <line x1="350" y1="80" x2="350" y2="94" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="350,100 346,92 354,92"/>

    <rect x="252" y="102" width="196" height="118" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-linear)"/>
    <text x="262" y="120">block × n_layers</text>
    <text x="262" y="142" style="fill: var(--figure-muted)">q, k, v, o, MLP: x · codes,</text>
    <text x="262" y="158" style="fill: var(--figure-muted)">scaled and biased per group</text>
    <rect x="262" y="170" width="176" height="40" stroke-width="1.5" stroke-dasharray="4 3" style="fill: var(--figure-cache); stroke: var(--figure-straw)"/>
    <text x="350" y="187" text-anchor="middle" style="fill: var(--figure-straw)">KV cache: rotated keys,</text>
    <text x="350" y="203" text-anchor="middle" style="fill: var(--figure-straw)">values; S grows by T</text>
    <line x1="350" y1="220" x2="350" y2="234" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="350,240 346,232 354,232"/>

    <rect x="252" y="242" width="196" height="38" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="350" y="258" text-anchor="middle">norm, head: x · codes of</text>
    <text x="350" y="274" text-anchor="middle">the embedding (tied)</text>
    <line x1="350" y1="280" x2="350" y2="292" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="350,298 346,290 354,290"/>
    <text x="350" y="312" text-anchor="middle">logits</text>
  </g>

  <!-- checkpoint feeds every box -->
  <g fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)">
    <line x1="226" y1="61" x2="244" y2="61"/>
    <line x1="226" y1="150" x2="244" y2="150"/>
    <line x1="226" y1="261" x2="244" y2="261"/>
    <line x1="226" y1="61" x2="226" y2="261"/>
    <line x1="208" y1="200" x2="226" y2="200"/>
  </g>
  <g style="fill: var(--figure-accent)">
    <polygon points="250,61 242,57 242,65"/>
    <polygon points="250,150 242,146 242,154"/>
    <polygon points="250,261 242,257 242,265"/>
  </g>
</svg>
