<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 318">
  <title>Architecture of the structured-output server</title>
  <desc>A block diagram of the server. A request passes validation, the compilation cache, the masked generation loop, and the tool-call parser, with a disconnect watcher beside the loop.</desc>

  <!-- request and validation -->
  <g font-size="13">
    <text x="8" y="18">POST /v1/chat/completions</text>
    <line x1="60" y1="24" x2="60" y2="38" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="60,44 56,36 64,36"/>
    <rect x="8" y="46" width="136" height="58" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="18" y="66">route, validate</text>
    <text x="18" y="84" style="fill: var(--figure-muted)">404, 405, 400</text>
    <text x="18" y="98" style="fill: var(--figure-muted)">before any byte</text>
  </g>

  <!-- compilation cache -->
  <g font-size="13">
    <rect x="176" y="46" width="296" height="58" stroke-width="1.5" style="fill: var(--figure-cache); stroke: var(--figure-accent)"/>
    <text x="186" y="66" style="fill: var(--figure-accent)">compilation cache, keyed by schema text</text>
    <text x="186" y="84">schema → regex → DFA → token index</text>
    <text x="186" y="98" style="fill: var(--figure-muted)">once per schema; later requests look up</text>
  </g>
  <line x1="144" y1="75" x2="168" y2="75" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="174,75 166,71 166,79"/>
  <text x="160" y="40" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">schema</text>

  <!-- model -->
  <g font-size="13">
    <rect x="8" y="140" width="136" height="76" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="18" y="160">model</text>
    <text x="18" y="178" style="fill: var(--figure-muted)">lm.stream(prompt,</text>
    <text x="18" y="194" style="fill: var(--figure-muted)">max_tokens)</text>
    <text x="18" y="210" style="fill: var(--figure-muted)">one row per step</text>
  </g>

  <!-- loop -->
  <g font-size="13">
    <rect x="176" y="140" width="296" height="76" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="186" y="160">generation loop, state q</text>
    <text x="186" y="178">candidates: index[q], and EOS if q accepts</text>
    <text x="186" y="194">token: largest logit, lowest id</text>
    <text x="186" y="210" style="fill: var(--figure-muted)">EOS: stop; rows ran out: length</text>
  </g>
  <line x1="144" y1="168" x2="168" y2="168" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="174,168 166,164 166,172"/>
  <text x="160" y="134" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">logits</text>
  <!-- cache -> loop -->
  <line x1="324" y1="104" x2="324" y2="132" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
  <polygon points="324,138 320,130 328,130" style="fill: var(--figure-accent)"/>
  <text x="334" y="126" font-size="13" style="fill: var(--figure-accent)">index</text>
  <!-- loop -> model: aclose -->
  <line x1="176" y1="200" x2="152" y2="200" fill="none" stroke-width="1.5" stroke-dasharray="4 3" style="stroke: var(--figure-straw)"/>
  <polygon points="146,200 154,196 154,204" style="fill: var(--figure-straw)"/>
  <text x="160" y="232" font-size="13" text-anchor="middle" style="fill: var(--figure-straw)">aclose</text>

  <!-- deltas -->
  <line x1="324" y1="216" x2="324" y2="238" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="324,244 320,236 328,236"/>
  <text x="334" y="234" font-size="13" style="fill: var(--figure-muted)">token text</text>
  <g font-size="13">
    <rect x="176" y="246" width="296" height="64" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="186" y="266">tool-call parser → deltas</text>
    <text x="186" y="284">stream: one chunk per delta, then [DONE]</text>
    <text x="186" y="300">no stream: deltas folded into one message</text>
  </g>

  <!-- disconnect watcher -->
  <g font-size="13">
    <rect x="8" y="246" width="136" height="64" fill="none" stroke-width="1.5" stroke-dasharray="4 3" style="stroke: var(--figure-straw)"/>
    <text x="18" y="266" style="fill: var(--figure-straw)">disconnect watcher</text>
    <text x="18" y="284" style="fill: var(--figure-muted)">receive() says</text>
    <text x="18" y="300" style="fill: var(--figure-muted)">http.disconnect</text>
  </g>
  <line x1="144" y1="278" x2="168" y2="278" fill="none" stroke-width="1.5" stroke-dasharray="4 3" style="stroke: var(--figure-straw)"/>
  <polygon points="174,278 166,274 166,282" style="fill: var(--figure-straw)"/>
</svg>
