<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330">
  <title>Architecture of the runtime: three files in, streamed text out</title>
  <desc>A block diagram of the runtime in five stages. Three files feed weight loading, the tokenizer, and the forward pass, then cached generation and streaming turn tokens into text.</desc>

  <!-- files -->
  <g font-size="13">
    <rect x="8" y="8" width="140" height="30" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="78" y="28" text-anchor="middle" style="font-family: var(--figure-mono)">model.safetensors</text>
    <rect x="170" y="8" width="140" height="30" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="240" y="28" text-anchor="middle" style="font-family: var(--figure-mono)">tokenizer.json</text>
    <rect x="332" y="8" width="140" height="30" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="402" y="28" text-anchor="middle" style="font-family: var(--figure-mono)">config.json</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <line x1="78" y1="38" x2="78" y2="54"/>
    <line x1="240" y1="38" x2="240" y2="54"/>
    <line x1="402" y1="38" x2="402" y2="54"/>
  </g>
  <polygon points="78,60 74,52 82,52"/>
  <polygon points="240,60 236,52 244,52"/>
  <polygon points="402,60 398,52 406,52"/>

  <!-- stage 1, 2, 3 boxes -->
  <g font-size="13">
    <rect x="8" y="62" width="140" height="62" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="16" y="80" style="fill: var(--figure-muted)">stage 1</text>
    <text x="16" y="98">load_weights</text>
    <text x="16" y="116" style="fill: var(--figure-muted)">mmap, BF16 → f32</text>

    <rect x="170" y="62" width="140" height="62" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="178" y="80" style="fill: var(--figure-muted)">stage 2</text>
    <text x="178" y="98">Tokenizer</text>
    <text x="178" y="116">chat_prompt <tspan style="fill: var(--figure-muted)">→ ids</tspan></text>

    <rect x="332" y="62" width="140" height="62" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="340" y="80" style="fill: var(--figure-muted)">stage 3</text>
    <text x="340" y="98">forward</text>
    <text x="340" y="116" style="fill: var(--figure-muted)">blocks, tied head</text>
  </g>

  <!-- into stage 4 -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <line x1="78" y1="124" x2="78" y2="150"/>
    <line x1="240" y1="124" x2="240" y2="150"/>
    <line x1="402" y1="124" x2="402" y2="150"/>
  </g>
  <polygon points="78,156 74,148 82,148"/>
  <polygon points="240,156 236,148 244,148"/>
  <polygon points="402,156 398,148 406,148"/>
  <text x="86" y="144" font-size="13" style="fill: var(--figure-muted)">weights</text>
  <text x="248" y="144" font-size="13" style="fill: var(--figure-muted)">prompt ids</text>

  <!-- stage 4 -->
  <g font-size="13">
    <rect x="8" y="158" width="464" height="76" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
    <text x="16" y="176" style="fill: var(--figure-accent)">stage 4: cached generation</text>
    <rect x="20" y="186" width="92" height="36" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="66" y="209" text-anchor="middle">prefill</text>
    <rect x="160" y="186" width="124" height="36" stroke="currentColor" stroke-width="1" style="fill: var(--figure-softmax)"/>
    <text x="222" y="209" text-anchor="middle">sample_token</text>
    <rect x="336" y="186" width="124" height="36" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="398" y="209" text-anchor="middle">decode_step</text>
  </g>
  <line x1="112" y1="204" x2="152" y2="204" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="158,204 150,200 150,208"/>
  <text x="135" y="198" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">logits</text>
  <line x1="284" y1="197" x2="328" y2="197" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="334,197 326,193 326,201"/>
  <line x1="336" y1="213" x2="292" y2="213" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="286,213 294,209 294,217"/>
  <text x="310" y="180" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">token, cache</text>
  <text x="222" y="250" font-size="13" text-anchor="middle" style="fill: var(--figure-straw)">uniforms[i]</text>
  <line x1="222" y1="238" x2="222" y2="230" fill="none" stroke-width="1.5" style="stroke: var(--figure-straw)"/>
  <polygon points="222,224 218,232 226,232" style="fill: var(--figure-straw)"/>

  <!-- stage 5 -->
  <line x1="78" y1="234" x2="78" y2="262" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="78,268 74,260 82,260"/>
  <text x="86" y="254" font-size="13" style="fill: var(--figure-muted)">tokens</text>
  <g font-size="13">
    <rect x="8" y="270" width="464" height="52" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="16" y="288" style="fill: var(--figure-muted)">stage 5: stream_chat</text>
    <text x="16" y="310">token bytes → incremental UTF-8 → hold back stop prefixes → yield</text>
  </g>
</svg>
