  </g>
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="70.0" y="192.5">−1</text>
    <text x="250.0" y="192.5">0</text>
    <text x="430.0" y="192.5">1</text>
  </g>
  <g font-size="13" text-anchor="end"><text x="62" y="126.5">NF4</text><text x="62" y="162.5">uniform</text></g>
</svg>
