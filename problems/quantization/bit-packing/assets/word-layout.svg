<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 174">
  <title>Two uint32 words holding eleven 4-bit codes</title>
  <desc>Words 0 and 1 of the example, eight 4-bit fields each, bit 31 at the left. Code 0 sits in the lowest field, and word 1 has five padding fields.</desc>
