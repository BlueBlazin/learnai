  <!-- Bit ranges of each field -->
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="89" y="14.5">31–28</text>
    <text x="139" y="14.5">27–24</text>
    <text x="189" y="14.5">23–20</text>
    <text x="239" y="14.5">19–16</text>
    <text x="289" y="14.5">15–12</text>
    <text x="339" y="14.5">11–8</text>
    <text x="389" y="14.5">7–4</text>
    <text x="439" y="14.5">3–0</text>
  </g>
  <!-- word 0: 61C590E3 -->
