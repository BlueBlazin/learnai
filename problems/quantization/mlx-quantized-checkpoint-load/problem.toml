id = "mlx-quantized-checkpoint-load"
title = "Reading an 8-bit Checkpoint"
track = "quantization"
order = 180
difficulty = "medium"
frameworks = ["python"]
judges = ["numeric", "cost"]
tags = ["quantization", "safetensors", "mlx", "bit-packing", "bfloat16", "mmap", "real-model"]
prerequisites = ["bit-packing", "safetensors-parse"]
requires = "cpu"
entry = ["load_quantized"]
time_limit_s = 10
# The statement's rule: read the file and dequantize yourself. The kit's dequantizer
# and its model loader, and MLX's loader and dequantizer, may not be called (rejects
# the mutant uses_kit_dequantize); the safetensors package and the kit's reader are
# ruled out of the source.
forbidden = [
    "learnai.kit.realmodel.dequantize",
    "learnai.kit.realmodel.unpack_codes",
    "learnai.kit.realmodel.RealModel",
    "mlx.core.dequantize",
    "mlx.core.load",
]
forbidden_source = ["safetensors", "SafetensorsFile"]

# Only the checkpoint: the cases that use it read three layers, 1.4 MB each, of 3.9 GB.
[[assets]]
