<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 296">
  <title>Multiplying from the codes, group by group</title>
  <desc>From the bottom: x is cut into groups. Each group gives scale times codes dot x_g, plus bias times the sum of x_g; the groups are summed into y.</desc>
  <!-- Geometry: lane A (the codes) is the column x = 170, lane B (the bias) x = 350, the sum is at x = 260. Boxes are 130 x 22. -->
  <!-- The group, as a ground -->
  <rect x="14" y="68" width="452" height="168" rx="8" stroke-width="1" style="fill: var(--figure-panel); stroke: var(--figure-faint)"/>
  <text x="24" y="86.5" font-size="13" style="fill: var(--figure-muted)">group <tspan font-style="italic" style="font-family: var(--figure-serif)">g</tspan></text>
  <!-- Wires -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <line x1="260" y1="268" x2="260" y2="216"/>
    <polyline points="170,216 350,216"/>
    <line x1="170" y1="216" x2="170" y2="208.5"/>
    <line x1="350" y1="216" x2="350" y2="208.5"/>
    <line x1="170" y1="180" x2="170" y2="155.5"/>
    <line x1="350" y1="180" x2="350" y2="155.5"/>
    <polyline points="170,131 170,100 244.5,100"/>
    <polyline points="350,131 350,100 275.5,100"/>
    <line x1="260" y1="91" x2="260" y2="62.5"/>
    <line x1="260" y1="34" x2="260" y2="26.5"/>
    <line x1="28" y1="191" x2="98.5" y2="191"/>
    <line x1="28" y1="140" x2="154.5" y2="140"/>
    <line x1="458" y1="140" x2="365.5" y2="140"/>
  </g>
  <circle cx="260" cy="216" r="2.5"/>
  <g>
    <polygon points="170,202 173.3,208.5 166.7,208.5"/>
    <polygon points="350,202 353.3,208.5 346.7,208.5"/>
    <polygon points="170,149 173.3,155.5 166.7,155.5"/>
    <polygon points="350,149 353.3,155.5 346.7,155.5"/>
    <polygon points="251,100 244.5,103.3 244.5,96.7"/>
    <polygon points="269,100 275.5,103.3 275.5,96.7"/>
    <polygon points="260,56 263.3,62.5 256.7,62.5"/>
    <polygon points="260,20 263.3,26.5 256.7,26.5"/>
    <polygon points="105,191 98.5,194.3 98.5,187.7"/>
    <polygon points="161,140 154.5,143.3 154.5,136.7"/>
    <polygon points="359,140 365.5,143.3 365.5,136.7"/>
  </g>
  <!-- The two products and the sum: circles -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="170" cy="140" r="9"/>
    <path d="M166.5 136.5 L173.5 143.5 M173.5 136.5 L166.5 143.5"/>
    <circle cx="350" cy="140" r="9"/>
    <path d="M346.5 136.5 L353.5 143.5 M353.5 136.5 L346.5 143.5"/>
    <circle cx="260" cy="100" r="9"/>
    <path d="M254 100 H266 M260 94 V106"/>
  </g>
  <!-- Blocks -->
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="105" y="180" width="130" height="22" rx="5" style="fill: var(--figure-linear)"/>
    <rect x="285" y="180" width="130" height="22" rx="5" style="fill: var(--figure-linear)"/>
    <rect x="195" y="34" width="130" height="22" rx="5" fill="none"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="170" y="195.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">x</tspan><tspan dy="3" font-style="italic" style="font-family: var(--figure-serif)">g</tspan><tspan dy="-3"> · codes</tspan><tspan dy="3" font-style="italic" style="font-family: var(--figure-serif)">g</tspan></text>
    <text x="350" y="195.5">Σ <tspan font-style="italic" style="font-family: var(--figure-serif)">x</tspan><tspan dy="3" font-style="italic" style="font-family: var(--figure-serif)">g</tspan></text>
    <text x="260" y="49.5">Σ over <tspan font-style="italic" style="font-family: var(--figure-serif)">g</tspan></text>
  </g>
  <!-- Side inputs -->
  <g font-size="13">
    <text x="28" y="185.5">codes<tspan dy="3" font-style="italic" style="font-family: var(--figure-serif)">g</tspan></text>
    <text x="28" y="134.5">scale<tspan dy="3" font-style="italic" style="font-family: var(--figure-serif)">g</tspan></text>
    <text x="372" y="134.5">bias<tspan dy="3" font-style="italic" style="font-family: var(--figure-serif)">g</tspan></text>
  </g>
  <g font-size="13" style="font-family: var(--figure-mono); fill: var(--figure-muted)">
    <text x="84" y="134.5">(out,)</text>
    <text x="416" y="134.5">(out,)</text>
    <text x="177" y="170.5">(..., out)</text>
    <text x="357" y="170.5">(..., 1)</text>
    <text x="177" y="118.5">(..., out)</text>
    <text x="357" y="118.5">(..., out)</text>
    <text x="267" y="80.5">(..., out)</text>
    <text x="267" y="252.5">(..., group_size)</text>
    <text x="358" y="283.5">(..., in)</text>
    <text x="272" y="12.5">(..., out)</text>
  </g>
  <!-- Input strip: x cut into groups -->
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="170" y="268" width="60" height="22" fill="none"/>
    <rect x="230" y="268" width="60" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="290" y="268" width="60" height="22" fill="none"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="200" y="283.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">x</tspan>₀</text>
    <text x="260" y="283.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">x</tspan><tspan dy="3" font-style="italic" style="font-family: var(--figure-serif)">g</tspan></text>
    <text x="320" y="283.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">x</tspan><tspan dy="3" font-style="italic" style="font-family: var(--figure-serif)">G</tspan><tspan dy="0">−1</tspan></text>
    <text x="160" y="283.5" text-anchor="end"><tspan font-style="italic" style="font-family: var(--figure-serif)">x</tspan></text>
    <text x="260" y="12.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">y</tspan></text>
  </g>
</svg>
