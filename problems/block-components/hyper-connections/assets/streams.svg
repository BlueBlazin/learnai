<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 344">
  <title>One hyper-connection around a sublayer</title>
  <desc>The streams X pass through pre to become the sublayer input. The output y passes through post and is added to the streams mixed by comb.</desc>
  <!-- Geometry: the streams run up x = 300, the sublayer path up x = 120; boxes are 22 high. -->
  <!-- Wires -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <line x1="300" y1="322" x2="300" y2="198.5"/>
    <path d="M300 296 H128 Q120 296 120 288 V264.5"/>
    <line x1="120" y1="236" x2="120" y2="198.5"/>
    <line x1="120" y1="170" x2="120" y2="132.5"/>
    <path d="M120 104 V78 Q120 70 128 70 H285.5"/>
    <line x1="300" y1="170" x2="300" y2="84.5"/>
    <line x1="300" y1="62" x2="300" y2="34.5"/>
  </g>
  <g>
    <circle cx="300" cy="296" r="2.5"/>
    <polygon points="300,192 303.3,198.5 296.7,198.5"/>
    <polygon points="120,258 123.3,264.5 116.7,264.5"/>
    <polygon points="120,192 123.3,198.5 116.7,198.5"/>
    <polygon points="120,126 123.3,132.5 116.7,132.5"/>
    <polygon points="292,70 285.5,73.3 285.5,66.7"/>
    <polygon points="300,78 303.3,84.5 296.7,84.5"/>
    <polygon points="300,28 303.3,34.5 296.7,34.5"/>
  </g>
  <!-- Blocks -->
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="80" y="236" width="80" height="22" rx="5" style="fill: var(--figure-linear)"/>
    <rect x="80" y="170" width="80" height="22" rx="5" fill="none"/>
    <rect x="80" y="104" width="80" height="22" rx="5" style="fill: var(--figure-linear)"/>
    <rect x="260" y="170" width="80" height="22" rx="5" style="fill: var(--figure-linear)"/>
    <circle cx="300" cy="70" r="8" fill="none"/>
    <path d="M295.5 70 H304.5 M300 65.5 V74.5" fill="none"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="120" y="251.5" style="font-family: var(--figure-mono)">pre</text>
    <text x="120" y="185.5">sublayer</text>
    <text x="120" y="119.5" style="font-family: var(--figure-mono)">post</text>
    <text x="300" y="185.5" style="font-family: var(--figure-mono)">comb</text>
    <text x="300" y="338" style="font-family: var(--figure-serif)" font-style="italic">X</text>
    <text x="300" y="19" style="font-family: var(--figure-serif)"><tspan font-style="italic">X</tspan>′</text>
  </g>
  <!-- The weights of the example -->
  <g font-size="13" style="font-family: var(--figure-serif)">
    <text x="168" y="251.5">(0.5, 0.75)</text>
    <text x="168" y="119.5">(1, 0.5)</text>
  </g>
  <!-- The shape of the tensor on each wire -->
  <g font-size="13" style="font-family: var(--figure-mono); fill: var(--figure-muted)">
    <text x="307" y="316">(T, N, D)</text>
    <text x="127" y="222">collapsed (T, D)</text>
    <text x="127" y="156">y (T, D)</text>
    <text x="210" y="62" text-anchor="middle">(T, N, D)</text>
    <text x="307" y="136">(T, N, D)</text>
    <text x="307" y="50">(T, N, D)</text>
  </g>
  <!-- comb of the example: row j is old stream j, column n is new stream n -->
  <line x1="340" y1="181" x2="388" y2="181" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="388" y="159" width="84" height="44"/>
    <line x1="430" y1="159" x2="430" y2="203"/>
    <line x1="388" y1="181" x2="472" y2="181"/>
  </g>
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-serif)">
    <text x="409" y="174.5">0.333</text>
    <text x="451" y="174.5">0.6</text>
    <text x="409" y="196.5">0.667</text>
    <text x="451" y="196.5">0.4</text>
    <text x="409" y="151"><tspan font-style="italic">X</tspan>′₀</text>
    <text x="451" y="151"><tspan font-style="italic">X</tspan>′₁</text>
    <text x="372" y="174.5"><tspan font-style="italic">X</tspan>₀</text>
    <text x="372" y="196.5"><tspan font-style="italic">X</tspan>₁</text>
  </g>
</svg>
