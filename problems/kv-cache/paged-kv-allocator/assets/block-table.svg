<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244">
  <title>Block tables of two sequences and the pool of physical KV blocks</title>
  <desc>Six physical blocks of four token slots, with a block table per sequence. Sequence a holds blocks 0, 1, and 3, sequence b holds block 2, and two are free.</desc>
  <!-- Left: the block tables. One cell per logical block, holding the physical block id. -->
  <g font-size="13">
    <text x="12" y="15">Block tables</text>
    <text x="12" y="52"><tspan style="font-family: var(--figure-mono); fill: var(--figure-accent)">a</tspan>: 9 tokens</text>
    <text x="12" y="150"><tspan style="font-family: var(--figure-mono); fill: var(--figure-straw)">b</tspan>: 3 tokens</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <rect x="12" y="62" width="44" height="28" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
    <text x="34" y="81" style="font-family: var(--figure-mono)">0</text>
    <text x="34" y="108" style="fill: var(--figure-muted)">4/4</text>
    <rect x="64" y="62" width="44" height="28" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
    <text x="86" y="81" style="font-family: var(--figure-mono)">1</text>
    <text x="86" y="108" style="fill: var(--figure-muted)">4/4</text>
    <rect x="116" y="62" width="44" height="28" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
    <text x="138" y="81" style="font-family: var(--figure-mono)">3</text>
    <text x="138" y="108" style="fill: var(--figure-muted)">1/4</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <rect x="12" y="160" width="44" height="28" fill="none" stroke-width="1.5" style="stroke: var(--figure-straw)"/>
    <text x="34" y="179" style="font-family: var(--figure-mono)">2</text>
    <text x="34" y="206" style="fill: var(--figure-muted)">3/4</text>
  </g>
  <g font-size="13" style="fill: var(--figure-muted)">
    <text x="12" y="232">physical id per logical block</text>
  </g>
  <!-- Right: the pool. One row per physical block, four token slots each. -->
  <text x="236" y="15" font-size="13">Physical blocks, 4 token slots each</text>
  <g>
    <text x="244" y="48" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">0</text>
    <rect x="260" y="30" width="24" height="24" stroke-width="1.5" style="fill: var(--figure-cache); stroke: var(--figure-accent)"/>
    <text x="272" y="47" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">a</text>
    <rect x="287" y="30" width="24" height="24" stroke-width="1.5" style="fill: var(--figure-cache); stroke: var(--figure-accent)"/>
    <text x="299" y="47" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">a</text>
    <rect x="314" y="30" width="24" height="24" stroke-width="1.5" style="fill: var(--figure-cache); stroke: var(--figure-accent)"/>
    <text x="326" y="47" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">a</text>
    <rect x="341" y="30" width="24" height="24" stroke-width="1.5" style="fill: var(--figure-cache); stroke: var(--figure-accent)"/>
    <text x="353" y="47" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">a</text>
    <text x="376" y="47" font-size="13"><tspan style="font-family: var(--figure-mono)">a</tspan>, logical 0</text>
  </g>
  <g>
    <text x="244" y="83" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">1</text>
    <rect x="260" y="65" width="24" height="24" stroke-width="1.5" style="fill: var(--figure-cache); stroke: var(--figure-accent)"/>
    <text x="272" y="82" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">a</text>
    <rect x="287" y="65" width="24" height="24" stroke-width="1.5" style="fill: var(--figure-cache); stroke: var(--figure-accent)"/>
    <text x="299" y="82" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">a</text>
    <rect x="314" y="65" width="24" height="24" stroke-width="1.5" style="fill: var(--figure-cache); stroke: var(--figure-accent)"/>
    <text x="326" y="82" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">a</text>
    <rect x="341" y="65" width="24" height="24" stroke-width="1.5" style="fill: var(--figure-cache); stroke: var(--figure-accent)"/>
    <text x="353" y="82" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">a</text>
    <text x="376" y="82" font-size="13"><tspan style="font-family: var(--figure-mono)">a</tspan>, logical 1</text>
  </g>
  <g>
    <text x="244" y="118" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">2</text>
    <rect x="260" y="100" width="24" height="24" stroke-width="1.5" style="fill: var(--figure-cache); stroke: var(--figure-straw)"/>
    <text x="272" y="117" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">b</text>
    <rect x="287" y="100" width="24" height="24" stroke-width="1.5" style="fill: var(--figure-cache); stroke: var(--figure-straw)"/>
    <text x="299" y="117" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">b</text>
    <rect x="314" y="100" width="24" height="24" stroke-width="1.5" style="fill: var(--figure-cache); stroke: var(--figure-straw)"/>
    <text x="326" y="117" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">b</text>
    <rect x="341" y="100" width="24" height="24" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <text x="376" y="117" font-size="13"><tspan style="font-family: var(--figure-mono)">b</tspan>, logical 0</text>
  </g>
  <g>
    <text x="244" y="153" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">3</text>
    <rect x="260" y="135" width="24" height="24" stroke-width="1.5" style="fill: var(--figure-cache); stroke: var(--figure-accent)"/>
    <text x="272" y="152" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">a</text>
    <rect x="287" y="135" width="24" height="24" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <rect x="314" y="135" width="24" height="24" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <rect x="341" y="135" width="24" height="24" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <text x="376" y="152" font-size="13"><tspan style="font-family: var(--figure-mono)">a</tspan>, logical 2</text>
  </g>
  <g>
    <text x="244" y="188" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">4</text>
    <rect x="260" y="170" width="24" height="24" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <rect x="287" y="170" width="24" height="24" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <rect x="314" y="170" width="24" height="24" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <rect x="341" y="170" width="24" height="24" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <text x="376" y="187" font-size="13" style="fill: var(--figure-muted)">free</text>
  </g>
  <g>
    <text x="244" y="223" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">5</text>
    <rect x="260" y="205" width="24" height="24" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <rect x="287" y="205" width="24" height="24" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <rect x="314" y="205" width="24" height="24" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <rect x="341" y="205" width="24" height="24" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <text x="376" y="222" font-size="13" style="fill: var(--figure-muted)">free</text>
  </g>
</svg>
