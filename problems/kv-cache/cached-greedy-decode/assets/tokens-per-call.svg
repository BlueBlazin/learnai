    <rect x="264" y="54" width="24" height="22" rx="3"/>
    <rect x="290" y="54" width="24" height="22" rx="3"/>
    <rect x="316" y="54" width="24" height="22" rx="3"/>
    <rect x="342" y="54" width="24" height="22" rx="3"/>
    <rect x="264" y="82" width="24" height="22" rx="3"/>
