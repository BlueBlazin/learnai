  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="58" y="26" width="24" height="22" rx="3"/>
    <rect x="84" y="26" width="24" height="22" rx="3"/>
    <rect x="110" y="26" width="24" height="22" rx="3"/>
