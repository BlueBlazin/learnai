    <rect x="110" y="82" width="24" height="22" rx="3"/>
    <rect x="136" y="82" width="24" height="22" rx="3"/>
    <rect x="162" y="82" width="24" height="22" rx="3"/>
    <rect x="188" y="82" width="24" height="22" rx="3"/>
    <rect x="58" y="110" width="24" height="22" rx="3"/>
    <rect x="84" y="110" width="24" height="22" rx="3"/>
