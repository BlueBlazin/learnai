<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 164">
  <title>Tokens passed to the model per call, without and with a cache</title>
  <desc>Four calls for the prompt 0, 17, 42, 5. Without a cache the rows grow from four to seven tokens; with one, the calls pass four tokens, then one each.</desc>
  <!-- Geometry: row k is at y = 26 + 28 (k - 1), 22 high. Cell j is 24 wide at x = 58 + 26 j on the left and x = 264 + 26 j on the right. -->

  <!-- Headings and row names -->
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="148" y="16.5">without a cache</text>
    <text x="354" y="16.5">with a cache</text>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="48" y="41.5">call 1</text>
    <text x="48" y="69.5">call 2</text>
    <text x="48" y="97.5">call 3</text>
    <text x="48" y="125.5">call 4</text>
  </g>

