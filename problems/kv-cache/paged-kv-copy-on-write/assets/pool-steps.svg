<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 118">
  <title>A pool of six blocks with reference counts, at four points of the example</title>
  <desc>Four frames. Each shows the block tables, six blocks of four slots, and under every block its reference count and the sequences that hold it.</desc>
  <!-- Geometry: block j is at x = 100 + 62 j, four slots 12 wide at a pitch of 13, y = 54..76. -->
  <!-- Frames are the groups step-1 to step-4; the app shows one at a time. Their desc is the note of the step. -->

  <!-- In every frame: the row names and the block ids -->
  <g font-size="13" text-anchor="end">
    <text x="90" y="14.5">block tables</text>
    <text x="90" y="48.5" style="fill: var(--figure-muted)">block</text>
    <text x="90" y="94.5">ref count</text>
    <text x="90" y="112.5">held by</text>
  </g>
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">
    <text x="125.5" y="48.5">0</text>
    <text x="187.5" y="48.5">1</text>
    <text x="249.5" y="48.5">2</text>
    <text x="311.5" y="48.5">3</text>
    <text x="373.5" y="48.5">4</text>
    <text x="435.5" y="48.5">5</text>
  </g>

  <g id="step-1">
    <desc>The fork gives b the table of a, so blocks 0 and 1 have two references each and no block is allocated.</desc>
    <g font-size="13">
      <text x="100" y="14.5" style="font-family: var(--figure-mono)">a [0, 1]</text>
      <text x="210" y="14.5" style="font-family: var(--figure-mono)">b [0, 1]</text>
    </g>
    <!-- filled slots -->
    <g stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)">
      <rect x="100" y="54" width="12" height="22" rx="2"/>
      <rect x="113" y="54" width="12" height="22" rx="2"/>
      <rect x="126" y="54" width="12" height="22" rx="2"/>
      <rect x="139" y="54" width="12" height="22" rx="2"/>
      <rect x="162" y="54" width="12" height="22" rx="2"/>
      <rect x="175" y="54" width="12" height="22" rx="2"/>
    </g>
    <!-- empty slots -->
    <g fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)">
      <rect x="188" y="54" width="12" height="22" rx="2"/>
      <rect x="201" y="54" width="12" height="22" rx="2"/>
      <rect x="224" y="54" width="12" height="22" rx="2"/>
      <rect x="237" y="54" width="12" height="22" rx="2"/>
      <rect x="250" y="54" width="12" height="22" rx="2"/>
      <rect x="263" y="54" width="12" height="22" rx="2"/>
      <rect x="286" y="54" width="12" height="22" rx="2"/>
      <rect x="299" y="54" width="12" height="22" rx="2"/>
      <rect x="312" y="54" width="12" height="22" rx="2"/>
      <rect x="325" y="54" width="12" height="22" rx="2"/>
      <rect x="348" y="54" width="12" height="22" rx="2"/>
      <rect x="361" y="54" width="12" height="22" rx="2"/>
      <rect x="374" y="54" width="12" height="22" rx="2"/>
      <rect x="387" y="54" width="12" height="22" rx="2"/>
      <rect x="410" y="54" width="12" height="22" rx="2"/>
      <rect x="423" y="54" width="12" height="22" rx="2"/>
      <rect x="436" y="54" width="12" height="22" rx="2"/>
      <rect x="449" y="54" width="12" height="22" rx="2"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="125.5" y="94.5">2</text>
      <text x="187.5" y="94.5">2</text>
      <text x="249.5" y="94.5" style="fill: var(--figure-muted)">0</text>
      <text x="311.5" y="94.5" style="fill: var(--figure-muted)">0</text>
      <text x="373.5" y="94.5" style="fill: var(--figure-muted)">0</text>
      <text x="435.5" y="94.5" style="fill: var(--figure-muted)">0</text>
    </g>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
      <text x="125.5" y="112.5">a b</text>
      <text x="187.5" y="112.5">a b</text>
    </g>
  </g>

  <g id="step-2">
    <desc>b appends one token: block 1 is shared and partly filled, so b gets block 2 as a copy and writes there.</desc>
    <g font-size="13">
      <text x="100" y="14.5" style="font-family: var(--figure-mono)">a [0, 1]</text>
      <text x="210" y="14.5" style="font-family: var(--figure-mono)">b [0, 2]</text>
    </g>
    <!-- filled slots -->
    <g stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)">
      <rect x="100" y="54" width="12" height="22" rx="2"/>
      <rect x="113" y="54" width="12" height="22" rx="2"/>
      <rect x="126" y="54" width="12" height="22" rx="2"/>
      <rect x="139" y="54" width="12" height="22" rx="2"/>
      <rect x="162" y="54" width="12" height="22" rx="2"/>
      <rect x="175" y="54" width="12" height="22" rx="2"/>
      <rect x="224" y="54" width="12" height="22" rx="2"/>
      <rect x="237" y="54" width="12" height="22" rx="2"/>
    </g>
    <!-- written by this call -->
    <g stroke="currentColor" stroke-width="1.5" fill-opacity="0.4" style="fill: var(--figure-cache)">
      <rect x="250" y="54" width="12" height="22" rx="2"/>
    </g>
    <!-- empty slots -->
    <g fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)">
      <rect x="188" y="54" width="12" height="22" rx="2"/>
      <rect x="201" y="54" width="12" height="22" rx="2"/>
      <rect x="263" y="54" width="12" height="22" rx="2"/>
      <rect x="286" y="54" width="12" height="22" rx="2"/>
      <rect x="299" y="54" width="12" height="22" rx="2"/>
      <rect x="312" y="54" width="12" height="22" rx="2"/>
      <rect x="325" y="54" width="12" height="22" rx="2"/>
      <rect x="348" y="54" width="12" height="22" rx="2"/>
      <rect x="361" y="54" width="12" height="22" rx="2"/>
      <rect x="374" y="54" width="12" height="22" rx="2"/>
      <rect x="387" y="54" width="12" height="22" rx="2"/>
      <rect x="410" y="54" width="12" height="22" rx="2"/>
      <rect x="423" y="54" width="12" height="22" rx="2"/>
      <rect x="436" y="54" width="12" height="22" rx="2"/>
      <rect x="449" y="54" width="12" height="22" rx="2"/>
    </g>
    <!-- the copy of block 1 into block 2 -->
    <path d="M200 52 Q219 28 234.9 48.1" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="238,52 231.4,49 236.6,44.9"/>
    <text x="219" y="32.5" font-size="13" text-anchor="middle">copy</text>
    <g font-size="13" text-anchor="middle">
      <text x="125.5" y="94.5">2</text>
      <text x="187.5" y="94.5">1</text>
      <text x="249.5" y="94.5">1</text>
      <text x="311.5" y="94.5" style="fill: var(--figure-muted)">0</text>
      <text x="373.5" y="94.5" style="fill: var(--figure-muted)">0</text>
      <text x="435.5" y="94.5" style="fill: var(--figure-muted)">0</text>
    </g>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
      <text x="125.5" y="112.5">a b</text>
      <text x="187.5" y="112.5">a</text>
      <text x="249.5" y="112.5">b</text>
    </g>
  </g>

  <g id="step-3">
    <desc>After two more appends b holds blocks 0, 2, and 3 and forks c, so block 0 has three references.</desc>
    <g font-size="13">
      <text x="100" y="14.5" style="font-family: var(--figure-mono)">a [0, 1]</text>
      <text x="210" y="14.5" style="font-family: var(--figure-mono)">b [0, 2, 3]</text>
      <text x="320" y="14.5" style="font-family: var(--figure-mono)">c [0, 2, 3]</text>
    </g>
    <!-- filled slots -->
    <g stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)">
      <rect x="100" y="54" width="12" height="22" rx="2"/>
      <rect x="113" y="54" width="12" height="22" rx="2"/>
      <rect x="126" y="54" width="12" height="22" rx="2"/>
      <rect x="139" y="54" width="12" height="22" rx="2"/>
      <rect x="162" y="54" width="12" height="22" rx="2"/>
      <rect x="175" y="54" width="12" height="22" rx="2"/>
      <rect x="188" y="54" width="12" height="22" rx="2"/>
      <rect x="224" y="54" width="12" height="22" rx="2"/>
      <rect x="237" y="54" width="12" height="22" rx="2"/>
      <rect x="250" y="54" width="12" height="22" rx="2"/>
      <rect x="263" y="54" width="12" height="22" rx="2"/>
      <rect x="286" y="54" width="12" height="22" rx="2"/>
      <rect x="299" y="54" width="12" height="22" rx="2"/>
      <rect x="312" y="54" width="12" height="22" rx="2"/>
    </g>
    <!-- empty slots -->
    <g fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)">
      <rect x="201" y="54" width="12" height="22" rx="2"/>
      <rect x="325" y="54" width="12" height="22" rx="2"/>
      <rect x="348" y="54" width="12" height="22" rx="2"/>
      <rect x="361" y="54" width="12" height="22" rx="2"/>
      <rect x="374" y="54" width="12" height="22" rx="2"/>
      <rect x="387" y="54" width="12" height="22" rx="2"/>
      <rect x="410" y="54" width="12" height="22" rx="2"/>
      <rect x="423" y="54" width="12" height="22" rx="2"/>
      <rect x="436" y="54" width="12" height="22" rx="2"/>
      <rect x="449" y="54" width="12" height="22" rx="2"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="125.5" y="94.5">3</text>
      <text x="187.5" y="94.5">1</text>
      <text x="249.5" y="94.5">2</text>
      <text x="311.5" y="94.5">2</text>
      <text x="373.5" y="94.5" style="fill: var(--figure-muted)">0</text>
      <text x="435.5" y="94.5" style="fill: var(--figure-muted)">0</text>
    </g>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
      <text x="125.5" y="112.5">a b c</text>
      <text x="187.5" y="112.5">a</text>
      <text x="249.5" y="112.5">b c</text>
      <text x="311.5" y="112.5">b c</text>
    </g>
  </g>

  <g id="step-4">
    <desc>Freeing b takes one reference from blocks 0, 2, and 3, and none returns to the pool because c holds them.</desc>
    <g font-size="13">
      <text x="100" y="14.5" style="font-family: var(--figure-mono)">a [0, 1]</text>
      <text x="320" y="14.5" style="font-family: var(--figure-mono)">c [0, 2, 3]</text>
    </g>
    <!-- filled slots -->
    <g stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)">
      <rect x="100" y="54" width="12" height="22" rx="2"/>
      <rect x="113" y="54" width="12" height="22" rx="2"/>
      <rect x="126" y="54" width="12" height="22" rx="2"/>
      <rect x="139" y="54" width="12" height="22" rx="2"/>
      <rect x="162" y="54" width="12" height="22" rx="2"/>
      <rect x="175" y="54" width="12" height="22" rx="2"/>
      <rect x="188" y="54" width="12" height="22" rx="2"/>
      <rect x="224" y="54" width="12" height="22" rx="2"/>
      <rect x="237" y="54" width="12" height="22" rx="2"/>
      <rect x="250" y="54" width="12" height="22" rx="2"/>
      <rect x="263" y="54" width="12" height="22" rx="2"/>
      <rect x="286" y="54" width="12" height="22" rx="2"/>
      <rect x="299" y="54" width="12" height="22" rx="2"/>
      <rect x="312" y="54" width="12" height="22" rx="2"/>
    </g>
    <!-- empty slots -->
    <g fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)">
      <rect x="201" y="54" width="12" height="22" rx="2"/>
      <rect x="325" y="54" width="12" height="22" rx="2"/>
      <rect x="348" y="54" width="12" height="22" rx="2"/>
      <rect x="361" y="54" width="12" height="22" rx="2"/>
      <rect x="374" y="54" width="12" height="22" rx="2"/>
      <rect x="387" y="54" width="12" height="22" rx="2"/>
      <rect x="410" y="54" width="12" height="22" rx="2"/>
      <rect x="423" y="54" width="12" height="22" rx="2"/>
      <rect x="436" y="54" width="12" height="22" rx="2"/>
      <rect x="449" y="54" width="12" height="22" rx="2"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="125.5" y="94.5">2</text>
      <text x="187.5" y="94.5">1</text>
      <text x="249.5" y="94.5">1</text>
      <text x="311.5" y="94.5">1</text>
      <text x="373.5" y="94.5" style="fill: var(--figure-muted)">0</text>
      <text x="435.5" y="94.5" style="fill: var(--figure-muted)">0</text>
    </g>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
      <text x="125.5" y="112.5">a c</text>
      <text x="187.5" y="112.5">a</text>
      <text x="249.5" y="112.5">c</text>
      <text x="311.5" y="112.5">c</text>
    </g>
  </g>
</svg>
