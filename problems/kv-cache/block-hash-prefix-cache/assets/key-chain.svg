<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 164">
  <title>Two prompts as chains of block keys</title>
  <desc>Q1 and Q2 cut into blocks of four tokens. Each key is computed from the key before it and one block, so the prompts share two keys and then differ.</desc>
  <!-- Geometry: block k is 94 wide, centered at x = 95 + 104 k. Q1 is the row y = 8..30, Q2 the row y = 134..156, the keys lie between. -->

  <!-- Row names -->
  <g font-size="13" text-anchor="end" style="font-family: var(--figure-mono)">
    <text x="40" y="23.5">Q1</text>
    <text x="40" y="149.5">Q2</text>
  </g>

  <!-- Full blocks of tokens -->
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="48" y="8" width="94" height="22" rx="3"/>
    <rect x="152" y="8" width="94" height="22" rx="3"/>
    <rect x="256" y="8" width="94" height="22" rx="3"/>
    <rect x="48" y="134" width="94" height="22" rx="3"/>
    <rect x="152" y="134" width="94" height="22" rx="3"/>
    <rect x="256" y="134" width="94" height="22" rx="3"/>
  </g>
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
    <text x="95" y="23.5">1 2 3 4</text>
    <text x="199" y="23.5">5 6 7 8</text>
    <text x="303" y="23.5">11 12 13 14</text>
    <text x="95" y="149.5">1 2 3 4</text>
    <text x="199" y="149.5">5 6 7 8</text>
    <text x="303" y="149.5">21 22 23 24</text>
  </g>

  <!-- Tokens after the last full block -->
  <g fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)">
    <rect x="360" y="8" width="48" height="22" rx="3"/>
    <rect x="360" y="134" width="48" height="22" rx="3"/>
  </g>
  <g font-size="13" style="fill: var(--figure-muted)">
    <text x="384" y="23.5" text-anchor="middle" style="font-family: var(--figure-mono)">15 16</text>
    <text x="384" y="149.5" text-anchor="middle" style="font-family: var(--figure-mono)">25</text>
    <text x="416" y="23.5">ignored</text>
    <text x="416" y="149.5">ignored</text>
  </g>

  <!-- Into every key: the key before it and the tokens of its block -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M48 82 L62 82"/>
    <path d="M123 82 L166 82"/>
    <path d="M227 78 L270.4 59.9"/>
    <path d="M227 86 L270.4 104.1"/>
    <path d="M95 30 L95 66"/>
    <path d="M199 30 L199 66"/>
    <path d="M303 30 L303 40"/>
    <path d="M95 134 L95 98"/>
    <path d="M199 134 L199 98"/>
    <path d="M303 134 L303 124"/>
  </g>
  <g>
    <polygon points="67,82 60.5,85.3 60.5,78.7"/>
    <polygon points="171,82 164.5,85.3 164.5,78.7"/>
    <polygon points="275,58 270.3,63.5 267.7,57.5"/>
    <polygon points="275,106 267.7,106.5 270.3,100.5"/>
    <polygon points="95,71 91.7,64.5 98.3,64.5"/>
    <polygon points="199,71 195.7,64.5 202.3,64.5"/>
    <polygon points="303,45 299.7,38.5 306.3,38.5"/>
    <polygon points="95,93 98.3,99.5 91.7,99.5"/>
    <polygon points="199,93 202.3,99.5 195.7,99.5"/>
    <polygon points="303,119 306.3,125.5 299.7,125.5"/>
  </g>

  <!-- The keys: one cached block each -->
  <g stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)">
    <rect x="67" y="71" width="56" height="22" rx="5"/>
    <rect x="171" y="71" width="56" height="22" rx="5"/>
    <rect x="275" y="45" width="56" height="22" rx="5"/>
    <rect x="275" y="97" width="56" height="22" rx="5"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="95" y="86.5">key₀</text>
    <text x="199" y="86.5">key₁</text>
    <text x="303" y="60.5">key₂</text>
    <text x="303" y="112.5">key₂</text>
    <text x="26" y="86.5">key₋₁</text>
  </g>
</svg>
