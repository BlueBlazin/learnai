<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 156">
  <title>The radix tree at four points of the example</title>
  <desc>Four frames. Each shows the tree growing rightward from the root, a box per node with the tokens of its edge, its last access time, and its lock count.</desc>
  <!-- Geometry: a node is a box 50 wide and 22 high, centered at x = 101, 211, 321 by depth and y = 21, 71, 121 by row; its time is set under it. -->
  <!-- Frames are the groups step-1 to step-4; the app shows one at a time. Their desc is the note of the step. -->

  <!-- In every frame: the root -->
  <rect x="8" y="10" width="38" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="27" y="25.5" font-size="13" text-anchor="middle">root</text>

  <g id="step-1">
    <desc>The second insert shares 1 2 3 with the first sequence, so that edge is split and [7 8] becomes a second child.</desc>
    <!-- edges, parent to child -->
    <g fill="none" stroke="currentColor" stroke-width="1">
      <path d="M46 21 L71 21"/>
      <path d="M126 21 L181 21"/>
      <path d="M156 21 V63 Q156 71 164 71 L181 71"/>
    </g>
    <g>
      <polygon points="76,21 69.5,24.3 69.5,17.7"/>
      <polygon points="186,21 179.5,24.3 179.5,17.7"/>
      <polygon points="186,71 179.5,74.3 179.5,67.7"/>
      <circle cx="156" cy="21" r="2.5"/>
    </g>
    <!-- nodes: the tokens of the edge, and under each its time and lock count -->
    <rect x="76" y="10" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="101" y="25.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">1 2 3</text>
    <text x="101" y="48.5" font-size="13" text-anchor="middle">time 2</text>
    <rect x="186" y="10" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)"/>
    <text x="211" y="25.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">4 5 6</text>
    <text x="211" y="48.5" font-size="13" text-anchor="middle">time 1</text>
    <rect x="186" y="60" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="211" y="75.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">7 8</text>
    <text x="211" y="98.5" font-size="13" text-anchor="middle">time 2</text>
    <!-- the call of this frame -->
    <text x="186" y="125.5" font-size="13" style="font-family: var(--figure-mono)">insert([1, 2, 3, 7, 8])</text>
  </g>

  <g id="step-2">
    <desc>The match of 1 2 3 4 9 ends one token into [4 5 6], which is split, and [5 6] keeps time 1.</desc>
    <!-- edges, parent to child -->
    <g fill="none" stroke="currentColor" stroke-width="1">
      <path d="M46 21 L71 21"/>
      <path d="M126 21 L181 21"/>
      <path d="M236 21 L291 21"/>
      <path d="M156 21 V63 Q156 71 164 71 L181 71"/>
    </g>
    <g>
      <polygon points="76,21 69.5,24.3 69.5,17.7"/>
      <polygon points="186,21 179.5,24.3 179.5,17.7"/>
      <polygon points="296,21 289.5,24.3 289.5,17.7"/>
      <polygon points="186,71 179.5,74.3 179.5,67.7"/>
      <circle cx="156" cy="21" r="2.5"/>
    </g>
    <!-- nodes: the tokens of the edge, and under each its time and lock count -->
    <rect x="76" y="10" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="101" y="25.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">1 2 3</text>
    <text x="101" y="48.5" font-size="13" text-anchor="middle">time 3</text>
    <rect x="186" y="10" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="211" y="25.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">4</text>
    <text x="211" y="48.5" font-size="13" text-anchor="middle">time 3</text>
    <rect x="296" y="10" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)"/>
    <text x="321" y="25.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">5 6</text>
    <text x="321" y="48.5" font-size="13" text-anchor="middle">time 1</text>
    <rect x="186" y="60" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)"/>
    <text x="211" y="75.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">7 8</text>
    <text x="211" y="98.5" font-size="13" text-anchor="middle">time 2</text>
    <!-- the call of this frame -->
    <text x="186" y="125.5" font-size="13" style="font-family: var(--figure-mono)">match_prefix([1, 2, 3, 4, 9])</text>
  </g>

  <g id="step-3">
    <desc>Locking the handle of [4] locks [4] and [1 2 3], and a third insert adds the leaf [9 9 9].</desc>
    <!-- edges, parent to child -->
    <g fill="none" stroke="currentColor" stroke-width="1">
      <path d="M46 21 L71 21"/>
      <path d="M126 21 L181 21"/>
      <path d="M236 21 L291 21"/>
      <path d="M156 21 V63 Q156 71 164 71 L181 71"/>
      <path d="M27 32 V113 Q27 121 35 121 L71 121"/>
    </g>
    <g>
      <polygon points="76,21 69.5,24.3 69.5,17.7"/>
      <polygon points="186,21 179.5,24.3 179.5,17.7"/>
      <polygon points="296,21 289.5,24.3 289.5,17.7"/>
      <polygon points="186,71 179.5,74.3 179.5,67.7"/>
      <circle cx="156" cy="21" r="2.5"/>
      <polygon points="76,121 69.5,124.3 69.5,117.7"/>
    </g>
    <!-- nodes: the tokens of the edge, and under each its time and lock count -->
    <rect x="76" y="10" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="101" y="25.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">1 2 3</text>
    <text x="101" y="48.5" font-size="13" text-anchor="middle">time 3, lock 1</text>
    <rect x="186" y="10" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="211" y="25.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">4</text>
    <text x="211" y="48.5" font-size="13" text-anchor="middle">time 3, lock 1</text>
    <rect x="296" y="10" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)"/>
    <text x="321" y="25.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">5 6</text>
    <text x="321" y="48.5" font-size="13" text-anchor="middle">time 1</text>
    <rect x="186" y="60" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)"/>
    <text x="211" y="75.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">7 8</text>
    <text x="211" y="98.5" font-size="13" text-anchor="middle">time 2</text>
    <rect x="76" y="110" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="101" y="125.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">9 9 9</text>
    <text x="101" y="148.5" font-size="13" text-anchor="middle">time 4</text>
    <!-- the call of this frame -->
    <text x="186" y="125.5" font-size="13" style="font-family: var(--figure-mono)">lock(h)</text>
    <text x="186" y="143.5" font-size="13" style="font-family: var(--figure-mono)">insert([9, 9, 9])</text>
  </g>

  <g id="step-4">
    <desc>Eviction removes the unlocked leaves with the smallest times, [5 6] and then [7 8], four tokens in all.</desc>
    <!-- edges, parent to child -->
    <g fill="none" stroke="currentColor" stroke-width="1">
      <path d="M46 21 L71 21"/>
      <path d="M126 21 L181 21"/>
      <path d="M27 32 V113 Q27 121 35 121 L71 121"/>
    </g>
    <g>
      <polygon points="76,21 69.5,24.3 69.5,17.7"/>
      <polygon points="186,21 179.5,24.3 179.5,17.7"/>
      <polygon points="76,121 69.5,124.3 69.5,117.7"/>
    </g>
    <!-- edges of the evicted leaves -->
    <g fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)">
      <path d="M236 21 L291 21"/>
      <path d="M156 21 V63 Q156 71 164 71 L181 71"/>
    </g>
    <g style="fill: var(--figure-faint)">
      <polygon points="296,21 289.5,24.3 289.5,17.7"/>
      <polygon points="186,71 179.5,74.3 179.5,67.7"/>
    </g>
    <!-- nodes: the tokens of the edge, and under each its time and lock count -->
    <rect x="76" y="10" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)"/>
    <text x="101" y="25.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">1 2 3</text>
    <text x="101" y="48.5" font-size="13" text-anchor="middle">time 3, lock 1</text>
    <rect x="186" y="10" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)"/>
    <text x="211" y="25.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">4</text>
    <text x="211" y="48.5" font-size="13" text-anchor="middle">time 3, lock 1</text>
    <rect x="296" y="10" width="50" height="22" rx="5" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <text x="321" y="25.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">5 6</text>
    <text x="321" y="48.5" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">time 1</text>
    <rect x="186" y="60" width="50" height="22" rx="5" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
    <text x="211" y="75.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">7 8</text>
    <text x="211" y="98.5" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">time 2</text>
    <rect x="76" y="110" width="50" height="22" rx="5" stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)"/>
    <text x="101" y="125.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">9 9 9</text>
    <text x="101" y="148.5" font-size="13" text-anchor="middle">time 4</text>
    <!-- the call of this frame -->
    <text x="186" y="125.5" font-size="13" style="font-family: var(--figure-mono)">evict(4)</text>
  </g>
</svg>
