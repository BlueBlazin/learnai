<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 196">
  <title>The attention mask of one cached step, for three cached and three new tokens</title>
  <desc>A grid with three rows, one per new query at positions 3, 4 and 5, and six columns, one per key at positions 0 to 5. The three cached columns are visible in every row. In the three new columns, row 3 sees column 3 only, row 4 sees columns 3 and 4, and row 5 sees all three; the other cells are masked.</desc>
  <!-- Geometry: cells are 40 x 36, the grid starts at (168, 62). Column j is at x = 168 + 40 j, row i at y = 62 + 36 i. -->
  <!-- Column groups -->
  <g font-size="13" text-anchor="middle">
    <text x="228" y="16">cached keys, <tspan font-style="italic" style="font-family: var(--figure-serif)">S</tspan> = 3</text>
    <text x="348" y="16">new keys, <tspan font-style="italic" style="font-family: var(--figure-serif)">T</tspan> = 3</text>
  </g>
  <g fill="none" stroke-width="1" style="stroke: var(--figure-muted)">
    <polyline points="170,30 170,24 286,24 286,30"/>
    <polyline points="290,30 290,24 406,24 406,30"/>
  </g>
  <!-- Column positions -->
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="188" y="52">0</text>
    <text x="228" y="52">1</text>
    <text x="268" y="52">2</text>
    <text x="308" y="52">3</text>
    <text x="348" y="52">4</text>
    <text x="388" y="52">5</text>
    <text x="436" y="52" text-anchor="start">key <tspan font-style="italic" style="font-family: var(--figure-serif)">j</tspan></text>
  </g>
  <!-- Row labels: new query i is at absolute position S + i -->
  <g font-size="13" text-anchor="end">
    <text x="158" y="85">new token 0, position 3</text>
    <text x="158" y="121">new token 1, position 4</text>
    <text x="158" y="157">new token 2, position 5</text>
  </g>
  <!-- Visible cells: filled -->
  <g style="fill: var(--figure-accent)" fill-opacity="0.3">
    <rect x="168" y="62" width="120" height="108"/>
    <rect x="288" y="62" width="40" height="36"/>
    <rect x="288" y="98" width="80" height="36"/>
    <rect x="288" y="134" width="120" height="36"/>
  </g>
  <!-- Masked cells: marked -->
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted); font-family: var(--figure-serif)">
    <text x="348" y="85">−∞</text>
    <text x="388" y="85">−∞</text>
    <text x="388" y="121">−∞</text>
  </g>
  <!-- Grid lines -->
  <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
    <line x1="208" y1="62" x2="208" y2="170"/>
    <line x1="248" y1="62" x2="248" y2="170"/>
    <line x1="328" y1="62" x2="328" y2="170"/>
    <line x1="368" y1="62" x2="368" y2="170"/>
    <line x1="168" y1="98" x2="408" y2="98"/>
    <line x1="168" y1="134" x2="408" y2="134"/>
  </g>
  <rect x="168" y="62" width="240" height="108" fill="none" stroke="currentColor" stroke-width="1"/>
  <!-- The boundary between cache and chunk, and the causal staircase -->
  <line x1="288" y1="58" x2="288" y2="174" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polyline points="328,62 328,98 368,98 368,134 408,134" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
  <!-- Legend -->
  <g font-size="13">
    <rect x="168" y="180" width="14" height="12" style="fill: var(--figure-accent)" fill-opacity="0.3"/>
    <text x="188" y="191">may attend: <tspan font-style="italic" style="font-family: var(--figure-serif)">j</tspan> ≤ <tspan font-style="italic" style="font-family: var(--figure-serif)">S</tspan> + <tspan font-style="italic" style="font-family: var(--figure-serif)">i</tspan></text>
    <text x="330" y="191" style="fill: var(--figure-muted)">−∞  masked</text>
  </g>
</svg>
