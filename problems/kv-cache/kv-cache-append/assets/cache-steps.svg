<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 206">
  <title>The cache and the mask over four calls of attend_step</title>
  <desc>Four frames, one per call of attend_step. Each shows a strip of seven cache entries and, under it, the mask of that call.</desc>
  <!-- Geometry: column j is at x = 100 + 46 j, 44 wide. The strip is the row y = 24..50; mask row i is at y = 92 + 30 i, 26 high. -->
  <!-- Frames are the groups step-1 to step-4; the app shows one at a time. Their desc is the note of the step. -->

  <!-- In every frame: the positions, the row names, and the key -->
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="122" y="16.5">0</text>
    <text x="168" y="16.5">1</text>
    <text x="214" y="16.5">2</text>
    <text x="260" y="16.5">3</text>
    <text x="306" y="16.5">4</text>
    <text x="352" y="16.5">5</text>
    <text x="398" y="16.5">6</text>
  </g>
  <g font-size="13" text-anchor="end" font-style="italic" style="font-family: var(--figure-serif)">
    <text x="90" y="16.5" style="fill: var(--figure-muted)">j</text>
    <text x="90" y="41.5">K, V</text>
  </g>
  <rect x="100" y="188" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1" style="fill: var(--figure-attn)"/>
  <text x="120" y="198.5" font-size="13">may attend: <tspan font-style="italic" style="font-family: var(--figure-serif)">j</tspan> ≤ <tspan font-style="italic" style="font-family: var(--figure-serif)">S</tspan> + <tspan font-style="italic" style="font-family: var(--figure-serif)">i</tspan></text>

  <!-- Call 1: S = 0, T = 3 -->
  <g id="step-1">
    <desc>Call 1 appends three tokens to an empty cache, so the mask is the square causal triangle.</desc>
    <!-- appended by this call -->
    <g stroke="currentColor" stroke-width="1.5" fill-opacity="0.4" style="fill: var(--figure-cache)">
      <rect x="100" y="24" width="44" height="26" rx="3"/>
      <rect x="146" y="24" width="44" height="26" rx="3"/>
      <rect x="192" y="24" width="44" height="26" rx="3"/>
    </g>
    <!-- not yet filled -->
    <g fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)">
      <rect x="238" y="24" width="44" height="26" rx="3"/>
      <rect x="284" y="24" width="44" height="26" rx="3"/>
      <rect x="330" y="24" width="44" height="26" rx="3"/>
      <rect x="376" y="24" width="44" height="26" rx="3"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <path d="M100 55 v5 H236 v-5"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="168" y="76.5">new, <tspan font-style="italic" style="font-family: var(--figure-serif)">T</tspan> = 3</text>
    </g>
    <!-- the mask: visible entries -->
    <g stroke="currentColor" stroke-width="1" style="fill: var(--figure-attn)">
      <rect x="100" y="92" width="44" height="26" rx="3"/>
      <rect x="100" y="122" width="44" height="26" rx="3"/>
      <rect x="146" y="122" width="44" height="26" rx="3"/>
      <rect x="100" y="152" width="44" height="26" rx="3"/>
      <rect x="146" y="152" width="44" height="26" rx="3"/>
      <rect x="192" y="152" width="44" height="26" rx="3"/>
    </g>
    <!-- the mask: hidden entries -->
    <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
      <rect x="146" y="92" width="44" height="26" rx="3"/>
      <rect x="192" y="92" width="44" height="26" rx="3"/>
      <rect x="192" y="122" width="44" height="26" rx="3"/>
    </g>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-muted)">
      <text x="168" y="109.5">−∞</text>
      <text x="214" y="109.5">−∞</text>
      <text x="214" y="139.5">−∞</text>
    </g>
    <g font-size="13" text-anchor="end" style="font-family: var(--figure-serif)">
      <text x="90" y="109.5"><tspan font-style="italic">i</tspan> = 0</text>
      <text x="90" y="139.5"><tspan font-style="italic">i</tspan> = 1</text>
      <text x="90" y="169.5"><tspan font-style="italic">i</tspan> = 2</text>
    </g>
  </g>

  <!-- Call 2: S = 3, T = 1 -->
  <g id="step-2">
    <desc>Call 2 appends one token: with S = 3 and T = 1 the mask is one row of four entries, all visible.</desc>
    <!-- cached -->
    <g stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)">
      <rect x="100" y="24" width="44" height="26" rx="3"/>
      <rect x="146" y="24" width="44" height="26" rx="3"/>
      <rect x="192" y="24" width="44" height="26" rx="3"/>
    </g>
    <!-- appended by this call -->
    <g stroke="currentColor" stroke-width="1.5" fill-opacity="0.4" style="fill: var(--figure-cache)">
      <rect x="238" y="24" width="44" height="26" rx="3"/>
    </g>
    <!-- not yet filled -->
    <g fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)">
      <rect x="284" y="24" width="44" height="26" rx="3"/>
      <rect x="330" y="24" width="44" height="26" rx="3"/>
      <rect x="376" y="24" width="44" height="26" rx="3"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <path d="M100 55 v5 H236 v-5"/>
      <path d="M238 55 v5 H282 v-5"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="168" y="76.5">cached, <tspan font-style="italic" style="font-family: var(--figure-serif)">S</tspan> = 3</text>
      <text x="260" y="76.5">new, <tspan font-style="italic" style="font-family: var(--figure-serif)">T</tspan> = 1</text>
    </g>
    <!-- the mask: visible entries -->
    <g stroke="currentColor" stroke-width="1" style="fill: var(--figure-attn)">
      <rect x="100" y="92" width="44" height="26" rx="3"/>
      <rect x="146" y="92" width="44" height="26" rx="3"/>
      <rect x="192" y="92" width="44" height="26" rx="3"/>
      <rect x="238" y="92" width="44" height="26" rx="3"/>
    </g>
    <g font-size="13" text-anchor="end" style="font-family: var(--figure-serif)">
      <text x="90" y="109.5"><tspan font-style="italic">i</tspan> = 0</text>
    </g>
  </g>

  <!-- Call 3: S = 4, T = 1 -->
  <g id="step-3">
    <desc>Call 3 appends one more, and the row is one entry longer because the cache grew by one.</desc>
    <!-- cached -->
    <g stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)">
      <rect x="100" y="24" width="44" height="26" rx="3"/>
      <rect x="146" y="24" width="44" height="26" rx="3"/>
      <rect x="192" y="24" width="44" height="26" rx="3"/>
      <rect x="238" y="24" width="44" height="26" rx="3"/>
    </g>
    <!-- appended by this call -->
    <g stroke="currentColor" stroke-width="1.5" fill-opacity="0.4" style="fill: var(--figure-cache)">
      <rect x="284" y="24" width="44" height="26" rx="3"/>
    </g>
    <!-- not yet filled -->
    <g fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)">
      <rect x="330" y="24" width="44" height="26" rx="3"/>
      <rect x="376" y="24" width="44" height="26" rx="3"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <path d="M100 55 v5 H282 v-5"/>
      <path d="M284 55 v5 H328 v-5"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="191" y="76.5">cached, <tspan font-style="italic" style="font-family: var(--figure-serif)">S</tspan> = 4</text>
      <text x="306" y="76.5">new, <tspan font-style="italic" style="font-family: var(--figure-serif)">T</tspan> = 1</text>
    </g>
    <!-- the mask: visible entries -->
    <g stroke="currentColor" stroke-width="1" style="fill: var(--figure-attn)">
      <rect x="100" y="92" width="44" height="26" rx="3"/>
      <rect x="146" y="92" width="44" height="26" rx="3"/>
      <rect x="192" y="92" width="44" height="26" rx="3"/>
      <rect x="238" y="92" width="44" height="26" rx="3"/>
      <rect x="284" y="92" width="44" height="26" rx="3"/>
    </g>
    <g font-size="13" text-anchor="end" style="font-family: var(--figure-serif)">
      <text x="90" y="109.5"><tspan font-style="italic">i</tspan> = 0</text>
    </g>
  </g>

  <!-- Call 4: S = 5, T = 2 -->
  <g id="step-4">
    <desc>Call 4 appends two: both rows see all five cached columns, and the two new columns form a triangle.</desc>
    <!-- cached -->
    <g stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)">
      <rect x="100" y="24" width="44" height="26" rx="3"/>
      <rect x="146" y="24" width="44" height="26" rx="3"/>
      <rect x="192" y="24" width="44" height="26" rx="3"/>
      <rect x="238" y="24" width="44" height="26" rx="3"/>
      <rect x="284" y="24" width="44" height="26" rx="3"/>
    </g>
    <!-- appended by this call -->
    <g stroke="currentColor" stroke-width="1.5" fill-opacity="0.4" style="fill: var(--figure-cache)">
      <rect x="330" y="24" width="44" height="26" rx="3"/>
      <rect x="376" y="24" width="44" height="26" rx="3"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <path d="M100 55 v5 H328 v-5"/>
      <path d="M330 55 v5 H420 v-5"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="214" y="76.5">cached, <tspan font-style="italic" style="font-family: var(--figure-serif)">S</tspan> = 5</text>
      <text x="375" y="76.5">new, <tspan font-style="italic" style="font-family: var(--figure-serif)">T</tspan> = 2</text>
    </g>
    <!-- the mask: visible entries -->
    <g stroke="currentColor" stroke-width="1" style="fill: var(--figure-attn)">
      <rect x="100" y="92" width="44" height="26" rx="3"/>
      <rect x="146" y="92" width="44" height="26" rx="3"/>
      <rect x="192" y="92" width="44" height="26" rx="3"/>
      <rect x="238" y="92" width="44" height="26" rx="3"/>
      <rect x="284" y="92" width="44" height="26" rx="3"/>
      <rect x="330" y="92" width="44" height="26" rx="3"/>
      <rect x="100" y="122" width="44" height="26" rx="3"/>
      <rect x="146" y="122" width="44" height="26" rx="3"/>
      <rect x="192" y="122" width="44" height="26" rx="3"/>
      <rect x="238" y="122" width="44" height="26" rx="3"/>
      <rect x="284" y="122" width="44" height="26" rx="3"/>
      <rect x="330" y="122" width="44" height="26" rx="3"/>
      <rect x="376" y="122" width="44" height="26" rx="3"/>
    </g>
    <!-- the mask: hidden entries -->
    <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
      <rect x="376" y="92" width="44" height="26" rx="3"/>
    </g>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-muted)">
      <text x="398" y="109.5">−∞</text>
    </g>
    <g font-size="13" text-anchor="end" style="font-family: var(--figure-serif)">
      <text x="90" y="109.5"><tspan font-style="italic">i</tspan> = 0</text>
      <text x="90" y="139.5"><tspan font-style="italic">i</tspan> = 1</text>
    </g>
  </g>
</svg>
