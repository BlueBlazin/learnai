<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 218">
  <title>Interleaved and half-split RoPE layouts for a head of width 8</title>
  <desc>Two rows of eight features. In the interleaved row the two members of pair i sit at features 2i and 2i + 1. In the half-split row the first members of all pairs fill features 0 to 3 and the second members fill features 4 to 7. Lines connect each feature of the top row to its place in the bottom row: feature 2i goes to i and feature 2i + 1 goes to 4 + i.</desc>
  <!-- row labels -->
  <text x="0" y="55" font-size="13">interleaved</text>
  <text x="0" y="171" font-size="13">half-split</text>
  <!-- interleaved: pair i at features 2i, 2i + 1 -->
  <g>
    <rect x="104" y="34" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="125.0" y="55" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-accent)"><tspan font-style="italic">a</tspan>₀</text>
    <text x="125.0" y="25" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">0</text>
    <rect x="150" y="34" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="171.0" y="55" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-straw)"><tspan font-style="italic">b</tspan>₀</text>
    <text x="171.0" y="25" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">1</text>
    <rect x="196" y="34" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="217.0" y="55" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-accent)"><tspan font-style="italic">a</tspan>₁</text>
    <text x="217.0" y="25" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">2</text>
    <rect x="242" y="34" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="263.0" y="55" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-straw)"><tspan font-style="italic">b</tspan>₁</text>
    <text x="263.0" y="25" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">3</text>
    <rect x="288" y="34" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="309.0" y="55" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-accent)"><tspan font-style="italic">a</tspan>₂</text>
    <text x="309.0" y="25" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">4</text>
    <rect x="334" y="34" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="355.0" y="55" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-straw)"><tspan font-style="italic">b</tspan>₂</text>
    <text x="355.0" y="25" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">5</text>
    <rect x="380" y="34" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="401.0" y="55" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-accent)"><tspan font-style="italic">a</tspan>₃</text>
    <text x="401.0" y="25" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">6</text>
    <rect x="426" y="34" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="447.0" y="55" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-straw)"><tspan font-style="italic">b</tspan>₃</text>
    <text x="447.0" y="25" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">7</text>
  </g>
  <!-- half-split: first members, then second members -->
  <g>
    <rect x="104" y="150" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="125.0" y="171" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-accent)"><tspan font-style="italic">a</tspan>₀</text>
    <text x="125.0" y="200" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">0</text>
    <rect x="150" y="150" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="171.0" y="171" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-accent)"><tspan font-style="italic">a</tspan>₁</text>
    <text x="171.0" y="200" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">1</text>
    <rect x="196" y="150" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="217.0" y="171" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-accent)"><tspan font-style="italic">a</tspan>₂</text>
    <text x="217.0" y="200" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">2</text>
    <rect x="242" y="150" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="263.0" y="171" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-accent)"><tspan font-style="italic">a</tspan>₃</text>
    <text x="263.0" y="200" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">3</text>
    <rect x="288" y="150" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="309.0" y="171" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-straw)"><tspan font-style="italic">b</tspan>₀</text>
    <text x="309.0" y="200" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">4</text>
    <rect x="334" y="150" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="355.0" y="171" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-straw)"><tspan font-style="italic">b</tspan>₁</text>
    <text x="355.0" y="200" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">5</text>
    <rect x="380" y="150" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="401.0" y="171" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-straw)"><tspan font-style="italic">b</tspan>₂</text>
    <text x="401.0" y="200" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">6</text>
    <rect x="426" y="150" width="42" height="32" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="447.0" y="171" font-size="14" text-anchor="middle" style="font-family: var(--figure-serif); fill: var(--figure-straw)"><tspan font-style="italic">b</tspan>₃</text>
    <text x="447.0" y="200" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">7</text>
  </g>
  <!-- where each feature goes: solid for first members, dashed for second members -->
  <line x1="125.0" y1="66" x2="125.0" y2="150" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
  <line x1="171.0" y1="66" x2="309.0" y2="150" fill="none" stroke-width="1.5" stroke-dasharray="5 4" style="stroke: var(--figure-straw)"/>
  <line x1="217.0" y1="66" x2="171.0" y2="150" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
  <line x1="263.0" y1="66" x2="355.0" y2="150" fill="none" stroke-width="1.5" stroke-dasharray="5 4" style="stroke: var(--figure-straw)"/>
  <line x1="309.0" y1="66" x2="217.0" y2="150" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
  <line x1="355.0" y1="66" x2="401.0" y2="150" fill="none" stroke-width="1.5" stroke-dasharray="5 4" style="stroke: var(--figure-straw)"/>
  <line x1="401.0" y1="66" x2="263.0" y2="150" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
  <line x1="447.0" y1="66" x2="447.0" y2="150" fill="none" stroke-width="1.5" stroke-dasharray="5 4" style="stroke: var(--figure-straw)"/>
</svg>
