id = "real-model-block"
title = "One Block of a Real Model"
track = "transformer"
order = 180
difficulty = "medium"
frameworks = ["torch", "jax", "mlx"]
judges = ["numeric", "property"]
tags = ["forward-pass", "granite", "rope", "gqa", "swiglu", "real-model", "checkpoint-porting"]
prerequisites = ["grouped-query-attention", "swiglu-mlp", "rope"]
requires = "cpu"
entry = ["granite_block"]
time_limit_s = 10
# The statement's rule: compute the block yourself. The kit's reference model (and the
# RealModel that builds it) may not be constructed from the solution, MLX's built-in
# rotary embedding may not be used, and transformers may not be imported. Rejects the
# mutant uses_kit_reference.
forbidden = [
    "whetstone.kit.realmodel.RealLM",
    "whetstone.kit.realmodel.RealModel",
    "mlx.nn.RoPE",
    "mlx.core.fast.rope",
]
forbidden_source = ["transformers"]

# The weights, plus config.json, which the kit needs to open the checkpoint.
[[assets]]
name = "granite-4.0-350m"
repo = "ibm-granite/granite-4.0-350m"
revision = "bd8a1497065c0d6ba1ef19af6b0d2b14bacf71c2"
files = ["config.json", "model.safetensors"]
size_mb = 705
