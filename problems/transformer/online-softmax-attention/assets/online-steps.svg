<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160">
  <title>Online softmax over two key/value blocks</title>
  <desc>Two queries, q = 1 and q = 100, read two key/value blocks in turn. The table holds each query's running maximum, normalizer, and output after every step.</desc>
  <!-- Geometry: key cells are 96 x 38 at y = 22. The table has columns m (x = 64..104), scale (104..176), normalizer (176..320), and output (320..464), rows y = 96..122 and 122..148. -->
  <!-- Frames are the groups step-1 to step-4; the app shows one at a time. Their desc is the note of the step. -->

  <!-- In every frame: block names, keys and values, the table grid, headers, and row names -->
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="162" y="14.5">block 1</text>
    <text x="348" y="14.5">block 2</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="112" y="38.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">k</tspan> = 0</text>
    <text x="112" y="54.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">v</tspan> = 1</text>
    <text x="212" y="38.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">k</tspan> = 1</text>
    <text x="212" y="54.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">v</tspan> = 2</text>
    <text x="348" y="38.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">k</tspan> = 3</text>
    <text x="348" y="54.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">v</tspan> = 4</text>
  </g>
  <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
    <rect x="64" y="96" width="40" height="26"/>
    <rect x="104" y="96" width="72" height="26"/>
    <rect x="176" y="96" width="144" height="26"/>
    <rect x="320" y="96" width="144" height="26"/>
    <rect x="64" y="122" width="40" height="26"/>
    <rect x="104" y="122" width="72" height="26"/>
    <rect x="176" y="122" width="144" height="26"/>
    <rect x="320" y="122" width="144" height="26"/>
  </g>
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="84" y="88"><tspan font-style="italic" style="font-family: var(--figure-serif)">m</tspan></text>
    <text x="248" y="88">Σ <tspan font-style="italic" style="font-family: var(--figure-serif)">e</tspan>^(<tspan font-style="italic" style="font-family: var(--figure-serif)">s</tspan> − <tspan font-style="italic" style="font-family: var(--figure-serif)">m</tspan>)</text>
    <text x="392" y="88">Σ <tspan font-style="italic" style="font-family: var(--figure-serif)">e</tspan>^(<tspan font-style="italic" style="font-family: var(--figure-serif)">s</tspan> − <tspan font-style="italic" style="font-family: var(--figure-serif)">m</tspan>) <tspan font-style="italic" style="font-family: var(--figure-serif)">v</tspan></text>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="60" y="113.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">q</tspan> = 1</text>
    <text x="60" y="139.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">q</tspan> = 100</text>
  </g>

  <g id="step-1">
    <desc>After block 1, each query holds a maximum, a normalizer, and an output, all measured against that maximum.</desc>
    <!-- the blocks -->
    <g>
    <rect x="64" y="22" width="96" height="38" rx="3" stroke="currentColor" stroke-width="1.5" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="164" y="22" width="96" height="38" rx="3" stroke="currentColor" stroke-width="1.5" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="300" y="22" width="96" height="38" rx="3" stroke-width="1" stroke-dasharray="2 3" fill="none" style="stroke: var(--figure-faint)"/>
    </g>
    <!-- the state of each query -->
    <g font-size="13" text-anchor="middle">
      <text x="84" y="113.5">1</text>
      <text x="248" y="113.5">1.3679</text>
      <text x="392" y="113.5">2.3679</text>
      <text x="84" y="139.5">100</text>
      <text x="248" y="139.5">1</text>
      <text x="392" y="139.5">2</text>
    </g>
  </g>
  <g id="step-2">
    <desc>Block 2 lifts the maximum for q = 1 from 1 to 3, so its old sums are scaled by e^(1−3).</desc>
    <!-- the blocks -->
    <g>
    <rect x="64" y="22" width="96" height="38" rx="3" stroke="currentColor" stroke-width="1" fill="none"/>
    <rect x="164" y="22" width="96" height="38" rx="3" stroke="currentColor" stroke-width="1" fill="none"/>
    <rect x="300" y="22" width="96" height="38" rx="3" stroke="currentColor" stroke-width="1.5" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    </g>
    <text x="140" y="88" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">scale</text>
    <!-- the state of each query -->
    <g font-size="13" text-anchor="middle">
      <text x="84" y="113.5">1 → 3</text>
      <text x="140" y="113.5">× <tspan font-style="italic" style="font-family: var(--figure-serif)">e</tspan>^(1−3)</text>
      <text x="248" y="113.5">0.1851</text>
      <text x="392" y="113.5">0.3205</text>
      <text x="84" y="139.5">100</text>
      <text x="140" y="139.5">× 1</text>
      <text x="248" y="139.5">1</text>
      <text x="392" y="139.5">2</text>
    </g>
  </g>
  <g id="step-3">
    <desc>Block 2 adds 1 to the normalizer and 4 to the output for q = 1, and is masked for q = 100.</desc>
    <!-- the blocks -->
    <g>
    <rect x="64" y="22" width="96" height="38" rx="3" stroke="currentColor" stroke-width="1" fill="none"/>
    <rect x="164" y="22" width="96" height="38" rx="3" stroke="currentColor" stroke-width="1" fill="none"/>
    <rect x="300" y="22" width="96" height="38" rx="3" stroke="currentColor" stroke-width="1.5" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    </g>
    <!-- the state of each query -->
    <g font-size="13" text-anchor="middle">
      <text x="84" y="113.5">3</text>
      <text x="248" y="113.5">0.1851 + 1 = 1.1851</text>
      <text x="392" y="113.5">0.3205 + 4 = 4.3205</text>
      <text x="84" y="139.5">100</text>
      <text x="140" y="139.5" style="fill: var(--figure-muted)">masked</text>
      <text x="248" y="139.5">1</text>
      <text x="392" y="139.5">2</text>
    </g>
  </g>
  <g id="step-4">
    <desc>The result is the running output divided by the normalizer: 3.6456 for q = 1 and 2 for q = 100.</desc>
    <!-- the blocks -->
    <g>
    <rect x="64" y="22" width="96" height="38" rx="3" stroke="currentColor" stroke-width="1" fill="none"/>
    <rect x="164" y="22" width="96" height="38" rx="3" stroke="currentColor" stroke-width="1" fill="none"/>
    <rect x="300" y="22" width="96" height="38" rx="3" stroke="currentColor" stroke-width="1" fill="none"/>
    </g>
    <text x="140" y="88" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">o / l</text>
    <!-- the state of each query -->
    <g font-size="13" text-anchor="middle">
      <text x="84" y="113.5">3</text>
      <text x="140" y="113.5">3.6456</text>
      <text x="248" y="113.5">1.1851</text>
      <text x="392" y="113.5">4.3205</text>
      <text x="84" y="139.5">100</text>
      <text x="140" y="139.5">2</text>
      <text x="248" y="139.5">1</text>
      <text x="392" y="139.5">2</text>
    </g>
  </g>
</svg>
