<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 204">
  <title>Timeline of the latency example: one request and its five tokens</title>
  <desc>A request sent at 12.0 s and tokens arriving from 12.5 to 13.0 s. Brackets mark the end-to-end latency, TTFT, TPOT span, and the four gaps.</desc>
  <!-- Geometry: x = 40 + 400 (t - 12), t in seconds; the axis is the line y = 74. -->
  <!-- Spans: e2e, then TTFT and the TPOT span -->
  <g fill="none" stroke-width="1.5">
    <polyline points="40,27 40,22 440,22 440,27" stroke="currentColor"/>
    <polyline points="40,51 40,46 240,46 240,51" style="stroke: var(--figure-accent)"/>
    <polyline points="240,51 240,46 440,46 440,51" style="stroke: var(--figure-straw)"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="240" y="16">e2e = 1.0</text>
    <text x="140" y="40" style="fill: var(--figure-accent)">TTFT = 0.5</text>
    <text x="340" y="40" style="fill: var(--figure-straw)">TPOT = 0.5 / 4 = 0.125</text>
  </g>
  <!-- The axis, the start, and the arrivals -->
  <line x1="40" y1="74" x2="440" y2="74" fill="none" stroke-width="1" style="stroke: var(--figure-faint)"/>
  <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
    <line x1="40" y1="46" x2="40" y2="74"/>
    <line x1="240" y1="46" x2="240" y2="74"/>
    <line x1="440" y1="46" x2="440" y2="74"/>
  </g>
  <polygon points="34,67 40,74 46,81 40,74"/>
  <circle cx="240" cy="74" r="4.5" style="fill: var(--figure-accent)" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="265" cy="74" r="4.5" style="fill: var(--figure-accent)" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="290" cy="74" r="4.5" style="fill: var(--figure-accent)" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="340" cy="74" r="4.5" style="fill: var(--figure-accent)" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="440" cy="74" r="4.5" style="fill: var(--figure-accent)" stroke="currentColor" stroke-width="1.5"/>
  <g font-size="13" text-anchor="middle">
    <text x="46" y="98">t_start</text>
    <text x="240" y="98">t₁</text>
    <text x="265" y="98">t₂</text>
    <text x="290" y="98">t₃</text>
    <text x="340" y="98">t₄</text>
    <text x="440" y="98">t₅</text>
  </g>
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">
    <text x="40" y="116">12.0</text>
    <text x="240" y="116">12.5</text>
    <text x="440" y="116">13.0</text>
  </g>
  <!-- The four gaps (itl): brackets, then values on two rows -->
  <g fill="none" stroke-width="1.5" stroke="currentColor">
    <polyline points="241,132 241,138 264,138 264,132"/>
    <polyline points="266,132 266,138 289,138 289,132"/>
    <polyline points="291,132 291,138 339,138 339,132"/>
    <polyline points="341,132 341,138 439,138 439,132"/>
  </g>
  <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
    <line x1="252.5" y1="138" x2="252.5" y2="140"/>
    <line x1="277.5" y1="138" x2="277.5" y2="164"/>
    <line x1="315" y1="138" x2="315" y2="140"/>
    <line x1="390" y1="138" x2="390" y2="164"/>
  </g>
  <text x="200" y="152" font-size="13" text-anchor="end">itl</text>
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
    <text x="242.5" y="152">0.0625</text>
    <text x="277.5" y="176">0.0625</text>
    <text x="315" y="152">0.125</text>
    <text x="390" y="176">0.25</text>
  </g>
</svg>
