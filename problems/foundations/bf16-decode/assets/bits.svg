<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 134">
  <title>The 32 bits of a float32 and the 16 that bfloat16 keeps</title>
  <desc>The 32 bits of 0.1 as a float32: sign, exponent, and mantissa. The first 16 are kept, the last 16 dropped, and the first dropped bit is marked.</desc>
  <!-- Geometry: bit k from the left is the cell x = 32 + 13 k, 13 wide, y = 32 to 54. The cut between kept and dropped is x = 240. -->

  <!-- Field names -->
  <g font-size="13" text-anchor="middle">
    <text x="38.5" y="22.5">sign</text>
    <text x="97" y="22.5">exponent</text>
    <text x="298" y="22.5">mantissa</text>
  </g>
  <!-- Cells: the kept 16 shaded -->
  <g stroke="currentColor" stroke-width="1">
    <rect x="32" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="45" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="58" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="71" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="84" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="97" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="110" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="123" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="136" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="149" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="162" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="175" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="188" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="201" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="214" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="227" y="32" width="13" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="240" y="32" width="13" height="22" style="fill: var(--figure-straw)"/>
    <rect x="253" y="32" width="13" height="22" fill="none"/>
    <rect x="266" y="32" width="13" height="22" fill="none"/>
    <rect x="279" y="32" width="13" height="22" fill="none"/>
    <rect x="292" y="32" width="13" height="22" fill="none"/>
    <rect x="305" y="32" width="13" height="22" fill="none"/>
    <rect x="318" y="32" width="13" height="22" fill="none"/>
    <rect x="331" y="32" width="13" height="22" fill="none"/>
    <rect x="344" y="32" width="13" height="22" fill="none"/>
    <rect x="357" y="32" width="13" height="22" fill="none"/>
    <rect x="370" y="32" width="13" height="22" fill="none"/>
    <rect x="383" y="32" width="13" height="22" fill="none"/>
    <rect x="396" y="32" width="13" height="22" fill="none"/>
    <rect x="409" y="32" width="13" height="22" fill="none"/>
    <rect x="422" y="32" width="13" height="22" fill="none"/>
    <rect x="435" y="32" width="13" height="22" fill="none"/>
  </g>
  <!-- Field boundaries -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect x="32" y="32" width="13" height="22"/>
    <rect x="45" y="32" width="104" height="22"/>
    <rect x="149" y="32" width="299" height="22"/>
  </g>
  <!-- The bits of 0x3DCCCCCD -->
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
    <text x="38.5" y="48.5">0</text>
    <text x="51.5" y="48.5">0</text>
    <text x="64.5" y="48.5">1</text>
    <text x="77.5" y="48.5">1</text>
    <text x="90.5" y="48.5">1</text>
    <text x="103.5" y="48.5">1</text>
    <text x="116.5" y="48.5">0</text>
    <text x="129.5" y="48.5">1</text>
    <text x="142.5" y="48.5">1</text>
    <text x="155.5" y="48.5">1</text>
    <text x="168.5" y="48.5">0</text>
    <text x="181.5" y="48.5">0</text>
    <text x="194.5" y="48.5">1</text>
    <text x="207.5" y="48.5">1</text>
    <text x="220.5" y="48.5">0</text>
    <text x="233.5" y="48.5">0</text>
    <text x="246.5" y="48.5">1</text>
    <text x="259.5" y="48.5">1</text>
    <text x="272.5" y="48.5">0</text>
    <text x="285.5" y="48.5">0</text>
    <text x="298.5" y="48.5">1</text>
    <text x="311.5" y="48.5">1</text>
    <text x="324.5" y="48.5">0</text>
    <text x="337.5" y="48.5">0</text>
    <text x="350.5" y="48.5">1</text>
    <text x="363.5" y="48.5">1</text>
    <text x="376.5" y="48.5">0</text>
    <text x="389.5" y="48.5">0</text>
    <text x="402.5" y="48.5">1</text>
    <text x="415.5" y="48.5">1</text>
    <text x="428.5" y="48.5">0</text>
    <text x="441.5" y="48.5">1</text>
  </g>
  <!-- The cut, and the rounding bit -->
  <line x1="240" y1="28" x2="240" y2="108" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
  <line x1="246.5" y1="54" x2="246.5" y2="70" stroke-width="1" style="stroke: var(--figure-straw)"/>
  <text x="248" y="83.5" font-size="13">rounding bit</text>
  <g font-size="13" text-anchor="middle">
    <text x="136" y="102.5">kept</text>
    <text x="344" y="102.5">dropped</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="136" y="122.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">h</tspan> = <tspan style="font-family: var(--figure-mono)">0x3DCC</tspan></text>
    <text x="344" y="122.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">r</tspan> = <tspan style="font-family: var(--figure-mono)">0xCCCD</tspan></text>
  </g>
</svg>
