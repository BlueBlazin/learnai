# The statement's rule: no bfloat16 dtype, in any spelling. A dtype is an object, not a
# call, so there is nothing to guard at run time: the identifier itself is ruled out of
# the solution's source (torch.bfloat16, Tensor.bfloat16(), mx.bfloat16, jnp.bfloat16,
# "bfloat16"). Rejects the mutants uses_builtin and uses_dtype_cast.
forbidden_source = ["bfloat16"]
