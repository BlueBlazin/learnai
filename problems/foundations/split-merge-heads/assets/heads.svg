<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 212">
  <title>split_heads and merge_heads on the example</title>
  <desc>Three tokens of four features are cut into two bands of two columns, then stacked as two heads of three tokens by two features.</desc>
  <!-- Geometry: left grid x = 40 to 152, y = 44 to 110, cells 28 x 22. Right grids x = 324 to 380, one per head, y = 34 to 100 and y = 116 to 182. -->

  <!-- The (T, D) grid: head 1 shaded -->
  <g stroke="currentColor" stroke-width="1">
    <rect x="40" y="44" width="28" height="22" fill="none"/>
    <rect x="68" y="44" width="28" height="22" fill="none"/>
    <rect x="96" y="44" width="28" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="124" y="44" width="28" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="40" y="66" width="28" height="22" fill="none"/>
    <rect x="68" y="66" width="28" height="22" fill="none"/>
    <rect x="96" y="66" width="28" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="124" y="66" width="28" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="40" y="88" width="28" height="22" fill="none"/>
    <rect x="68" y="88" width="28" height="22" fill="none"/>
    <rect x="96" y="88" width="28" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="124" y="88" width="28" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="54" y="60.5">0</text>
    <text x="82" y="60.5">1</text>
    <text x="110" y="60.5">2</text>
    <text x="138" y="60.5">3</text>
    <text x="54" y="82.5">4</text>
    <text x="82" y="82.5">5</text>
    <text x="110" y="82.5">6</text>
    <text x="138" y="82.5">7</text>
    <text x="54" y="104.5">8</text>
    <text x="82" y="104.5">9</text>
    <text x="110" y="104.5">10</text>
    <text x="138" y="104.5">11</text>
  </g>
  <!-- Bands of the two heads -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect x="40" y="44" width="56" height="66"/>
    <rect x="96" y="44" width="56" height="66"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="68" y="36.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">h</tspan> = 0</text>
    <text x="124" y="36.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">h</tspan> = 1</text>
  </g>
  <text x="96" y="132" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">(B, T, D)</text>
  <!-- The (H, T, d) grids -->
  <g stroke="currentColor" stroke-width="1">
    <rect x="324" y="34" width="28" height="22" fill="none"/>
    <rect x="352" y="34" width="28" height="22" fill="none"/>
    <rect x="324" y="56" width="28" height="22" fill="none"/>
    <rect x="352" y="56" width="28" height="22" fill="none"/>
    <rect x="324" y="78" width="28" height="22" fill="none"/>
    <rect x="352" y="78" width="28" height="22" fill="none"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="338" y="50.5">0</text>
    <text x="366" y="50.5">1</text>
    <text x="338" y="72.5">4</text>
    <text x="366" y="72.5">5</text>
    <text x="338" y="94.5">8</text>
    <text x="366" y="94.5">9</text>
  </g>
  <g stroke="currentColor" stroke-width="1">
    <rect x="324" y="116" width="28" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="352" y="116" width="28" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="324" y="138" width="28" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="352" y="138" width="28" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="324" y="160" width="28" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
    <rect x="352" y="160" width="28" height="22" fill-opacity="0.3" style="fill: var(--figure-accent)"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="338" y="132.5">2</text>
    <text x="366" y="132.5">3</text>
    <text x="338" y="154.5">6</text>
    <text x="366" y="154.5">7</text>
    <text x="338" y="176.5">10</text>
    <text x="366" y="176.5">11</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect x="324" y="34" width="56" height="66"/>
    <rect x="324" y="116" width="56" height="66"/>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="316" y="71.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">h</tspan> = 0</text>
    <text x="316" y="153.5"><tspan font-style="italic" style="font-family: var(--figure-serif)">h</tspan> = 1</text>
  </g>
  <text x="352" y="204" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">(B, H, T, d)</text>
  <!-- split_heads to the right, merge_heads back -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="176" y1="70" x2="263" y2="70"/>
    <line x1="268" y1="138" x2="181" y2="138"/>
  </g>
  <g>
    <polygon points="268,70 261.5,66.7 261.5,73.3"/>
    <polygon points="176,138 182.5,134.7 182.5,141.3"/>
  </g>
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
    <text x="224" y="60.5">split_heads</text>
    <text x="224" y="161.5">merge_heads</text>
  </g>
</svg>
