    <line x1="170.0" y1="236.0" x2="170.0" y2="192.0" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="170.0,192.0 173.3,198.5 166.7,198.5"/>
    <line x1="200.0" y1="236.0" x2="200.0" y2="192.0" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="200.0,192.0 203.3,198.5 196.7,198.5"/>
    <line x1="230.0" y1="236.0" x2="230.0" y2="192.0" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="230.0,192.0 233.3,198.5 226.7,198.5"/>
