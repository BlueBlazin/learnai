  <rect x="320.0" y="340.0" width="80.0" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-linear)"/>
  <text x="360.0" y="355.5" font-size="13" text-anchor="middle"><tspan font-style="italic" style="font-family: var(--figure-serif)">W</tspan><tspan dy="3">a</tspan><tspan dy="-3"></tspan>, <tspan font-style="italic" style="font-family: var(--figure-serif)">W</tspan><tspan dy="3">b</tspan><tspan dy="-3"></tspan></text>
  <rect x="415.0" y="340.0" width="50.0" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-linear)"/>
  <text x="440.0" y="355.5" font-size="13" text-anchor="middle"><tspan font-style="italic" style="font-family: var(--figure-serif)">W</tspan><tspan dy="3">z</tspan><tspan dy="-3"></tspan></text>
  <rect x="145.0" y="288.0" width="110.0" height="22" rx="5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <text x="200.0" y="303.5" font-size="13" text-anchor="middle">conv1d, silu</text>
  <rect x="145.0" y="236.0" width="110.0" height="22" rx="5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <text x="200.0" y="251.5" font-size="13" text-anchor="middle">split, l2norm</text>
  <rect x="320.0" y="236.0" width="80.0" height="22" rx="5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <text x="360.0" y="251.5" font-size="13" text-anchor="middle"><tspan font-style="italic" style="font-family: var(--figure-serif)">g</tspan>, <tspan font-style="italic" style="font-family: var(--figure-serif)">β</tspan></text>
  <rect x="135.0" y="170.0" width="165.0" height="22" rx="5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <text x="217.5" y="185.5" font-size="13" text-anchor="middle">recurrence</text>
  <rect x="145.0" y="104.0" width="110.0" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-norm)"/>
  <text x="200.0" y="119.5" font-size="13" text-anchor="middle">gated norm</text>
  <rect x="145.0" y="40.0" width="110.0" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-linear)"/>
  <text x="200.0" y="55.5" font-size="13" text-anchor="middle"><tspan font-style="italic" style="font-family: var(--figure-serif)">W</tspan><tspan dy="3">out</tspan><tspan dy="-3"></tspan></text>
  <rect x="6.0" y="288.0" width="84.0" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
  <text x="48.0" y="303.5" font-size="13" text-anchor="middle">conv_state</text>
  <rect x="6.0" y="170.0" width="84.0" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
  <text x="48.0" y="185.5" font-size="13" text-anchor="middle"><tspan font-style="italic" style="font-family: var(--figure-serif)">S</tspan></text>
  </g>
  <!-- Names and the shape on each wire -->
  <text x="200" y="446" font-size="13" text-anchor="middle" font-style="italic" style="font-family: var(--figure-serif)">x</text>
  <text x="200" y="14" font-size="13" text-anchor="middle" font-style="italic" style="font-family: var(--figure-serif)">out</text>
  <text x="207.0" y="410.0" font-size="13" text-anchor="start" style="font-family: var(--figure-mono); fill: var(--figure-muted)">(T, d_model)</text>
  <text x="207.0" y="36.0" font-size="13" text-anchor="start" style="font-family: var(--figure-mono); fill: var(--figure-muted)">(T, d_model)</text>
  <text x="207" y="330" font-size="13"><tspan font-style="italic" style="font-family: var(--figure-serif)">P</tspan> <tspan style="font-family: var(--figure-mono); fill: var(--figure-muted)">(T, C)</tspan></text>
  <text x="207" y="278" font-size="13"><tspan font-style="italic" style="font-family: var(--figure-serif)">M</tspan> <tspan style="font-family: var(--figure-mono); fill: var(--figure-muted)">(T, C)</tspan></text>
