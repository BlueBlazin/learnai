  <text x="6.0" y="158.0" font-size="13" text-anchor="start" style="font-family: var(--figure-mono); fill: var(--figure-muted)">(H<tspan dy="3">v</tspan><tspan dy="-3"></tspan>, d<tspan dy="3">v</tspan><tspan dy="-3"></tspan>, d<tspan dy="3">k</tspan><tspan dy="-3"></tspan>)</text>
  <text x="164" y="220" font-size="13" text-anchor="end"><tspan font-style="italic" style="font-family: var(--figure-serif)">q, k</tspan> <tspan style="font-family: var(--figure-mono); fill: var(--figure-muted)">(T, H<tspan dy="3">k</tspan><tspan dy="-3"></tspan>, d<tspan dy="3">k</tspan><tspan dy="-3"></tspan>)</tspan></text>
  <text x="236" y="220" font-size="13"><tspan font-style="italic" style="font-family: var(--figure-serif)">v</tspan> <tspan style="font-family: var(--figure-mono); fill: var(--figure-muted)">(T, H<tspan dy="3">v</tspan><tspan dy="-3"></tspan>, d<tspan dy="3">v</tspan><tspan dy="-3"></tspan>)</tspan></text>
  <text x="353.0" y="300.0" font-size="13" text-anchor="end"><tspan font-style="italic" style="font-family: var(--figure-serif)">a, b</tspan></text>
  <text x="353.0" y="315.0" font-size="13" text-anchor="end" style="font-family: var(--figure-mono); fill: var(--figure-muted)">(T, H<tspan dy="3">v</tspan><tspan dy="-3"></tspan>)</text>
  <text x="367.0" y="212.0" font-size="13" text-anchor="start"><tspan font-style="italic" style="font-family: var(--figure-serif)">g, β</tspan></text>
  <text x="367.0" y="226.0" font-size="13" text-anchor="start" style="font-family: var(--figure-mono); fill: var(--figure-muted)">(T, H<tspan dy="3">v</tspan><tspan dy="-3"></tspan>)</text>
  <text x="207" y="154" font-size="13"><tspan font-style="italic" style="font-family: var(--figure-serif)">y</tspan> <tspan style="font-family: var(--figure-mono); fill: var(--figure-muted)">(T, H<tspan dy="3">v</tspan><tspan dy="-3"></tspan>, d<tspan dy="3">v</tspan><tspan dy="-3"></tspan>)</tspan></text>
  <text x="434" y="140" font-size="13" text-anchor="end"><tspan font-style="italic" style="font-family: var(--figure-serif)">z</tspan> <tspan style="font-family: var(--figure-mono); fill: var(--figure-muted)">(T, H<tspan dy="3">v</tspan><tspan dy="-3"></tspan>, d<tspan dy="3">v</tspan><tspan dy="-3"></tspan>)</tspan></text>
  <text x="207" y="88" font-size="13"><tspan font-style="italic" style="font-family: var(--figure-serif)">o</tspan> <tspan style="font-family: var(--figure-mono); fill: var(--figure-muted)">(T, H<tspan dy="3">v</tspan><tspan dy="-3"></tspan>·d<tspan dy="3">v</tspan><tspan dy="-3"></tspan>)</tspan></text>
</svg>
