    <polygon points="300.0,181.0 306.5,184.3 306.5,177.7"/>
    <line x1="200.0" y1="170.0" x2="200.0" y2="126.0" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="200.0,126.0 203.3,132.5 196.7,132.5"/>
    <polyline points="440.0,340.0 440.0,115.0 255.0,115.0" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="255.0,115.0 261.5,118.3 261.5,111.7"/>
    <line x1="200.0" y1="104.0" x2="200.0" y2="62.0" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="200.0,62.0 203.3,68.5 196.7,68.5"/>
