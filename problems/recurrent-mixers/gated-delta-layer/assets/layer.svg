<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 450">
  <title>The Gated DeltaNet token mixer</title>
  <desc>Read from the bottom: projection, convolution over saved rows, split into q, k, v, the recurrence on S, then a gated norm and the output projection.</desc>
  <!-- Wires: the main column is x = 200; gates run at x = 360 and z at x = 440. -->
  <g>
    <line x1="200.0" y1="426.0" x2="200.0" y2="362.0" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="200.0,362.0 203.3,368.5 196.7,368.5"/>
