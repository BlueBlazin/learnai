    <polygon points="90.0,304.0 96.5,307.3 96.5,300.7"/>
    <line x1="90.0" y1="176.0" x2="135.0" y2="176.0" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <polygon points="135.0,176.0 128.5,179.3 128.5,172.7"/>
