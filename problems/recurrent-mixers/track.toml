id = "recurrent-mixers"
title = "Recurrent and Hybrid Mixers"
description = "Standard attention remembers every past token by growing its KV cache forever, which gets expensive at long context lengths. Modern hybrid architectures pair attention with recurrent layers that compress history into a fixed-size state. Implement the gated delta rule, Mamba-2 state-space steps, gated convolutions, and a hybrid decoder that blends both worlds."
