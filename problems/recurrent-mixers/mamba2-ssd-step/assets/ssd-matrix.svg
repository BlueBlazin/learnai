<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190">
  <title>The matrix M of the three-token example</title>
  <desc>A 3 by 3 grid, rows t and columns s. Cells on and below the diagonal hold M and fade with decay; cells above are zero.</desc>
  <!-- Geometry: cells are 70 x 34 from x = 130, y = 40. -->
  <text x="235" y="16" font-size="13" text-anchor="middle" font-style="italic" style="font-family: var(--figure-serif)">M</text>
  <text x="165" y="34" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)"><tspan font-style="italic" style="font-family: var(--figure-serif)">s</tspan> = 0</text>
  <text x="235" y="34" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)"><tspan font-style="italic" style="font-family: var(--figure-serif)">s</tspan> = 1</text>
  <text x="305" y="34" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)"><tspan font-style="italic" style="font-family: var(--figure-serif)">s</tspan> = 2</text>
  <text x="122" y="62" font-size="13" text-anchor="end" style="fill: var(--figure-muted)"><tspan font-style="italic" style="font-family: var(--figure-serif)">t</tspan> = 0</text>
  <text x="122" y="96" font-size="13" text-anchor="end" style="fill: var(--figure-muted)"><tspan font-style="italic" style="font-family: var(--figure-serif)">t</tspan> = 1</text>
  <text x="122" y="130" font-size="13" text-anchor="end" style="fill: var(--figure-muted)"><tspan font-style="italic" style="font-family: var(--figure-serif)">t</tspan> = 2</text>
  <rect x="130" y="40" width="70" height="34" stroke="currentColor" stroke-width="1" fill-opacity="0.4" style="fill: var(--figure-accent)"/>
  <text x="165.0" y="62.0" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">0.5</text>
  <rect x="200" y="40" width="70" height="34" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
  <text x="235.0" y="62.0" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">0</text>
  <rect x="270" y="40" width="70" height="34" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
  <text x="305.0" y="62.0" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">0</text>
  <rect x="130" y="74" width="70" height="34" stroke="currentColor" stroke-width="1" fill-opacity="0.2" style="fill: var(--figure-accent)"/>
  <text x="165.0" y="96.0" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">0.5</text>
  <rect x="200" y="74" width="70" height="34" stroke="currentColor" stroke-width="1" fill-opacity="0.4" style="fill: var(--figure-accent)"/>
  <text x="235.0" y="96.0" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">1</text>
  <rect x="270" y="74" width="70" height="34" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)"/>
  <text x="305.0" y="96.0" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">0</text>
  <rect x="130" y="108" width="70" height="34" stroke="currentColor" stroke-width="1" fill-opacity="0.05" style="fill: var(--figure-accent)"/>
  <text x="165.0" y="130.0" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">0.0625</text>
  <rect x="200" y="108" width="70" height="34" stroke="currentColor" stroke-width="1" fill-opacity="0.1" style="fill: var(--figure-accent)"/>
  <text x="235.0" y="130.0" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">−0.125</text>
  <rect x="270" y="108" width="70" height="34" stroke="currentColor" stroke-width="1" fill-opacity="0.4" style="fill: var(--figure-accent)"/>
  <text x="305.0" y="130.0" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">1</text>
  <rect x="130" y="108" width="70" height="34" fill="none" stroke-width="2.5" style="stroke: var(--figure-straw)"/>
  <text x="240" y="172" font-size="13" text-anchor="middle" style="fill: var(--figure-straw)"><tspan font-style="italic" style="font-family: var(--figure-serif)">M</tspan><tspan dy="3">2,0</tspan><tspan dy="-3"></tspan><tspan dy="-3" style="font-family: var(--figure-mono)"> = 1 · 0.125 · 0.5 = 0.0625</tspan></text>
</svg>
