<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 232" font-size="13">
  <title>The per-layer state of a four-layer hybrid decoder</title>
  <desc>Four stacked layers, three linear-attention and one full-attention. Each linear-attention layer has a fixed-width state box, and the full-attention layer has one key and value column per token.</desc>

  <!-- the stack, layer 0 at the bottom -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="158" width="150" height="30" rx="3"/>
    <rect x="20" y="118" width="150" height="30" rx="3"/>
    <rect x="20" y="78" width="150" height="30" rx="3"/>
    <rect x="20" y="38" width="150" height="30" rx="3" style="fill: var(--figure-attn); stroke: var(--figure-accent)"/>
  </g>
  <text x="32" y="178">0  linear attention</text>
  <text x="32" y="138">1  linear attention</text>
  <text x="32" y="98">2  linear attention</text>
  <text x="32" y="58" style="fill: var(--figure-accent)">3  full attention</text>

  <!-- the stream through the stack -->
  <line x1="95" y1="214" x2="95" y2="192" stroke="currentColor" stroke-width="1"/>
  <polygon points="95,188 91,196 99,196"/>
  <line x1="95" y1="38" x2="95" y2="22" stroke="currentColor" stroke-width="1"/>
  <polygon points="95,16 91,24 99,24"/>
  <text x="103" y="212" style="fill: var(--figure-muted)">tokens</text>
  <text x="103" y="24" style="fill: var(--figure-muted)">logits</text>

  <!-- state of the linear-attention layers: fixed size -->
  <g stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)">
    <rect x="210" y="161" width="116" height="24"/>
    <rect x="210" y="121" width="116" height="24"/>
    <rect x="210" y="81" width="116" height="24"/>
  </g>
  <g style="font-family: var(--figure-mono)">
    <text x="216" y="178">conv_state, S</text>
    <text x="216" y="138">conv_state, S</text>
    <text x="216" y="98">conv_state, S</text>
  </g>
  <g fill="none" style="stroke: var(--figure-faint)" stroke-width="1">
    <line x1="170" y1="173" x2="210" y2="173"/>
    <line x1="170" y1="133" x2="210" y2="133"/>
    <line x1="170" y1="93" x2="210" y2="93"/>
    <line x1="170" y1="53" x2="210" y2="53"/>
  </g>
  <text x="332" y="138" style="fill: var(--figure-muted)">the same size after</text>
  <text x="332" y="154" style="fill: var(--figure-muted)">any number of tokens</text>

  <!-- state of the attention layer: one column per token -->
  <g fill="none" stroke-width="1" style="stroke: var(--figure-accent)">
    <rect x="210" y="41" width="22" height="24" style="fill: var(--figure-cache)"/>
    <rect x="232" y="41" width="22" height="24" style="fill: var(--figure-cache)"/>
    <rect x="254" y="41" width="22" height="24" style="fill: var(--figure-cache)"/>
    <rect x="276" y="41" width="22" height="24" style="fill: var(--figure-cache)"/>
    <rect x="298" y="41" width="22" height="24" stroke-dasharray="3 3"/>
  </g>
  <g style="font-family: var(--figure-mono); fill: var(--figure-accent)" font-size="13">
    <text x="216" y="58">0</text>
    <text x="238" y="58">1</text>
    <text x="260" y="58">2</text>
    <text x="282" y="58">3</text>
  </g>
  <text x="330" y="50" style="fill: var(--figure-accent)">k, v: one column</text>
  <text x="330" y="66" style="fill: var(--figure-accent)">per token seen</text>
</svg>
