id = "real-hybrid-logits"
title = "Matching a Hybrid Model's Logits"
track = "real-hybrid-model"
order = 30
difficulty = "hard"
frameworks = ["torch", "jax", "mlx"]
judges = ["numeric"]
tags = ["forward-pass", "qwen", "hybrid-decoder", "gated-attention", "partial-rope", "real-model", "checkpoint-porting", "logits"]
prerequisites = ["real-gdn-block", "hybrid-decoder-forward", "partial-rope", "real-model-logits"]
requires = "cpu"
entry = ["qwen_logits"]
# The first case on the real model decodes the 752 M weights of the text decoder from
# bfloat16 and hands them to the framework (about 1 s, once per run); a forward pass of
# 12 tokens is then 0.1 to 0.5 s, and 2 to 3.5 s the first time JAX sees the shapes.
time_limit_s = 20
# The statement's rule: run the forward pass yourself. The kit's delta layer (the
# dispatcher and the per-framework functions behind it), its one-step and gate oracles,
# and its reference blocks and models may not be called from the solution, and the
# libraries that already implement this model may not be imported. Rejects the mutant
# uses_kit_layer.
forbidden = [
    "learnai.kit.ops.gated_delta_layer",
    "learnai.kit.gdn.gdn_layer_ref",
    "learnai.kit.gdn.gdn_step_ref",
    "learnai.kit.gdn.gdn_gates_ref",
    "learnai.kit.hybrid.hybrid_block_ref",
    "learnai.kit.hybrid.hybrid_forward_ref",
    "learnai.kit.hybrid.gated_attention_ref",
    "learnai.kit.hybrid._block",
    "learnai.kit.realhybrid.RealHybrid",
    "learnai.kit.realhybrid.RealHybridLM",
]
# Package names only: a learner does not name a variable after these by accident.
forbidden_source = ["transformers", "safetensors", "mlx_lm"]

# The weights, plus config.json, which the kit reads the architecture from.
[[assets]]
