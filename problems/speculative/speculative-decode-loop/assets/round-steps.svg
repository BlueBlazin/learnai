<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 164">
  <title>Round 1 of the first example: draft, verify, accept, roll back</title>
  <desc>Four frames over eight token positions. They show the drafts, the target's first token, the rejection, and both caches cut back to the four prompt tokens.</desc>
  <!-- Geometry: token position c is the column x = 122 + 34 c; the rows are the sequence, the target's greedy tokens, and the two caches. -->
  <!-- A target token sits in the column of the position it predicts, under the draft it is compared with. -->
  <!-- Frames are the groups step-1 to step-4; the app shows one at a time. Their desc is the note of the step. -->

  <!-- Row names: drawn in every frame -->
  <g font-size="13" text-anchor="end">
    <text x="112" y="39.5">tokens</text>
    <text x="112" y="83.5">target says</text>
    <text x="112" y="121.5">draft cache</text>
    <text x="112" y="151.5">target cache</text>
  </g>

  <!-- Draft: four draft calls, 0 17 42 5, then 33, 40, 33 -->
  <g id="step-1">
    <desc>The draft model reads the prompt and its first three proposals, so its cache holds 7 tokens.</desc>
    <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
      <text x="190" y="16.5">prompt</text>
      <text x="326" y="16.5">drafts</text>
    </g>
    <rect x="124" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="139" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">0</text>
    <rect x="158" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="173" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">17</text>
    <rect x="192" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="207" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">42</text>
    <rect x="226" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="241" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">5</text>
    <rect x="260" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="275" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">33</text>
    <rect x="294" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="309" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">40</text>
    <rect x="328" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="343" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">33</text>
    <rect x="362" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="377" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">33</text>
    <rect x="124" y="106" width="234" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="241" y="121.5" font-size="13" text-anchor="middle">7 tokens</text>
    <text x="124" y="151.5" font-size="13" style="fill: var(--figure-muted)">none</text>
  </g>

  <!-- Verify: one target call on 0 17 42 5 33 40 33 33 -->
  <g id="step-2">
    <desc>One target call reads all 8 tokens and gives its own token for five positions, starting with 42.</desc>
    <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
      <text x="190" y="16.5">prompt</text>
      <text x="326" y="16.5">drafts</text>
    </g>
    <rect x="124" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="139" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">0</text>
    <rect x="158" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="173" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">17</text>
    <rect x="192" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="207" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">42</text>
    <rect x="226" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="241" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">5</text>
    <rect x="260" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="275" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">33</text>
    <rect x="294" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="309" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">40</text>
    <rect x="328" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="343" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">33</text>
    <rect x="362" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="377" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">33</text>
    <rect x="260" y="68" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="275" y="83.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">42</text>
    <rect x="294" y="68" width="132" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="360" y="83.5" font-size="13" text-anchor="middle">…</text>
    <rect x="124" y="106" width="234" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="241" y="121.5" font-size="13" text-anchor="middle">7 tokens</text>
    <rect x="124" y="136" width="268" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="258" y="151.5" font-size="13" text-anchor="middle">8 tokens</text>
  </g>

  <!-- Accept: d1 = 33 against g0 = 42, n = 0 -->
  <g id="step-3">
    <desc>The first draft, 33, is not the target's 42, so no draft is accepted and the round generates 42.</desc>
    <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
      <text x="190" y="16.5">prompt</text>
      <text x="326" y="16.5">drafts</text>
    </g>
    <rect x="124" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="139" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">0</text>
    <rect x="158" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="173" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">17</text>
    <rect x="192" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="207" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">42</text>
    <rect x="226" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="241" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">5</text>
    <rect x="260" y="24" width="30" height="22" rx="3" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-muted)"/>
    <text x="275" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">33</text>
    <rect x="294" y="24" width="30" height="22" rx="3" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-muted)"/>
    <text x="309" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">40</text>
    <rect x="328" y="24" width="30" height="22" rx="3" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-muted)"/>
    <text x="343" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">33</text>
    <rect x="362" y="24" width="30" height="22" rx="3" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-muted)"/>
    <text x="377" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">33</text>
    <text x="275" y="61.5" font-size="13" text-anchor="middle">≠</text>
    <rect x="260" y="68" width="30" height="22" rx="3" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
    <text x="275" y="83.5" font-size="13" text-anchor="middle" font-weight="600" style="font-family: var(--figure-mono)">42</text>
    <rect x="294" y="68" width="132" height="22" rx="3" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-muted)"/>
    <text x="360" y="83.5" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">…</text>
    <text x="434" y="83.5" font-size="13" style="font-family: var(--figure-serif)"><tspan font-style="italic">n</tspan> = 0</text>
    <rect x="124" y="106" width="234" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="241" y="121.5" font-size="13" text-anchor="middle">7 tokens</text>
    <rect x="124" y="136" width="268" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="258" y="151.5" font-size="13" text-anchor="middle">8 tokens</text>
  </g>

  <!-- Roll back: target cache 4 of 8, draft cache 4 of 7 -->
  <g id="step-4">
    <desc>Both caches are cut back to the 4 prompt tokens, and round 2 feeds each model the new 42.</desc>
    <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
      <text x="190" y="16.5">prompt</text>
      <text x="275" y="16.5">generated</text>
    </g>
    <rect x="124" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="139" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">0</text>
    <rect x="158" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="173" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">17</text>
    <rect x="192" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="207" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">42</text>
    <rect x="226" y="24" width="30" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="241" y="39.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">5</text>
    <rect x="260" y="24" width="30" height="22" rx="3" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
    <text x="275" y="39.5" font-size="13" text-anchor="middle" font-weight="600" style="font-family: var(--figure-mono)">42</text>
    <rect x="124" y="106" width="132" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="190" y="121.5" font-size="13" text-anchor="middle">4 tokens</text>
    <rect x="260" y="106" width="98" height="22" rx="5" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-muted)"/>
    <rect x="124" y="136" width="132" height="22" rx="5" stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)"/>
    <text x="190" y="151.5" font-size="13" text-anchor="middle">4 tokens</text>
    <rect x="260" y="136" width="132" height="22" rx="5" fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-muted)"/>
  </g>
</svg>
