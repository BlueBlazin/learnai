    <rect x="317" y="170" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="359" y="170" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="422" y="170" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="296" y="191" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="317" y="191" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="338" y="191" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="380" y="191" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="443" y="191" width="13" height="13" style="fill: var(--figure-attn)"/>
  </g>
  <text x="376" y="228" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">row attends to column</text>
</svg>
