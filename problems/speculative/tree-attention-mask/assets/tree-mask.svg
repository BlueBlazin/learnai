    <line x1="397" y1="40" x2="397" y2="208"/>
    <line x1="292" y1="166" x2="460" y2="166"/>
    <line x1="418" y1="40" x2="418" y2="208"/>
    <line x1="292" y1="187" x2="460" y2="187"/>
    <line x1="439" y1="40" x2="439" y2="208"/>
    <line x1="292" y1="208" x2="460" y2="208"/>
    <line x1="460" y1="40" x2="460" y2="208"/>
  </g>
  <g>
    <rect x="296" y="44" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="296" y="65" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="317" y="65" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="296" y="86" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="317" y="86" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="338" y="86" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="296" y="107" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="317" y="107" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="359" y="107" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="296" y="128" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="317" y="128" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="338" y="128" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="380" y="128" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="296" y="149" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="317" y="149" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="338" y="149" width="13" height="13" style="fill: var(--figure-attn)"/>
    <rect x="401" y="149" width="13" height="13" style="fill: var(--figure-attn)"/>
