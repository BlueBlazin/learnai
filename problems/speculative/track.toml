id = "speculative"
title = "Speculative and Accelerated Decoding"
description = "Modern CPUs stay fast by guessing which branch a program will take and verifying the guess in parallel. Speculative decoding brings the same idea to language models, using a small draft model to propose several tokens that the large model checks in a single forward pass. You will implement the draft-and-verify loops and exact rejection sampling rules that multiply speed without changing the output distribution."
