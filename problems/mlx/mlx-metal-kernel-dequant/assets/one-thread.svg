<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <title>What the thread at column 37 of row 0 reads and writes in the worked example</title>
  <desc>Four rows of boxes for element 37 of row 0, the eight words, the code within word 4, the scale and bias of group 1, and the output weights.</desc>
  <!-- The eight words of row 0 -->
  <text x="10" y="14" font-size="13"><tspan style="font-family: var(--figure-mono)">words</tspan>, row 0: 8 words of 8 codes each</text>
  <rect x="10" y="22" width="54" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="37" y="39" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">0</text>
  <rect x="68" y="22" width="54" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="95" y="39" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">1</text>
  <rect x="126" y="22" width="54" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="153" y="39" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">2</text>
  <rect x="184" y="22" width="54" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="211" y="39" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">3</text>
  <rect x="242" y="22" width="54" height="24" rx="3" fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)"/>
  <text x="269" y="39" font-size="13" text-anchor="middle" style="fill: var(--figure-accent)">word 4</text>
  <rect x="300" y="22" width="54" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="327" y="39" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">5</text>
  <rect x="358" y="22" width="54" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="385" y="39" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">6</text>
  <rect x="416" y="22" width="54" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="443" y="39" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">7</text>
  <text x="10" y="64" font-size="13" style="fill: var(--figure-muted)">column 37 is in word 37 / 8 = 4</text>
  <!-- Word 4 opened into its eight codes -->
  <line x1="269" y1="46" x2="269" y2="76" fill="none" stroke-width="1" style="stroke: var(--figure-faint)"/>
  <rect x="10" y="78" width="460" height="26" fill="none" stroke="currentColor" stroke-width="1"/>
  <line x1="67.5" y1="78" x2="67.5" y2="104" fill="none" stroke="currentColor" stroke-width="1"/>
  <line x1="125.0" y1="78" x2="125.0" y2="104" fill="none" stroke="currentColor" stroke-width="1"/>
  <line x1="182.5" y1="78" x2="182.5" y2="104" fill="none" stroke="currentColor" stroke-width="1"/>
  <line x1="240.0" y1="78" x2="240.0" y2="104" fill="none" stroke="currentColor" stroke-width="1"/>
  <line x1="297.5" y1="78" x2="297.5" y2="104" fill="none" stroke="currentColor" stroke-width="1"/>
  <line x1="355.0" y1="78" x2="355.0" y2="104" fill="none" stroke="currentColor" stroke-width="1"/>
  <line x1="412.5" y1="78" x2="412.5" y2="104" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="38.8" y="96" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">7</text>
  <text x="96.3" y="96" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">6</text>
  <rect x="125.0" y="78" width="57.5" height="26" fill="none" stroke-width="2" style="stroke: var(--figure-accent)"/>
  <text x="153.8" y="96" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-accent)">5</text>
  <text x="211.3" y="96" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">4</text>
  <text x="268.8" y="96" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">3</text>
  <text x="326.3" y="96" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">2</text>
  <text x="383.8" y="96" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">1</text>
  <text x="441.3" y="96" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">0</text>
  <g font-size="13" style="fill: var(--figure-muted)">
    <text x="10" y="122">bit 31</text>
    <text x="470" y="122" text-anchor="end">bit 0</text>
    <text x="240" y="122" text-anchor="middle">code 37 % 8 = 5: shift right by 4 · 5 = 20, mask 0xF</text>
  </g>
  <!-- The scales and biases of row 0 -->
  <text x="10" y="150" font-size="13"><tspan style="font-family: var(--figure-mono)">scales</tspan>, <tspan style="font-family: var(--figure-mono)">biases</tspan>, row 0: one pair per group of 32 columns</text>
  <rect x="10" y="158" width="226" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="123" y="175" font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">group 0: 0.5, 1.0</text>
  <rect x="244" y="158" width="226" height="24" rx="3" fill="none" stroke-width="1.5" stroke-dasharray="5 3" style="stroke: var(--figure-straw)"/>
  <text x="357" y="175" font-size="13" text-anchor="middle" style="fill: var(--figure-straw)">group 37 / 32 = 1: −0.25, 2.0</text>
  <!-- The output row -->
  <text x="10" y="212" font-size="13"><tspan style="font-family: var(--figure-mono)">out</tspan>, row 0: 64 weights, one thread each</text>
  <rect x="10" y="220" width="460" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="275.9" y="220" width="7.2" height="22" style="fill: var(--figure-accent)"/>
  <line x1="279.5" y1="242" x2="279.5" y2="256" fill="none" stroke-width="1" style="stroke: var(--figure-accent)"/>
  <g font-size="13" style="fill: var(--figure-muted)">
    <text x="10" y="258">column 0</text>
    <text x="470" y="258" text-anchor="end">63</text>
  </g>
  <text x="279.5" y="272" font-size="13" text-anchor="middle" style="fill: var(--figure-accent)">column 37</text>
  <text x="240" y="292" font-size="13" text-anchor="middle">out[0, 37] = 5 · (−0.25) + 2.0 = 0.75</text>
</svg>
