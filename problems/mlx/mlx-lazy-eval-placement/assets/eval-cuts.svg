<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 214">
  <title>One evaluation per generated token cuts the lazy graph between steps</title>
  <desc>Three generation steps side by side, joined by arrows for the cache, the token, and the log-probability. A dashed line labeled mx.eval crosses the arrows between steps.</desc>

  <!-- Geometry: step centers at x = 80, 240, 400; evaluation cuts at x = 160 and 320. -->

  <!-- Step titles -->
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="80" y="14">step 1</text>
    <text x="240" y="14">step 2</text>
    <text x="400" y="14">step 3</text>
  </g>

  <!-- The evaluation cuts -->
  <g fill="none" stroke-width="1.5" stroke-dasharray="5 4" style="stroke: var(--figure-straw)">
    <line x1="160" y1="22" x2="160" y2="190"/>
    <line x1="320" y1="22" x2="320" y2="190"/>
  </g>
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-straw)">
    <text x="160" y="208">mx.eval</text>
    <text x="320" y="208">mx.eval</text>
  </g>

  <!-- Boxes: one lazy graph per step -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="45" y="30" width="70" height="30" rx="3"/>
    <rect x="205" y="30" width="70" height="30" rx="3"/>
    <rect x="365" y="30" width="70" height="30" rx="3"/>
    <rect x="50" y="112" width="60" height="24" rx="3"/>
    <rect x="210" y="112" width="60" height="24" rx="3"/>
    <rect x="370" y="112" width="60" height="24" rx="3"/>
  </g>
  <g fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)">
    <rect x="44" y="158" width="72" height="24" rx="3"/>
    <rect x="204" y="158" width="72" height="24" rx="3"/>
    <rect x="364" y="158" width="72" height="24" rx="3"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="80" y="50">model</text>
    <text x="240" y="50">model</text>
    <text x="400" y="50">model</text>
    <text x="80" y="91">logits</text>
    <text x="240" y="91">logits</text>
    <text x="400" y="91">logits</text>
    <text x="80" y="129">token</text>
    <text x="240" y="129">token</text>
    <text x="400" y="129">token</text>
  </g>
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-accent)">
    <text x="80" y="175">logprob</text>
    <text x="240" y="175">logprob</text>
    <text x="400" y="175">logprob</text>
  </g>

  <!-- Inside a step: model -> logits -> token -> logprob -->
  <g fill="none" stroke="currentColor" stroke-width="1">
    <line x1="80" y1="60" x2="80" y2="71"/>
    <line x1="240" y1="60" x2="240" y2="71"/>
    <line x1="400" y1="60" x2="400" y2="71"/>
    <line x1="80" y1="96" x2="80" y2="105"/>
    <line x1="240" y1="96" x2="240" y2="105"/>
    <line x1="400" y1="96" x2="400" y2="105"/>
    <line x1="80" y1="136" x2="80" y2="151"/>
    <line x1="240" y1="136" x2="240" y2="151"/>
    <line x1="400" y1="136" x2="400" y2="151"/>
  </g>
  <g>
    <polygon points="80,78 76.5,71 83.5,71"/>
    <polygon points="240,78 236.5,71 243.5,71"/>
    <polygon points="400,78 396.5,71 403.5,71"/>
    <polygon points="80,112 76.5,105 83.5,105"/>
    <polygon points="240,112 236.5,105 243.5,105"/>
    <polygon points="400,112 396.5,105 403.5,105"/>
    <polygon points="80,158 76.5,151 83.5,151"/>
    <polygon points="240,158 236.5,151 243.5,151"/>
    <polygon points="400,158 396.5,151 403.5,151"/>
  </g>

  <!-- Across steps: the cache and the token feed the next model call -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <line x1="115" y1="39" x2="198" y2="39"/>
    <line x1="275" y1="39" x2="358" y2="39"/>
    <polyline points="110,124 184,124 184,52 198,52"/>
    <polyline points="270,124 344,124 344,52 358,52"/>
  </g>
  <g>
    <polygon points="205,39 198,35.5 198,42.5"/>
    <polygon points="365,39 358,35.5 358,42.5"/>
    <polygon points="205,52 198,48.5 198,55.5"/>
    <polygon points="365,52 358,48.5 358,55.5"/>
  </g>
  <g font-size="13" style="fill: var(--figure-muted)">
    <text x="119" y="33">cache</text>
    <text x="279" y="33">cache</text>
  </g>

  <!-- Across steps: the running log-probability, the one chain that bypasses the token -->
  <g fill="none" stroke-width="1.5" style="stroke: var(--figure-accent)">
    <line x1="116" y1="170" x2="197" y2="170"/>
    <line x1="276" y1="170" x2="357" y2="170"/>
  </g>
  <g style="fill: var(--figure-accent)">
    <polygon points="204,170 197,166.5 197,173.5"/>
    <polygon points="364,170 357,166.5 357,173.5"/>
  </g>
</svg>
