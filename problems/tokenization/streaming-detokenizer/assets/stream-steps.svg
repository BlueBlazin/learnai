<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 122">
  <title>Steps 3 to 6 of the streaming example: bytes received, pending, and returned</title>
  <desc>Four frames. Each shows the nine bytes of four tokens as a strip, the bytes held back, and the text the step returns.</desc>
  <!-- Geometry: byte j is at x = 104 + 38 j, 36 wide. The strip is the row y = 34..60; the returned text is set at y = 88.5. -->
  <!-- Frames are the groups step-1 to step-4, for steps 3 to 6 of the example; the app shows one at a time. -->

  <!-- In every frame: the step of each token, the row names, and the key -->
  <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
    <path d="M104 28 v-5 H216 v5"/>
    <path d="M218 28 v-5 H292 v5"/>
    <path d="M294 28 v-5 H368 v5"/>
    <path d="M370 28 v-5 H444 v5"/>
  </g>
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="160" y="16.5">3</text>
    <text x="255" y="16.5">4</text>
    <text x="331" y="16.5">5</text>
    <text x="407" y="16.5">6</text>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="94" y="16.5" style="fill: var(--figure-muted)">step</text>
    <text x="94" y="51.5">bytes</text>
    <text x="94" y="88.5">returned</text>
  </g>
  <rect x="104" y="104" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1" style="fill: var(--figure-cache)"/>
  <text x="124" y="114.5" font-size="13">pending</text>

  <!-- Step 3 of the example -->
  <g id="step-1">
    <desc>Step 3 brings three one-byte characters, and all three are returned.</desc>
    <!-- the token of this step -->
    <g fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="104" y="34" width="36" height="26" rx="3"/>
      <rect x="142" y="34" width="36" height="26" rx="3"/>
      <rect x="180" y="34" width="36" height="26" rx="3"/>
    </g>
    <!-- not yet received -->
    <g fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)">
      <rect x="218" y="34" width="36" height="26" rx="3"/>
      <rect x="256" y="34" width="36" height="26" rx="3"/>
      <rect x="294" y="34" width="36" height="26" rx="3"/>
      <rect x="332" y="34" width="36" height="26" rx="3"/>
      <rect x="370" y="34" width="36" height="26" rx="3"/>
      <rect x="408" y="34" width="36" height="26" rx="3"/>
    </g>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
      <text x="122" y="51.5">22</text>
      <text x="160" y="51.5">3A</text>
      <text x="198" y="51.5">20</text>
    </g>
    <path d="M104 65 v5 H216 v-5" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="160" y="88.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">": </text>
  </g>

  <!-- Step 4 of the example -->
  <g id="step-2">
    <desc>Step 4 brings F0 9F, the start of a four-byte character, so both bytes wait and nothing is returned.</desc>
    <!-- received in an earlier step -->
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="104" y="34" width="36" height="26" rx="3"/>
      <rect x="142" y="34" width="36" height="26" rx="3"/>
      <rect x="180" y="34" width="36" height="26" rx="3"/>
    </g>
    <!-- the token of this step, held back -->
    <g stroke="currentColor" stroke-width="1.5" style="fill: var(--figure-cache)">
      <rect x="218" y="34" width="36" height="26" rx="3"/>
      <rect x="256" y="34" width="36" height="26" rx="3"/>
    </g>
    <!-- not yet received -->
    <g fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)">
      <rect x="294" y="34" width="36" height="26" rx="3"/>
      <rect x="332" y="34" width="36" height="26" rx="3"/>
      <rect x="370" y="34" width="36" height="26" rx="3"/>
      <rect x="408" y="34" width="36" height="26" rx="3"/>
    </g>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
      <text x="122" y="51.5">22</text>
      <text x="160" y="51.5">3A</text>
      <text x="198" y="51.5">20</text>
      <text x="236" y="51.5">F0</text>
      <text x="274" y="51.5">9F</text>
    </g>
    <path d="M218 65 v5 H292 v-5" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="255" y="88.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">""</text>
  </g>

  <!-- Step 5 of the example -->
  <g id="step-3">
    <desc>Step 5 brings 98 80, which completes the character, and its four bytes are returned as one.</desc>
    <!-- received in an earlier step -->
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="104" y="34" width="36" height="26" rx="3"/>
      <rect x="142" y="34" width="36" height="26" rx="3"/>
      <rect x="180" y="34" width="36" height="26" rx="3"/>
      <rect x="218" y="34" width="36" height="26" rx="3"/>
      <rect x="256" y="34" width="36" height="26" rx="3"/>
    </g>
    <!-- the token of this step -->
    <g fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="294" y="34" width="36" height="26" rx="3"/>
      <rect x="332" y="34" width="36" height="26" rx="3"/>
    </g>
    <!-- not yet received -->
    <g fill="none" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--figure-faint)">
      <rect x="370" y="34" width="36" height="26" rx="3"/>
      <rect x="408" y="34" width="36" height="26" rx="3"/>
    </g>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
      <text x="122" y="51.5">22</text>
      <text x="160" y="51.5">3A</text>
      <text x="198" y="51.5">20</text>
      <text x="236" y="51.5">F0</text>
      <text x="274" y="51.5">9F</text>
      <text x="312" y="51.5">98</text>
      <text x="350" y="51.5">80</text>
    </g>
    <path d="M218 65 v5 H368 v-5" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="293" y="88.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">😀</text>
  </g>

  <!-- Step 6 of the example -->
  <g id="step-4">
    <desc>Step 6 brings two one-byte characters, and nothing is pending after it.</desc>
    <!-- received in an earlier step -->
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="104" y="34" width="36" height="26" rx="3"/>
      <rect x="142" y="34" width="36" height="26" rx="3"/>
      <rect x="180" y="34" width="36" height="26" rx="3"/>
      <rect x="218" y="34" width="36" height="26" rx="3"/>
      <rect x="256" y="34" width="36" height="26" rx="3"/>
      <rect x="294" y="34" width="36" height="26" rx="3"/>
      <rect x="332" y="34" width="36" height="26" rx="3"/>
    </g>
    <!-- the token of this step -->
    <g fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="370" y="34" width="36" height="26" rx="3"/>
      <rect x="408" y="34" width="36" height="26" rx="3"/>
    </g>
    <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
      <text x="122" y="51.5">22</text>
      <text x="160" y="51.5">3A</text>
      <text x="198" y="51.5">20</text>
      <text x="236" y="51.5">F0</text>
      <text x="274" y="51.5">9F</text>
      <text x="312" y="51.5">98</text>
      <text x="350" y="51.5">80</text>
      <text x="388" y="51.5">22</text>
      <text x="426" y="51.5">7D</text>
    </g>
    <path d="M370 65 v5 H444 v-5" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="407" y="88.5" font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">"}</text>
  </g>
</svg>
