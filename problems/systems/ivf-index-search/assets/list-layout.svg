<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190">
  <title>The storage layout of the inverted lists in the worked example</title>
  <desc>Two rows of six cells. The upper row, ids, holds the corpus indices 0, 2, 3, 1, 4, 5; the lower row, vectors, holds the corresponding vectors. The first three cells form list 0 and the next three form list 1. The offsets 0, 3, 6, 6 mark the boundaries below: list 2 starts and ends at 6, so it is empty.</desc>
  <!-- list 1 is highlighted: it is the list a query near centroid 1 scans -->
  <rect x="250" y="34" width="180" height="88" style="fill: var(--figure-accent); fill-opacity: 0.14; stroke: none"/>
  <!-- cells -->
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="70" y="40" width="360" height="30"/>
    <rect x="70" y="86" width="360" height="30"/>
    <line x1="130" y1="40" x2="130" y2="70"/><line x1="190" y1="40" x2="190" y2="70"/>
    <line x1="310" y1="40" x2="310" y2="70"/><line x1="370" y1="40" x2="370" y2="70"/>
    <line x1="130" y1="86" x2="130" y2="116"/><line x1="190" y1="86" x2="190" y2="116"/>
    <line x1="310" y1="86" x2="310" y2="116"/><line x1="370" y1="86" x2="370" y2="116"/>
  </g>
  <!-- list boundaries -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <line x1="70" y1="30" x2="70" y2="134"/>
    <line x1="250" y1="30" x2="250" y2="134"/>
    <line x1="430" y1="30" x2="430" y2="134"/>
  </g>
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
    <text x="100" y="60">0</text><text x="160" y="60">2</text><text x="220" y="60">3</text>
    <text x="280" y="60">1</text><text x="340" y="60">4</text><text x="400" y="60">5</text>
    <text x="100" y="106">1,0</text><text x="160" y="106">0,1</text><text x="220" y="106">2,0</text>
    <text x="280" y="106">4,1</text><text x="340" y="106">5,0</text><text x="400" y="106">3,-1</text>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="60" y="60">ids</text>
    <text x="60" y="106">vectors</text>
    <text x="60" y="152" style="fill: var(--figure-muted)">offsets</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="160" y="22">list 0</text>
    <text x="340" y="22" style="fill: var(--figure-accent)">list 1</text>
  </g>
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono); fill: var(--figure-muted)">
    <text x="70" y="152">0</text>
    <text x="250" y="152">3</text>
    <text x="424" y="152">6</text>
    <text x="442" y="152">6</text>
  </g>
  <text x="433" y="176" font-size="13" text-anchor="end" style="fill: var(--figure-muted)">list 2 is empty: it starts and ends at 6</text>
</svg>
