<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 184">
  <title>The pipeline of the example: five tokens over two stages</title>
  <desc>One row per stage over 18 ms. Tokens of a, b, and c run on stage 0, cross to stage 1, and finish at 18 ms.</desc>
  <!-- Geometry: x = 64 + 21 t (ms); stage 0 bars at y = 44, stage 1 bars at y = 104, 22 high. -->
  <!-- legend -->
  <g font-size="13">
    <line x1="64" y1="12" x2="86" y2="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="92" y="17">transfer, 1 ms</text>
    <line x1="212" y1="12" x2="234" y2="12" fill="none" stroke-width="1.5" stroke-dasharray="3 3" style="stroke: var(--figure-straw)"/>
    <text x="240" y="17" style="fill: var(--figure-straw)">waiting for the stage</text>
  </g>
  <g font-size="13"><text x="6" y="59.5">stage 0</text><text x="6" y="119.5">stage 1</text></g>
  <!-- Waiting at stage 1: from the transfer to the start -->
  <g fill="none" stroke-width="1.5" stroke-dasharray="3 3" style="stroke: var(--figure-straw)">
    <line x1="169" y1="115" x2="190" y2="115"/>
    <line x1="211" y1="115" x2="253" y2="115"/>
    <line x1="253" y1="115" x2="316" y2="115"/>
    <line x1="316" y1="115" x2="379" y2="115"/>
  </g>
  <!-- Transfers -->
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <line x1="106" y1="66" x2="124" y2="98.5"/>
    <line x1="148" y1="66" x2="166" y2="98.5"/>
    <line x1="190" y1="66" x2="208" y2="98.5"/>
    <line x1="232" y1="66" x2="250" y2="98.5"/>
    <line x1="295" y1="66" x2="313" y2="98.5"/>
  </g>
  <g>
    <polygon points="127,104 120.7,99.5 126.5,96.3"/>
    <polygon points="169,104 162.7,99.5 168.5,96.3"/>
    <polygon points="211,104 204.7,99.5 210.5,96.3"/>
    <polygon points="253,104 246.7,99.5 252.5,96.3"/>
    <polygon points="316,104 309.7,99.5 315.5,96.3"/>
  </g>
  <!-- Jobs: a is tinted blue, b is open, c is tinted straw -->
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="64" y="44" width="42" height="22" style="fill: var(--figure-accent); fill-opacity: 0.22"/>
    <rect x="106" y="44" width="42" height="22" fill="none"/>
    <rect x="148" y="44" width="42" height="22" style="fill: var(--figure-straw); fill-opacity: 0.22"/>
    <rect x="190" y="44" width="42" height="22" style="fill: var(--figure-accent); fill-opacity: 0.22"/>
    <rect x="253" y="44" width="42" height="22" fill="none"/>
  </g>
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
    <text x="85" y="60">a[0]</text>
    <text x="127" y="60">b[0]</text>
    <text x="169" y="60">c[0]</text>
    <text x="211" y="60">a[1]</text>
    <text x="274" y="60">b[1]</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5">
    <rect x="127" y="104" width="63" height="22" style="fill: var(--figure-accent); fill-opacity: 0.22"/>
    <rect x="190" y="104" width="63" height="22" fill="none"/>
    <rect x="253" y="104" width="63" height="22" style="fill: var(--figure-straw); fill-opacity: 0.22"/>
    <rect x="316" y="104" width="63" height="22" style="fill: var(--figure-accent); fill-opacity: 0.22"/>
    <rect x="379" y="104" width="63" height="22" fill="none"/>
  </g>
  <g font-size="13" text-anchor="middle" style="font-family: var(--figure-mono)">
    <text x="158.5" y="120">a[0]</text>
    <text x="221.5" y="120">b[0]</text>
    <text x="284.5" y="120">c[0]</text>
    <text x="347.5" y="120">a[1]</text>
    <text x="410.5" y="120">b[1]</text>
  </g>
  <!-- Time axis -->
  <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
    <line x1="64" y1="138" x2="442" y2="138"/>
    <line x1="64" y1="138" x2="64" y2="143"/>
    <line x1="127" y1="138" x2="127" y2="143"/>
    <line x1="190" y1="138" x2="190" y2="143"/>
    <line x1="253" y1="138" x2="253" y2="143"/>
    <line x1="316" y1="138" x2="316" y2="143"/>
    <line x1="379" y1="138" x2="379" y2="143"/>
    <line x1="442" y1="138" x2="442" y2="143"/>
  </g>
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="64" y="158">0</text>
    <text x="127" y="158">3</text>
    <text x="190" y="158">6</text>
    <text x="253" y="158">9</text>
    <text x="316" y="158">12</text>
    <text x="379" y="158">15</text>
    <text x="442" y="158">18</text>
    <text x="253" y="176">time (ms)</text>
  </g>
</svg>
