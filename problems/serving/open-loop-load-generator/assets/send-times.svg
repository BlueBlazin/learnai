<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 268">
  <title>The four requests of the example, without a limit and with one request in flight</title>
  <desc>Two timelines with one row per request: when it is due, how long it waits, and when it is in flight. With the limit, requests 1 and 2 wait.</desc>
  <!-- Geometry: x = 56 + 160 * t (s); one row of 20 units per request, bars 12 high. -->
  <!-- legend -->
  <g font-size="13">
    <circle cx="60" cy="12" r="2.5" style="fill: var(--figure-straw)"/>
    <text x="68" y="17">due</text>
    <line x1="120" y1="12" x2="142" y2="12" fill="none" stroke-width="1.5" stroke-dasharray="3 3" style="stroke: var(--figure-straw)"/>
    <text x="148" y="17" style="fill: var(--figure-straw)">waiting</text>
    <rect x="226" y="6" width="22" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="254" y="17">in flight</text>
  </g>
  <!-- max_in_flight=None -->
  <g>
    <text x="8" y="38" font-size="13" style="font-family: var(--figure-mono)">max_in_flight=None</text>
    <text x="428" y="38" font-size="13" style="fill: var(--figure-muted)">latency</text>
    <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
      <line x1="56" y1="44" x2="56" y2="122"/>
      <line x1="136" y1="44" x2="136" y2="122"/>
      <line x1="216" y1="44" x2="216" y2="122"/>
      <line x1="296" y1="44" x2="296" y2="122"/>
      <line x1="376" y1="44" x2="376" y2="122"/>
    </g>
    <text x="8" y="56.5" font-size="13">req 0</text>
    <rect x="136" y="46" width="160" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="136" cy="52" r="2.5" style="fill: var(--figure-straw)"/>
    <text x="428" y="56.5" font-size="13">1.0 s</text>
    <text x="8" y="76.5" font-size="13">req 1</text>
    <rect x="176" y="66" width="40" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="176" cy="72" r="2.5" style="fill: var(--figure-straw)"/>
    <text x="428" y="76.5" font-size="13">0.25 s</text>
    <text x="8" y="96.5" font-size="13">req 2</text>
    <rect x="216" y="86" width="40" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="216" cy="92" r="2.5" style="fill: var(--figure-straw)"/>
    <text x="428" y="96.5" font-size="13">0.25 s</text>
    <text x="8" y="116.5" font-size="13">req 3</text>
    <rect x="376" y="106" width="40" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="376" cy="112" r="2.5" style="fill: var(--figure-straw)"/>
    <text x="428" y="116.5" font-size="13">0.25 s</text>
  </g>
  <!-- max_in_flight=1 -->
  <g>
    <text x="8" y="146" font-size="13" style="font-family: var(--figure-mono)">max_in_flight=1</text>
    <text x="428" y="146" font-size="13" style="fill: var(--figure-muted)">latency</text>
    <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
      <line x1="56" y1="152" x2="56" y2="230"/>
      <line x1="136" y1="152" x2="136" y2="230"/>
      <line x1="216" y1="152" x2="216" y2="230"/>
      <line x1="296" y1="152" x2="296" y2="230"/>
      <line x1="376" y1="152" x2="376" y2="230"/>
    </g>
    <text x="8" y="164.5" font-size="13">req 0</text>
    <rect x="136" y="154" width="160" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="136" cy="160" r="2.5" style="fill: var(--figure-straw)"/>
    <text x="428" y="164.5" font-size="13">1.0 s</text>
    <text x="8" y="184.5" font-size="13">req 1</text>
    <line x1="176" y1="180" x2="296" y2="180" fill="none" stroke-width="1.5" stroke-dasharray="3 3" style="stroke: var(--figure-straw)"/>
    <rect x="296" y="174" width="40" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="176" cy="180" r="2.5" style="fill: var(--figure-straw)"/>
    <text x="428" y="184.5" font-size="13">1.0 s</text>
    <text x="8" y="204.5" font-size="13">req 2</text>
    <line x1="216" y1="200" x2="336" y2="200" fill="none" stroke-width="1.5" stroke-dasharray="3 3" style="stroke: var(--figure-straw)"/>
    <rect x="336" y="194" width="40" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="216" cy="200" r="2.5" style="fill: var(--figure-straw)"/>
    <text x="428" y="204.5" font-size="13">1.0 s</text>
    <text x="8" y="224.5" font-size="13">req 3</text>
    <rect x="376" y="214" width="40" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="376" cy="220" r="2.5" style="fill: var(--figure-straw)"/>
    <text x="428" y="224.5" font-size="13">0.25 s</text>
  </g>
  <!-- the time axis -->
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="56" y="246">0</text>
    <text x="136" y="246">0.5</text>
    <text x="216" y="246">1.0</text>
    <text x="296" y="246">1.5</text>
    <text x="376" y="246">2.0</text>
    <text x="236" y="262">time (s)</text>
  </g>
</svg>
