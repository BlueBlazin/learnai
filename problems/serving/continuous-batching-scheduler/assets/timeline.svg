<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 226">
  <title>Timeline of the worked example: six requests sharing two slots under continuous batching</title>
  <desc>One row per request, time in milliseconds from 0 to 85, with the eight engine steps marked by vertical lines at 0, 14, 24, 35, 45, 55, 67, 76 and 85. Each request waits (dashed line) from its arrival until a slot is free, is prefilled during one step (filled bar), and then decodes one token per step (outlined bars) until it finishes. Requests 0 and 1 start together at 0; request 2 arrives at 5 and takes the slot of request 1 at 24; request 3 arrives at 45 and takes the slot of request 0 at once; request 4 follows request 2 at 55; request 5 starts at 67.</desc>
  <!-- Geometry: x = 52 + 4.9 * t (ms); one row of 24 units per request, bars 14 high. -->
  <!-- legend -->
  <g font-size="13">
    <rect x="52" y="6" width="22" height="12" style="fill: var(--figure-accent); stroke: var(--figure-accent)" stroke-width="1.5"/>
    <text x="80" y="17">prefill + first token</text>
    <rect x="222" y="6" width="22" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="250" y="17">decode, one token</text>
    <line x1="378" y1="12" x2="400" y2="12" fill="none" stroke-width="1.5" stroke-dasharray="3 3" style="stroke: var(--figure-straw)"/>
    <text x="406" y="17" style="fill: var(--figure-straw)">waiting</text>
  </g>
  <!-- step boundaries -->
  <g fill="none" stroke-width="1" style="stroke: var(--figure-faint)">
    <line x1="52.0" y1="34" x2="52.0" y2="184"/>
    <line x1="120.6" y1="34" x2="120.6" y2="184"/>
    <line x1="169.6" y1="34" x2="169.6" y2="184"/>
    <line x1="223.5" y1="34" x2="223.5" y2="184"/>
    <line x1="272.5" y1="34" x2="272.5" y2="184"/>
    <line x1="321.5" y1="34" x2="321.5" y2="184"/>
    <line x1="380.3" y1="34" x2="380.3" y2="184"/>
    <line x1="424.4" y1="34" x2="424.4" y2="184"/>
    <line x1="468.5" y1="34" x2="468.5" y2="184"/>
  </g>
  <g font-size="13" text-anchor="middle" style="fill: var(--figure-muted)">
    <text x="52.0" y="200">0</text>
    <text x="120.6" y="200">14</text>
    <text x="169.6" y="200">24</text>
    <text x="223.5" y="200">35</text>
    <text x="272.5" y="200">45</text>
    <text x="321.5" y="200">55</text>
    <text x="380.3" y="200">67</text>
    <text x="424.4" y="200">76</text>
    <text x="468.5" y="200">85</text>
    <text x="260.2" y="218">time (ms); vertical lines are step boundaries</text>
  </g>
  <!-- request 0 -->
  <g>
    <text x="8" y="56" font-size="13">req 0</text>
    <circle cx="52.0" cy="51" r="2.5" style="fill: var(--figure-straw)"/>
    <rect x="53.5" y="44" width="65.6" height="14" stroke-width="1.5" style="fill: var(--figure-accent); stroke: var(--figure-accent)"/>
    <rect x="122.1" y="44" width="46.0" height="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <rect x="171.1" y="44" width="50.9" height="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <rect x="225.0" y="44" width="46.0" height="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </g>
  <!-- request 1 -->
  <g>
    <text x="8" y="80" font-size="13">req 1</text>
    <circle cx="52.0" cy="75" r="2.5" style="fill: var(--figure-straw)"/>
    <rect x="53.5" y="68" width="65.6" height="14" stroke-width="1.5" style="fill: var(--figure-accent); stroke: var(--figure-accent)"/>
    <rect x="122.1" y="68" width="46.0" height="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </g>
  <!-- request 2 -->
  <g>
    <text x="8" y="104" font-size="13">req 2</text>
    <line x1="76.5" y1="99" x2="169.6" y2="99" fill="none" stroke-width="1.5" stroke-dasharray="3 3" style="stroke: var(--figure-straw)"/>
    <circle cx="76.5" cy="99" r="2.5" style="fill: var(--figure-straw)"/>
    <rect x="171.1" y="92" width="50.9" height="14" stroke-width="1.5" style="fill: var(--figure-accent); stroke: var(--figure-accent)"/>
    <rect x="225.0" y="92" width="46.0" height="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <rect x="274.0" y="92" width="46.0" height="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </g>
  <!-- request 3 -->
  <g>
    <text x="8" y="128" font-size="13">req 3</text>
    <circle cx="272.5" cy="123" r="2.5" style="fill: var(--figure-straw)"/>
    <rect x="274.0" y="116" width="46.0" height="14" stroke-width="1.5" style="fill: var(--figure-accent); stroke: var(--figure-accent)"/>
    <rect x="323.0" y="116" width="55.8" height="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </g>
  <!-- request 4 -->
  <g>
    <text x="8" y="152" font-size="13">req 4</text>
    <line x1="297.0" y1="147" x2="321.5" y2="147" fill="none" stroke-width="1.5" stroke-dasharray="3 3" style="stroke: var(--figure-straw)"/>
    <circle cx="297.0" cy="147" r="2.5" style="fill: var(--figure-straw)"/>
    <rect x="323.0" y="140" width="55.8" height="14" stroke-width="1.5" style="fill: var(--figure-accent); stroke: var(--figure-accent)"/>
  </g>
  <!-- request 5 -->
  <g>
    <text x="8" y="176" font-size="13">req 5</text>
    <line x1="346.0" y1="171" x2="380.3" y2="171" fill="none" stroke-width="1.5" stroke-dasharray="3 3" style="stroke: var(--figure-straw)"/>
    <circle cx="346.0" cy="171" r="2.5" style="fill: var(--figure-straw)"/>
    <rect x="381.8" y="164" width="41.1" height="14" stroke-width="1.5" style="fill: var(--figure-accent); stroke: var(--figure-accent)"/>
    <rect x="425.9" y="164" width="41.1" height="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </g>
</svg>
