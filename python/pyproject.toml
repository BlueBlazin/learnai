[project]
name = "learnai"
version = "0.5.0"
description = "Learn AI judge, kit, and CLI"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "torch>=2.15.0",
    "numpy>=2.5.4",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
    "starlette>=1.10.0",
]

[project.optional-dependencies]
jax = ["jax>=0.12.0.1"]
# MLX problems run on Apple silicon only. The marker keeps `--extra mlx` harmless on a
# Linux host (remote runs pass the same extras everywhere).
mlx = ["mlx>=0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Real-model problems (milestone 3): downloading assets, and the reference
# implementations that authors generate fixtures with. Never a base dependency: the
# judge, the kit loaders, and the app work without it (see learnai/assets.py).
models = [
    "huggingface_hub>=2.4.0",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.3",
    "transformers>=5.23.0",
    "mlx-lm>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# Editor intelligence in the app (completion, hover, diagnostics): the ty language
# server, one native binary. Pinned exactly because ty is in beta and its diagnostics
# and protocol behavior change between releases; core's managed `workspace/ty.toml`
# and its tests are written against this version.
editor = ["ty==0.0.104"]

[project.scripts]
learnai = "learnai.cli:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff"]

[build-system]
requires = ["uv_build>=0.9.26,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# A solution fixture that is deliberately not valid Python.
extend-exclude = ["tests/fixtures/solutions/syntax_error.py"]

[tool.ruff.lint.per-file-ignores]
# Starters import their framework for the learner before any code uses it.
"**/starter/*.py" = ["F401"]
# Fixture solutions misbehave on purpose.
"tests/fixtures/solutions/*.py" = ["S110", "BLE001"]
