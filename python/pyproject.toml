[project]
name = "whetstone"
version = "0.1.0"
description = "Whetstone judge, kit, and CLI"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "torch>=2.15.0",
    "numpy>=2.5.4",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
    "starlette>=1.10.0",
]

[project.optional-dependencies]
jax = ["jax>=0.12.0.1"]
mlx = ["mlx>=0.32.4"]

[project.scripts]
ws = "whetstone.cli:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff"]

[build-system]
requires = ["uv_build>=0.9.26,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# A solution fixture that is deliberately not valid Python.
extend-exclude = ["tests/fixtures/solutions/syntax_error.py"]

[tool.ruff.lint.per-file-ignores]
# Starters import their framework for the learner before any code uses it.
"**/starter/*.py" = ["F401"]
# Fixture solutions misbehave on purpose.
"tests/fixtures/solutions/*.py" = ["S110", "BLE001"]
